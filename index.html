/* ===== APK(Capacitor 웹뷰) 네이티브 미디어 세션 연동 =====
   안드로이드 웹뷰는 JS MediaSession 을 시스템 알림으로 안 띄워주므로,
   APK 안의 LPMedia 네이티브 플러그인에 재생 정보를 넘겨 잠금화면/상태바 알림을 띄운다.
   (브라우저/PWA 에는 Capacitor 가 없어 전부 no-op) */
function _lpPlugin(){   // Capacitor 프록시(있으면) — addListener 용
  try{
    const C=window.Capacitor;
    if(!C) return null;
    if(C.__lpMedia!==undefined) return C.__lpMedia;
    let plugin=null;
    if(C.Plugins && C.Plugins.LPMedia && typeof C.Plugins.LPMedia.update==='function') plugin=C.Plugins.LPMedia;
    else if(typeof C.registerPlugin==='function') plugin=C.registerPlugin('LPMedia');
    C.__lpMedia=plugin||null;
    return C.__lpMedia;
  }catch(e){ return null; }
}
function _lpAvailable(){
  try{
    if(window.LPMediaNative && typeof window.LPMediaNative.update==='function') return true;
    const C=window.Capacitor;
    if(!C) return false;
    if(C.isNativePlatform && !C.isNativePlatform()) return false;
    return !!(_lpPlugin() || typeof C.nativePromise==='function' || typeof C.nativeCallback==='function');
  }catch(e){ return false; }
}
function _lpCall(method, data){   // 가장 확실한 경로부터 시도
  try{
    // 1) WebView JavascriptInterface (원격 로드 앱에서 가장 확실)
    const J=window.LPMediaNative;
    if(J && typeof J[method]==='function'){ J[method](JSON.stringify(data||{})); return; }
    const C=window.Capacitor; if(!C) return;
    // 2) Capacitor 플러그인 프록시
    const p=_lpPlugin();
    if(p && typeof p[method]==='function'){ p[method](data||{}); return; }
    // 3) 저수준 브리지
    if(typeof C.nativePromise==='function'){ C.nativePromise('LPMedia', method, data||{}); return; }
    if(typeof C.nativeCallback==='function'){ C.nativeCallback('LPMedia', method, data||{}, function(){}); return; }
  }catch(e){}
}
function _lpDiag(){   // 어떤 네이티브 브리지가 잡히는지 진단 문자열
  try{
    const C=window.Capacitor;
    const out=[];
    out.push('jsi='+(window.LPMediaNative?'y':'n'));
    out.push('cap='+(C?'y':'n'));
    try{ out.push('plat='+(C&&C.getPlatform?C.getPlatform():'-')); }catch(_){ out.push('plat=?'); }
    out.push('plug='+(_lpPlugin()?'y':'n'));
    out.push('np='+(C&&typeof C.nativePromise==='function'?'y':'n'));
    out.push('nc='+(C&&typeof C.nativeCallback==='function'?'y':'n'));
    let s=out.join(' ');
    if(window.__lpDbg) s+=' | last: '+window.__lpDbg;
    return s;
  }catch(e){ return 'diag err'; }
}
let _lpNativeListenerReady=false;
function _lpSetupNativeListener(){
  if(_lpNativeListenerReady) return; _lpNativeListenerReady=true;
  const handle=(action)=>{
    const disc=_preview.discEl||document.querySelector('.disc.playing, .disc-play.playing')||null;
    if(action==='play') _resumePreview();
    else if(action==='pause') _pausePreview();
    else if(action==='next'){ if(_preview.urls&&_preview.urls.length>1){ _preview.idx+=1; _playPreviewIdx(disc||_preview.discEl); } }
    else if(action==='prev'){ if(_preview.urls&&_preview.urls.length>1){ _preview.idx-=1; _playPreviewIdx(disc||_preview.discEl); } }
    else if(action==='stop') stopPreview();
  };
  window.__lpMediaAction=handle;   // 네이티브가 직접 호출하는 확실한 경로
  window.addEventListener('lpMediaAction', (e)=>{
    let a=e&&e.detail; if(a&&typeof a==='object') a=a.action;
    if(typeof a==='string'){ try{ const o=JSON.parse(a); a=o.action||a; }catch(_){} handle(a); }
  });
  // 네이티브가 보고하는 상태(어디서 막히는지 확인용)
  window.addEventListener('lpMediaDebug', (e)=>{
    let m=e&&e.detail; if(m&&typeof m==='object') m=m.msg;
    if(typeof m==='string'){ try{ const o=JSON.parse(m); m=o.msg||m; }catch(_){} window.__lpDbg=m; try{ previewToast('네이티브: '+m); }catch(_){} }
  });
  try{ const p=_lpPlugin(); if(p&&p.addListener){ p.addListener('action',(d)=>{ if(d&&d.action) handle(d.action); }); p.addListener('debug',(d)=>{ if(d&&d.msg){ window.__lpDbg=d.msg; try{ previewToast('네이티브: '+d.msg); }catch(_){} } }); } }catch(e){}
}
function _lpCurrentTrack(){ const u=_preview.urls; return (u&&u.length)?u[((_preview.idx%u.length)+u.length)%u.length]:null; }
function _lpNativeSync(playing){
  if(!_lpAvailable()) return;
  _lpSetupNativeListener();
  const it=_preview.it, track=_lpCurrentTrack();
  if(!it && !track) return;
  const cover=(typeof artFor==='function'&&it)?(artFor(it)||''):((it&&it.cover)||'');
  const a=_preview.audio, dur=a&&isFinite(a.duration)?a.duration:30;
  _lpCall('update', {
    title:(track&&track.title)||(it&&it.album)||'미리듣기',
    artist:(it&&it.artist)||'',
    album:(it&&it.album)||'',
    cover:cover||'',
    playing:!!playing,
    position:(a&&a.currentTime)||0,
    duration:dur,
  });
}
function _lpNativeStop(){ if(_lpAvailable()) _lpCall('stop', {}); }
function _pausePreview(){
  if(!_preview.audio) return;
  try{ _preview.audio.pause(); }catch(e){}
  try{ VinylNoise.stop(); }catch(e){}
  _preview.paused=true;
  if(_preview.discEl) _preview.discEl.classList.remove('playing');
  if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState='paused'; }catch(e){} }
  _lpNativeSync(false);
}
function _resumePreview(){
  if(!_preview.audio){ if(_preview.discEl) _playPreviewIdx(_preview.discEl); return; }
  _preview.paused=false;
  _preview.audio.play().then(()=>{
    const _cl=crackleLevel(); if(_cl) try{ VinylNoise.start(_cl); }catch(e){}
    if(_preview.discEl) _preview.discEl.classList.add('playing');
    if('mediaSession' in navigator){ try{ navigator.mediaSession.playbackState='playing'; }catch(e){} }
    _lpNativeSync(true);
  }).catch(()=>{});
}
// 하나의 지속 <audio> 엘리먼트를 재사용해야 안드로이드(잠금화면/상태바) 미디어 알림이 안정적으로 뜬다
function _getAudioEl(){
  let el=document.getElementById('lp-audio');
  if(!el){
    el=document.createElement('audio');
    el.id='lp-audio'; el.preload='auto';
    el.setAttribute('playsinline',''); el.setAttribute('webkit-playsinline','');
    el.style.display='none';
    document.body.appendChild(el);
  }
  return el;
}
// 현재 _preview.urls[idx] 곡을 재생 (지속 엘리먼트의 src만 교체, 회전은 유지)
function _playPreviewIdx(disc){
  const urls=_preview.urls;
  if(!urls || !urls.length){ previewToast('🔇 미리듣기를 찾지 못했어요'); return; }
  _preview.idx=((_preview.idx%urls.length)+urls.length)%urls.length;
  const track=urls[_preview.idx];
  const url=track.url;
  const a=_getAudioEl();
  _preview.audio=a; _preview.discEl=disc; _preview.paused=false;
  const gen=(_preview.gen=(_preview.gen||0)+1);   // 오래된 이벤트 무시용 세대 번호
  a.onended=()=>{   // 곡이 끝나면 자동으로 다음 곡으로
    if(_preview.gen!==gen) return;            // 이미 다른 곡으로 넘어갔으면 무시
    if(_preview.urls && _preview.urls.length>1){ _preview.idx+=1; _playPreviewIdx(disc); }
    else stopPreview();                        // 한 곡뿐이면 종료
  };
  a.onerror=()=>{ if(_preview.gen!==gen) return; if(!a.error) return; previewToast('재생할 수 없어요'); stopPreview(); };
  try{ a.pause(); }catch(e){}
  a.src=url; try{ a.currentTime=0; }catch(e){}
  a.play().then(()=>{ const _cl=crackleLevel(); if(_cl) try{ VinylNoise.start(_cl); }catch(e){}
            if(_preview.discEl===disc && !disc.classList.contains('spinning')){
            const cur=parseFloat(getComputedStyle(disc).getPropertyValue('--spin'))||0;
            const norm=((cur%360)+360)%360;
            disc.style.removeProperty('--spin');
            disc.style.animationDelay=(-(norm/360)*2.4)+'s';
            disc.classList.add('playing');
          } })
          .catch(()=>{});
  _updateMediaSession(track, _preview.it);
  if(track.title) previewToast('♪ '+track.title);
  else if(urls.length>1) previewToast('♪ '+(_preview.idx+1)+' / '+urls.length);
}
// 재생 중 한 바퀴 돌렸을 때 다음/이전 곡으로 전환
function previewStep(dir, disc){   // dir: +1 다음곡, -1 이전곡

  _preview.idx += (dir>0?1:-1);

}
async function playPreview(it, disc){
  if(!it) return;
  if(_preview.id===it.id) return;        // 이미 이 판이 재생 중이면 그대로 둠
  stopPreview();
  _preview.id = it.id;
  _preview.it = it;
  let urls = _preview.cache[it.id];
  if(urls===undefined) urls = await _fetchPreviewUrl(it);
  if(_preview.id!==it.id) return;        // 기다리는 사이 다른 판을 돌렸으면 취소
  if(!urls || !urls.length){ previewToast('🔇 미리듣기를 찾지 못했어요 — 상세의 음원 연결로 지정해보세요'); _preview.id=null; return; }
  _preview.urls = urls;
  _preview.idx = Math.floor(Math.random()*urls.length);   // 첫 곡은 랜덤 시작
  _preview.last[it.id]=urls[_preview.idx].url;

}
function previewToast(msg){
  let t=document.getElementById('preview-toast');
  if(!t){ t=document.createElement('div'); t.id='preview-toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');

}

/* 앱을 백그라운드로 보내거나 끄면 미리듣기를 멈춘다.

(function _setupPreviewLifecycle(){
  const stopIfPlaying=()=>{ try{ if(_preview.id||_preview.audio) stopPreview(); }catch(e){} };
  // 웹/PWA/웹뷰 공통: 화면이 가려지면(다른 앱 전환·홈·잠금·앱 종료) 정지

  window.addEventListener('pagehide', stopIfPlaying);
  window.addEventListener('freeze', stopIfPlaying);   // Page Lifecycle: 백그라운드 동결
  // Capacitor(APK): 앱 상태 변화 — 비활성화 시 정지
  try{
    const C=window.Capacitor;
    const App=C && C.Plugins && C.Plugins.App;
    if(App && App.addListener){
      App.addListener('appStateChange', (s)=>{ if(s && s.isActive===false) stopIfPlaying(); });
      App.addListener('pause', stopIfPlaying);
    }
  }catch(e){}
})();

async function loadArt(it){
  const img=document.querySelector(`img[data-art="${it.id}"]`);
  if(!img||img.dataset.done) return;
  img.dataset.done='1';
  const key=artKey(it.artist,it.album);
  let url = it._art || pickedArt[key];
  let fetched=false;
  if(!url){ url = await fetchArt(it.artist,it.album); fetched=true; }
  // auto-fill genre if we learned it during the search
  if(!it.genre && genreCache[key]){ it.genre=genreCache[key]; saveGenre(it); refreshGenreChips(); }
  if(!url){ img.dataset.done=''; return; }   // no art found; keep placeholder, allow later retry
  it._art=url;
  // 자동으로 찾은 커버는 한 번 정해지면 계정에 고정 저장 → 이후 스스로 바뀌지 않음
  if(fetched && !it.cover){ it.cover=url; try{ if(typeof cloudSaveItem==='function') cloudSaveItem(it); }catch(e){} }
  const ph=img.parentElement.querySelector('.ph');
  const reveal=()=>{ img.classList.add('ld'); if(ph) ph.style.display='none'; img.dataset.shown='1'; };
  img.onload=reveal;
  // if it fails, just keep showing the placeholder — never wipe an image that already displayed
  img.onerror=()=>{ if(!img.dataset.shown){ img.dataset.done=''; } };
  img.src=url;
  if(img.complete && img.naturalWidth>0) reveal();     // already cached
}

// 바이닐 꾸미기 (Pro 전용): 판 색상 + 투명도 세부 조정, 저장 즉시 반영
function openDiscPhoto(it, opts){   // 판에 사진 넣기. opts:{draft:true,prefix:'f'} 면 추가 폼 임시 보관 모드
  const box=$('#vinyl-box');   // 별도 팝업 시트에 렌더
  box.innerHTML=`
    <div class="inl-title">📷 판에 사진 넣기</div>
    <div class="vd-pane" id="vd-pane-photo">
      <div class="vd-photodesc">레코드판 모양 가이드 안에 사진이 들어가요. 한 손가락으로 위치를 옮기고, 두 손가락으로 크기·기울기를 조절하세요.</div>

      </div>
      <label class="pk-up" for="vd-file" style="margin-top:12px">📷 사진 올리기</label>
      <input type="file" accept="image/*" id="vd-file" style="display:none">
      <div class="fld" style="margin-top:12px"><label>크기 <span id="vd-zoomlab" style="color:var(--accent2)">100%</span></label>
        <input type="range" id="vd-zoom" min="50" max="250" value="100" class="vd-range" disabled>
      </div>
      <div class="fld"><label>투명도 <span id="vd-popacity-lab" style="color:var(--accent2)">100%</span></label>
        <input type="range" id="vd-popacity" min="20" max="100" value="100" class="vd-range" disabled>
      </div>
      <div class="vd-tilthint">두 손가락으로 기울기를 조절할 수 있어요</div>
      <button class="act-btn solid" id="vd-photo-save" disabled>이 사진으로 저장</button>
      <button class="act-btn" id="vd-photo-reset" style="margin-top:8px">사진 제거</button>
    </div>`;

  // ---- photo: drag to move, pinch to scale/tilt, sliders for size/tilt/opacity ----
  const stage=$('#vd-stage'), imgwrap=$('#vd-imgwrap'), zoom=$('#vd-zoom');
  const popac=$('#vd-popacity');
  let vimg=null, vx=0, vy=0, vscale=1, vrot=0, vopacity=1;
  function tfm(){ return `translate(-50%,-50%) translate(${vx}px,${vy}px) rotate(${vrot}deg) scale(${vscale})`; }
  function renderImg(){
    if(!vimg) return;
    imgwrap.innerHTML='';
    const im=document.createElement('img');
    im.src=vimg; im.className='vd-img';
    im.style.transform=tfm(); im.style.opacity=vopacity;
    imgwrap.appendChild(im);
    imgwrap._im=im;
  }
  function place(){
    const im=imgwrap._im; if(!im)return;
    im.style.transform=tfm(); im.style.opacity=vopacity;
  }
  function enableControls(on){ [zoom,popac].forEach(s=>{ if(s) s.disabled=!on; }); }
  // 라벨 클릭이 막히는 환경 대비: 라벨을 직접 누르면 파일 입력 강제 오픈
  { const lbl=box.querySelector('label[for="vd-file"]'); const fi=$('#vd-file');
    if(lbl&&fi) lbl.onclick=(e)=>{ e.preventDefault(); fi.click(); }; }
  function loadVimg(dataURL){
    vimg=dataURL;
    vx=0; vy=0; vscale=1; vrot=0; vopacity=1;
    zoom.value=100; $('#vd-zoomlab').textContent='100%';
    popac.value=100; $('#vd-popacity-lab').textContent='100%';
    enableControls(true);
    $('#vd-guide-label').style.display='none';
    $('#vd-photo-save').disabled=false;
    renderImg();
  }
  $('#vd-file').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    try{ loadVimg(await fileToDataURL(f, 1000)); }
    catch(err){ alert('이미지를 불러오지 못했어요'); }
  };
  // 미리보기(샌드박스)에서 파일 선택이 막힐 때 쓰는 샘플 주입 훅
  window.__vdLoadSample=(dataURL)=>{ try{ loadVimg(dataURL); }catch(e){} };
  zoom.oninput=()=>{ vscale=zoom.value/100; $('#vd-zoomlab').textContent=zoom.value+'%'; place(); };
  popac.oninput=()=>{ vopacity=popac.value/100; $('#vd-popacity-lab').textContent=popac.value+'%'; place(); };
  // drag (1 finger) + pinch (2 fingers: scale + tilt)
  let drag=false,sx=0,sy=0,ox=0,oy=0;
  let pinch=false,pinchD0=0,pinchScale0=1,pinchAng0=0,pinchRot0=0;
  const dStart=(x,y)=>{ if(!vimg)return; drag=true;sx=x;sy=y;ox=vx;oy=vy; };
  const dMove=(x,y)=>{ if(!drag)return; vx=ox+(x-sx); vy=oy+(y-sy); place(); };
  const dEnd=()=>{ drag=false; };
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const ang=(t)=>Math.atan2(t[1].clientY-t[0].clientY, t[1].clientX-t[0].clientX)*180/Math.PI;
  stage.addEventListener('touchstart',e=>{
    if(!vimg) return;
    if(e.touches.length>=2){ pinch=true; drag=false; pinchD0=dist(e.touches); pinchScale0=vscale; pinchAng0=ang(e.touches); pinchRot0=vrot; }
    else dStart(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(!vimg) return;
    if(pinch && e.touches.length>=2){
      e.preventDefault();
      const ratio=dist(e.touches)/(pinchD0||1);
      vscale=Math.min(2.5, Math.max(0.5, pinchScale0*ratio));
      zoom.value=Math.round(vscale*100); $('#vd-zoomlab').textContent=Math.round(vscale*100)+'%';
      let dr=ang(e.touches)-pinchAng0;
      vrot=Math.max(-180, Math.min(180, pinchRot0+dr));
      place();
    } else if(drag){ e.preventDefault(); dMove(e.touches[0].clientX,e.touches[0].clientY); }
  },{passive:false});
  stage.addEventListener('touchend',e=>{ if(e.touches.length<2){ pinch=false; } if(e.touches.length===0){ dEnd(); } });
  stage.addEventListener('mousedown',e=>{ dStart(e.clientX,e.clientY);
    const mm=ev=>dMove(ev.clientX,ev.clientY), mu=()=>{dEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu); });
  // wheel zoom on desktop
  stage.addEventListener('wheel',e=>{ if(!vimg)return; e.preventDefault();
    vscale=Math.min(2.5,Math.max(0.5, vscale*(e.deltaY<0?1.06:0.94)));
    zoom.value=Math.round(vscale*100); $('#vd-zoomlab').textContent=Math.round(vscale*100)+'%'; place();
  },{passive:false});
  // if already has a photo, preload it
  if(it.discPhoto){ vimg=it.discPhoto; enableControls(true); $('#vd-photo-save').disabled=false; $('#vd-guide-label').style.display='none'; renderImg(); }

  // 사진 저장/제거 후, 열려 있는 폼(추가/수정)의 사진 칩·미리보기 판 갱신
  const draft=!!(opts&&opts.draft);
  const prefix=(opts&&opts.prefix)||'e';
  const syncForm=()=>{
    const ec=$('#'+prefix+'-color');
    const formOpen = prefix==='f' ? $('#sheet-add').classList.contains('show') : $('#sheet-edit').classList.contains('show');
    if(ec && formOpen){
      if(it.discPhoto) ec.dataset.photo=it.discPhoto; else delete ec.dataset.photo;
      if(ec.oninput) ec.oninput();   // 팔레트(사진 칩 상태)·미리보기 판 다시 그림
    }
  };
  $('#vd-photo-save').onclick=async ()=>{
    if(!vimg){ alert('사진을 먼저 올려주세요'); return; }
    // render the visible circle region to a square canvas, masked to a circle
    const cropped=await cropToVinyl(imgwrap._im, stage, {vx,vy,vscale,vrot,opacity:vopacity});
    let url=cropped; try{ url=await window.LPCloud.uploadImage(dataURLToBlob(cropped),'jpg'); }catch(up){}
    it.discPhoto=url;
    it.discColorCustom=null; it.discOpacity=null;   // photo overrides color
    if(!draft) persistFull(it);   // 추가 폼 초안은 '보관함에 추가' 시점에 함께 저장
    hide('vinyl');
    syncForm();
    if(!draft){
      if(!$('#sheet-edit').classList.contains('show')) hide('detail');
      renderGrid();buildCoverFlow();
    }
  };
  $('#vd-photo-reset').onclick=()=>{
    it.discPhoto=null;
    if(!draft) persistFull(it);
    hide('vinyl');
    syncForm();
    if(!draft){
      if(!$('#sheet-edit').classList.contains('show')) hide('detail');
      renderGrid();buildCoverFlow();
    }
  };
  show('vinyl');
  // 웹뷰/스택 문제와 무관하게 항상 최상단에 보이도록 강제 (풀스크린 수정 화면 위)
  { const sv=document.getElementById('sheet-vinyl'), ovv=document.getElementById('ov-vinyl');
    if(ovv){ document.body.appendChild(ovv); ovv.style.zIndex='9998'; }
    if(sv){ document.body.appendChild(sv); sv.style.zIndex='9999'; sv.style.visibility='visible'; sv.scrollTop=0; } }
}
// normalize a CSS color (hex or rgb) to #rrggbb for <input type=color>
function toHex(c){
  if(!c) return '#1a1a1a';
  if(c[0]==='#'){ return c.length===4 ? '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(0,7); }
  const m=c.match(/\d+/g); if(!m) return '#1a1a1a';
  return '#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');
}
// crop the visible square stage region to a circular vinyl image (회전·투명도 반영)
function cropToVinyl(imgEl, stageEl, t){
  return new Promise((res)=>{
    const rect=stageEl.getBoundingClientRect();
    const St=rect.width||230;             // 스테이지 CSS 크기
    const S=300;                          // output size
    const scale=S/St;                     // stage px -> canvas px
    const c=document.createElement('canvas'); c.width=S; c.height=S;
    const ctx=c.getContext('2d');
    // circular clip
    ctx.save();
    ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.clip();
    // 검은 배경(투명 영역이 비치지 않도록)
    ctx.fillStyle='#111'; ctx.fillRect(0,0,S,S);
    // 편집기 변환의 '실제 효과'를 그대로 재현:
    //  - 이미지는 stage 중심에서 (vx,vy)만큼 이동한 지점이 '이미지 중심'
    //  - 그 중심을 기준으로 vrot 회전 · vscale 배율 (transform-origin: center)
    const o = t || {};
    const Wd = imgEl.offsetWidth  || imgEl.naturalWidth;   // 화면 표시 크기(CSS px, 보통 230)
    const Hd = imgEl.offsetHeight || imgEl.naturalHeight;
    const dw = Wd*scale, dh = Hd*scale;                    // 캔버스에서의 기본(배율1) 표시 크기
    ctx.translate(S/2 + (o.vx||0)*scale, S/2 + (o.vy||0)*scale);
    ctx.rotate((o.vrot||0)*Math.PI/180);
    ctx.scale(o.vscale||1, o.vscale||1);
    ctx.globalAlpha = (o.opacity!=null ? o.opacity : 1);
    ctx.drawImage(imgEl, -dw/2, -dh/2, dw, dh);            // 중심 기준으로 그림
    ctx.globalAlpha=1;
    ctx.restore();
    // subtle vinyl sheen
    const g=ctx.createRadialGradient(S*0.4,S*0.35,0,S/2,S/2,S/2);
    g.addColorStop(0,'rgba(255,255,255,.12)'); g.addColorStop(.4,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,.25)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.fill();
    res(c.toDataURL('image/jpeg',0.85));
  });
}

// downscale an uploaded image to keep localStorage small, return dataURL
function fileToDataURL(file, max=600){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let{width:w,height:h}=im;
        const sc=Math.min(1,max/Math.max(w,h));
        const c=document.createElement('canvas');
        c.width=Math.round(w*sc);c.height=Math.round(h*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.85));
      };
      im.onerror=rej; im.src=r.result;
    };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

// (position:fixed 기법 — iOS 포함 확실. 시트 내부 스크롤은 그대로 동작)
let _scrollLockY=0;
function lockScroll(){
  if(document.body.classList.contains('scroll-lock')) return;
  _scrollLockY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.top = `-${_scrollLockY}px`;
  document.body.classList.add('scroll-lock');
}
function unlockScroll(){
  if(!document.body.classList.contains('scroll-lock')) return;
  document.body.classList.remove('scroll-lock');
  document.body.style.top='';
  window.scrollTo(0, _scrollLockY);
}
function show(name){
  const ov=$('#ov-'+name), s=$('#sheet-'+name);
  // 어떤 기기(웹뷰)에서도 항상 최상단에 뜨도록: 열 때마다 body 맨 뒤로 이동 + 증가하는 인라인 z-index
  try{
    window.__sheetZ=(window.__sheetZ||200)+2;
    document.body.appendChild(ov); document.body.appendChild(s);
    ov.style.zIndex=String(window.__sheetZ-1);
    s.style.zIndex=String(window.__sheetZ);
    s.style.visibility='visible';
    void s.offsetHeight;   // reflow — 이동 후에도 슬라이드 전환이 재생되게
  }catch(e){}
  ov.classList.add('show'); s.classList.add('show');
  s.style.transition='';s.style.transform='';
  if(s.classList.contains('fs')) document.body.classList.add('fs-open');   // 풀스크린이면 뒤 레이어 숨김
  lockScroll();}

  const s=$('#sheet-'+name); s.style.transform='';
  if(s.classList.contains('fs')) document.body.classList.remove('fs-open');
  if(!document.querySelector('.sheet.show')) unlockScroll();}   // 열린 시트가 더 없을 때만 잠금 해제

// swipe-down to dismiss (drag from the grab handle / top area)
function enableSwipeClose(name){
  const sheet=$('#sheet-'+name);
  const handle=$('#grab-'+name);
  let y0=null,dy=0,drag=false;
  const startY=y=>{ if(sheet.scrollTop>2)return; drag=true;y0=y;dy=0;sheet.style.transition='none'; };
  const moveY=y=>{ if(!drag)return; dy=y-y0; if(dy<0)dy=0;
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`; };
  const endY=()=>{ if(!drag)return; drag=false; sheet.style.transition='';
    if(dy>110){ sheet.style.transform=`translateX(-50%) translateY(100%)`; setTimeout(()=>hide(name),200); }
    else sheet.style.transform=''; };
  // dragging anywhere on the handle, or on the sheet when scrolled to top
  [handle,sheet].forEach(el=>{
    el.addEventListener('touchstart',e=>startY(e.touches[0].clientY),{passive:true});
    el.addEventListener('touchmove',e=>{ if(drag&&dy>0)e.preventDefault(); moveY(e.touches[0].clientY); },{passive:false});
    el.addEventListener('touchend',endY);
  });
  // mouse (desktop) on handle only
  handle.addEventListener('mousedown',e=>{startY(e.clientY);
    const mm=ev=>moveY(ev.clientY), mu=()=>{endY();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);});
}

// 컬렉션 시트: 가로가 우세한 드래그를 막아 좌우 흔들림 제거(세로 스크롤만 허용).
// touch-action:pan-y 로 안 잡히는 브라우저(특히 iOS 러버밴드)까지 확실히 차단한다.
['colldetail','collnew','collpick'].forEach(n=>{
  const el=document.getElementById('sheet-'+n); if(!el) return;
  let sx=0, sy=0, ax=null;
  el.addEventListener('touchstart',e=>{ if(e.touches.length===1){ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; ax=null; } },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(e.touches.length!==1) return;
    const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(ax===null){ if(Math.abs(dx)<6 && Math.abs(dy)<6) return; ax = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y'; }
    if(ax==='x' && e.cancelable) e.preventDefault();   // 가로 제스처 차단(세로는 통과 → 스크롤 정상)
  },{passive:false});
});

        window.__addPv = c.collectionId ? {id:c.collectionId, name:c.album||''} : null;
      });

/* ===== 바코드 스캔 → Discogs 조회 ===== */
let _bcStream=null, _bcRAF=null, _bcDetector=null, _bcReader=null, _bcControls=null;
function bcStatus(msg){ const s=$('#bc-status'); if(s) s.textContent=msg||''; }
function bcT(en,ko){ return isEN()?en:ko; }
// ZXing(폴백) 지연 로드 — BarcodeDetector 미지원 브라우저/웹뷰용
let _zxingPromise=null;
function loadZXing(){
  if(_zxingPromise) return _zxingPromise;
  _zxingPromise = import('https://esm.sh/@zxing/browser@0.1.5').catch(()=>import('https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm'));
  return _zxingPromise;
}
function onBarcodeFound(num){
  stopBarcodeScan();
  try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
  bcStatus(bcT('✓ Read: '+num,'✓ 인식됨: '+num));
  lookupBarcode(num);
}
async function startBarcodeScan(){
  const box=$('#bc-box'), vid=$('#bc-video');
  box.style.display='block';
  // 1) 카메라 열기 (권한 필요) — 실패 원인별로 안내를 다르게
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw Object.assign(new Error('no mediaDevices'), {name:'InsecureContext'});
    }
    _bcStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  }catch(err){
    vid.style.display='none';
    const name = err && err.name;
    let msg;
    if(name==='NotAllowedError' || name==='SecurityError'){
      msg = bcT('Camera permission was denied. Turn it on in Settings → Apps → My Vinyl → Permissions → Camera, then retry — or enter the number below.',
                '카메라 권한이 거부됐어요. 폰 설정 → 앱 → My Vinyl → 권한 → 카메라 를 켠 뒤 다시 시도하거나, 아래에 번호를 직접 입력하세요.');
    }else if(name==='NotFoundError' || name==='OverconstrainedError'){
      msg = bcT('No camera was found on this device. Enter the number below.',
                '이 기기에서 카메라를 찾지 못했어요. 아래에 번호를 직접 입력하세요.');
    }else if(name==='NotReadableError' || name==='AbortError'){
      msg = bcT('The camera is being used by another app. Close it and retry, or enter the number below.',
                '다른 앱이 카메라를 쓰고 있어요. 닫고 다시 시도하거나, 아래에 번호를 직접 입력하세요.');
    }else if(name==='InsecureContext' || !window.isSecureContext){
      msg = bcT('Camera needs a secure (https) connection. Enter the number below.',
                '카메라는 보안(https) 연결에서만 열려요. 아래에 번호를 직접 입력하세요.');
    }else{
      msg = bcT('Cannot open the camera. Enter the number below.',
                '카메라를 열 수 없어요. 아래에 번호를 직접 입력하세요.');
    }
    bcStatus(msg);
    return;
  }
  vid.srcObject=_bcStream; vid.setAttribute('playsinline',''); vid.style.display='block';
  try{ await vid.play(); }catch(e){}
  bcStatus(bcT('Point the barcode at the camera…','바코드를 카메라에 비춰주세요…'));
  // 2) BarcodeDetector(네이티브) 우선
  if('BarcodeDetector' in window){
    try{
      _bcDetector=new window.BarcodeDetector({formats:['ean_13','upc_a','ean_8','upc_e','code_128']});
      const scan=async()=>{
        if(!_bcStream) return;
        try{
          const codes=await _bcDetector.detect(vid);
          if(codes && codes.length){ onBarcodeFound(codes[0].rawValue); return; }
        }catch(e){}
        _bcRAF=requestAnimationFrame(scan);
      };
      _bcRAF=requestAnimationFrame(scan);
      return;
    }catch(e){ /* ZXing 폴백으로 진행 */ }
  }
  // 3) ZXing 폴백 (BarcodeDetector 미지원 시)
  try{
    bcStatus(bcT('Loading scanner…','스캐너 불러오는 중…'));
    const ZX=await loadZXing();
    const Reader = ZX.BrowserMultiFormatReader || (ZX.default && ZX.default.BrowserMultiFormatReader);
    _bcReader=new Reader();
    bcStatus(bcT('Point the barcode at the camera…','바코드를 카메라에 비춰주세요…'));
    _bcControls=await _bcReader.decodeFromStream(_bcStream, vid, (result)=>{
      if(result){ onBarcodeFound(result.getText ? result.getText() : result.text); }
    });
  }catch(e){
    bcStatus(bcT('Scanner unavailable. Enter the number below.','스캔을 사용할 수 없어요. 아래에 번호를 직접 입력하세요.'));
  }
}
function stopBarcodeScan(){
  if(_bcRAF){ cancelAnimationFrame(_bcRAF); _bcRAF=null; }
  if(_bcControls){ try{ _bcControls.stop(); }catch(e){} _bcControls=null; }
  if(_bcReader){ try{ _bcReader.reset && _bcReader.reset(); }catch(e){} _bcReader=null; }
  if(_bcStream){ _bcStream.getTracks().forEach(t=>t.stop()); _bcStream=null; }
  const vid=$('#bc-video'); if(vid){ vid.style.display='none'; try{vid.srcObject=null;}catch(e){} }
}
async function lookupBarcode(code){
  code=String(code||'').replace(/\D/g,'');
  if(!code){ bcStatus('바코드 번호를 인식하지 못했어요.'); return; }
  const token=(SETTINGS && SETTINGS.discogsToken||'').trim();
  if(!token){ bcStatus('Discogs 토큰이 없어요. 마이페이지 환경설정에서 입력하세요.'); return; }
  bcStatus(isEN() ? ('Looking up barcode '+code+'…') : ('바코드 '+code+' 조회 중…'));
  try{
    const url='https://api.discogs.com/database/search?type=release&barcode='+encodeURIComponent(code)+'&per_page=5&token='+encodeURIComponent(token);
    const res=await fetch(url,{headers:{'User-Agent':'LPArchive/1.0'}});
    if(!res.ok){ bcStatus(isEN() ? ('Lookup failed (HTTP '+res.status+'). Check your token or network.') : ('조회 실패 (HTTP '+res.status+'). 토큰이나 네트워크를 확인하세요.')); return; }
    const data=await res.json();
    const results=(data && data.results)||[];
    if(!results.length){ bcStatus('이 바코드로 음반을 찾지 못했어요. 번호를 확인하거나 직접 입력하세요.'); return; }
    applyDiscogsResult(results[0]);
    bcStatus((isEN()?'✓ Found: ':'✓ 찾았어요: ')+(results[0].title||''));
  }catch(err){
    bcStatus('조회 중 오류가 났어요. 네트워크를 확인하세요.');
  }
}
function applyDiscogsResult(r){
  // Discogs title은 보통 "Artist - Album" 형식
  let artist='', album='';
  if(r.title && r.title.includes(' - ')){ const p=r.title.split(' - '); artist=p[0].trim(); album=p.slice(1).join(' - ').trim(); }
  else { album=(r.title||'').trim(); }
  if(artist) $('#f-artist').value=artist;
  if(album) $('#f-album').value=album;
  // 발매연도 (Discogs year)
  if(r.year){ const yf=$('#f-year'); if(yf && !yf.value){ const y=parseInt(String(r.year).slice(0,4),10); if(y) yf.value=y; } }
  // 커버
  const cover=r.cover_image||r.thumb;
  if(cover && !/spacer\.gif/.test(cover)){ setPrevImg(cover,'Discogs 커버로 저장돼요 ✓'); }
  // 장르
  if(r.genre && r.genre.length){ const gf=$('#f-genre'); if(gf && !gf.value) gf.value=r.genre[0]; }
}

/* ===== 취향 분석 공유 카드 (이미지 생성 → 미리보기 팝업 → 공유) ===== */
function _tasteCardStats(){
  const real=DATA.filter(d=>statusGroup(d.status)!=='위시');
  const owned=real.filter(d=>statusGroup(d.status)==='보유중').length;
  const opened=real.filter(d=>d.status==='개봉').length;
  const sealed=real.filter(d=>d.status==='미개봉').length;
  const rated=DATA.filter(d=>d.rating>0);
  const avg=rated.length?rated.reduce((s,d)=>s+d.rating,0)/rated.length:0;
  const hist=[]; for(let v=0.5;v<=5;v+=0.5) hist.push({v, n:rated.filter(d=>d.rating===v).length});
  const most=rated.length?hist.slice().sort((a,b)=>b.n-a.n||b.v-a.v)[0].v:0;
  const byArtist={};
  real.forEach(d=>{ const a=(d.artist||'').trim(); if(!a||a==='-')return; (byArtist[a]=byArtist[a]||[]).push(d); });
  const artists=Object.entries(byArtist).map(([a,arr])=>{
    const r=arr.filter(q=>q.rating);
    return {name:a, cnt:arr.length, avg:r.length?r.reduce((s,q)=>s+q.rating,0)/r.length:0};
  }).sort((p,q)=>q.cnt-p.cnt||q.avg-p.avg).slice(0,3);
  const gm={}; real.forEach(d=>{ const k=(d.genre||'').trim(); if(k&&k!=='-') gm[k]=(gm[k]||0)+1; });
  const genres=Object.entries(gm).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const sm={}; real.forEach(d=>{ const raw=(d.store||'').trim(); if(!raw||raw==='-')return;
    const low=raw.toLowerCase(); const e=(sm[low]=sm[low]||{cnt:0,names:{}}); e.cnt++; e.names[raw]=(e.names[raw]||0)+1; });
  const stores=Object.entries(sm).filter(([l])=>l!=='선물'&&l!=='교환').sort((a,b)=>b[1].cnt-a[1].cnt).slice(0,3)
    .map(([l,e])=>({name:Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0], cnt:e.cnt}));
  const byYear={}; real.forEach(d=>{ if(!d.buy)return; const yy=String(d.buy).slice(0,4); if(/^\d{4}$/.test(yy)) byYear[yy]=(byYear[yy]||0)+1; });
  const listens=DATA.reduce((s,d)=>s+(Array.isArray(d.listens)?d.listens.length:0),0);
  // 최애 앨범: 청음 횟수 기준 TOP3
  const albums=DATA.map(d=>({name:(d.album||'').trim()||(d.artist||''), artist:(d.artist||'').trim(), cnt:Array.isArray(d.listens)?d.listens.length:0}))
    .filter(a=>a.cnt>0).sort((p,q)=>q.cnt-p.cnt).slice(0,3);
  return { total:real.length, owned, opened, sealed, rated:rated.length, avg, hist, most,
           artists, genres, stores, byYear, years:Object.keys(byYear).sort(), listens, albums };
}
// 평균 별점에 따른 한 줄 페르소나 (왓챠피디아 '지조파' 느낌)
function _ratingPersona(s, en){
  if(!s.rated) return en?'Your rating journey starts now':'이제 막 별점 여정을 시작했어요';
  if(s.avg>=4.7) return en?"Five stars aren't enough — a perfect-score machine":"별 다섯 개로는 부족한 '만점 제조기'";
  if(s.avg>=4.3) return en?"A generous ear — every record is loved":"판마다 애정이 넘치는 '후한 귀'";
  if(s.avg>=3.8) return en?"Warm but discerning — praise with reasons":"칭찬에도 이유가 있는 '따뜻한 감별사'";
  if(s.avg>=3.2) return en?"Steady taste, not swayed by hype":"유행에 휘둘리지 않는 '지조파'";
  if(s.avg>=2.5) return en?"A balanced, honest listener":"냉정하게 듣는 '균형파'";
  return en?"A critic with a sharp needle":"깐깐한 바늘의 '평론가'";
}
// 청음 횟수에 따른 한 줄 문구
function _listenCopy(n, en){

  if(n<10)    return en?'The needle is just getting started.':'이제 막 바늘을 올리기 시작했어요.';
  if(n<30)    return en?'Getting closer to your turntable every day.':'턴테이블과 부쩍 친해지는 중이에요.';
  if(n<70)    return en?'A devoted listener — the turntable rarely rests.':'턴테이블이 쉴 틈 없는 애청가시네요.';
  if(n<150)   return en?'The needle has been busy. Well done.':'바늘이 닳도록 들었어요. 대단합니다.';
  return en?'A true audiophile — records are your life.':'인생의 BGM이 전부 바이닐인 경지예요.';
}
function buildShareCardCanvas(){
  const s=_tasteCardStats(), en=isEN();
  const W=1080, M=70, BUF=3400;
  const c=document.createElement('canvas'); c.width=W; c.height=BUF;
  const x=c.getContext('2d');
  const pair=(typeof ACCENTS!=='undefined'&&typeof SETTINGS!=='undefined'&&ACCENTS.find(a=>a[1]===SETTINGS.accent))||null;
  const accent=(pair&&pair[1])||'#e8643c', accent2=(pair&&pair[2])||'#f2a444';
  x.fillStyle='#121016'; x.fillRect(0,0,W,BUF);

  // ── 헤더 밴드 (브랜드 컬러 + LP 장식)
  const hb=x.createLinearGradient(0,0,W,260); hb.addColorStop(0,accent); hb.addColorStop(1,accent2);
  x.fillStyle=hb; x.fillRect(0,0,W,260);
  x.save(); x.globalAlpha=.22;
  x.beginPath(); x.arc(W-80,130,160,0,7); x.fillStyle='#000'; x.fill();
  x.strokeStyle='rgba(255,255,255,.6)'; x.lineWidth=2;
  for(let r=60;r<160;r+=16){ x.beginPath(); x.arc(W-80,130,r,0,7); x.stroke(); }
  x.restore();
  x.textAlign='left'; x.fillStyle='#fff';
  x.font='800 62px "Bricolage Grotesque",sans-serif';
  x.fillText('MY VINYL ARCHIVE', M, 120);
  x.font='700 34px sans-serif'; x.fillStyle='rgba(255,255,255,.92)';
  x.fillText(en?'Taste Report':'취향 분석', M, 180);
  let y=260;

  const line=()=>{ x.strokeStyle='rgba(255,255,255,.08)'; x.lineWidth=2; x.beginPath(); x.moveTo(M,y); x.lineTo(W-M,y); x.stroke(); };
  const sec=(t)=>{ y+=82; x.textAlign='left'; x.fillStyle='#fff'; x.font='800 42px sans-serif'; x.fillText(t,M,y); y+=12; };
  const noData=()=>{ y+=58; x.textAlign='left'; x.fillStyle='rgba(255,255,255,.35)'; x.font='600 28px sans-serif'; x.fillText(en?'No data yet':'데이터 없음', M, y); y+=40; };
  const rankRows=(rows)=>{
    if(!rows.length){ noData(); return; }
    rows.forEach((r,i)=>{ y+=64;
      x.textAlign='left';
      x.fillStyle=accent2; x.font='800 30px sans-serif'; x.fillText(String(i+1), M, y);
      x.fillStyle='#fff'; x.font='700 32px sans-serif';
      let nm=r.name; while(x.measureText(nm).width>W-2*M-260 && nm.length>2) nm=nm.slice(0,-2)+'…';
      x.fillText(nm, M+52, y);
      x.textAlign='right'; x.fillStyle='rgba(255,255,255,.6)'; x.font='600 28px sans-serif'; x.fillText(r.right, W-M, y);
    });
    y+=44;
  };

  // ── 컬렉션 요약 (전체·보유·개봉·미개봉)
  sec(en?'Collection':'컬렉션');
  y+=84;
  [[s.total,en?'Total':'전체'],[s.owned,en?'Owned':'보유'],[s.opened,en?'Opened':'개봉'],[s.sealed,en?'Sealed':'미개봉']].forEach((cl,i)=>{
    const cxx=M+(W-2*M)*(i+0.5)/4;
    x.textAlign='center'; x.fillStyle='#fff'; x.font='800 60px sans-serif'; x.fillText(String(cl[0]),cxx,y);
    x.fillStyle='rgba(255,255,255,.5)'; x.font='600 26px sans-serif'; x.fillText(cl[1],cxx,y+42);
  });

async function _shareCardBlob(blob){
  if(!blob) return false;
  const file=new File([blob],'my-vinyl-taste.png',{type:'image/png'});
  const text=isEN()?'My vinyl taste report 🎵':'내 바이닐 취향 분석 🎵';
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'My Vinyl', text});
      return true;
    }
  }catch(e){ if(e && e.name==='AbortError') return true; }
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
    const Sh=window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if(Sh && Sh.share && window.LPCloud && window.LPCloud.uploadImage){
      try{
        const url=await window.LPCloud.uploadImage(blob,'png');   // 카드 이미지를 올려 링크로 공유
        await Sh.share({ title:'My Vinyl', text, url, dialogTitle:isEN()?'Share taste card':'취향 카드 공유' });
        return true;
      }catch(e){ console.error('native card share', e); }
    }
  }
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='my-vinyl-taste.png'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    return true;
  }catch(e){ return false; }
}

/* ===== 추가 폼 임시저장 =====
   작성 중 다른 앱(카톡 등)으로 갔다가 웹뷰가 재시작돼도 이어서 쓸 수 있게,
   입력값을 localStorage 에 수시로 저장해 두고 앱이 다시 켜지면 복구한다. */
const ADD_DRAFT_KEY='lp_add_draft';
const ADD_DRAFT_FIELDS=['f-artist','f-album','f-color','f-cat','f-status','f-op','f-rpm','f-inch',
  'f-sleeve','f-media','f-price','f-list','f-store','f-buy','f-eta','f-open','f-genre','f-year','f-note'];
function saveAddDraft(){
  const sh=$('#sheet-add');
  if(!sh || !sh.classList.contains('show')) return;   // 추가 폼이 열려 있을 때만
  const d={t:Date.now(), v:{}, openUnknown:openUnknown,
           hex:($('#f-color')&&$('#f-color').dataset.hex)||'',
           art:($('#pa-prev')&&$('#pa-prev').dataset.url)||'',
           disc:(window.__addDraft&&window.__addDraft.discPhoto)||null,
           pv:window.__addPv||null};
  ADD_DRAFT_FIELDS.forEach(i=>{ const el=$('#'+i); if(el) d.v[i]=el.value; });
  try{ localStorage.setItem(ADD_DRAFT_KEY, JSON.stringify(d)); }
  catch(e){ d.disc=null; try{ localStorage.setItem(ADD_DRAFT_KEY, JSON.stringify(d)); }catch(e2){} }   // 용량 초과 시 판 사진만 빼고 저장
}
function clearAddDraft(){ try{ localStorage.removeItem(ADD_DRAFT_KEY); }catch(e){} }
let _addDraftTimer=null;
function scheduleAddDraft(){ clearTimeout(_addDraftTimer); _addDraftTimer=setTimeout(saveAddDraft, 400); }
{ const sh=$('#sheet-add');
  ['input','change','click'].forEach(ev=>sh.addEventListener(ev, scheduleAddDraft)); }
// 화면이 가려지는 순간(앱 전환·홈·잠금) 즉시 저장 — 이때 웹뷰가 죽어도 내용이 남는다
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ clearTimeout(_addDraftTimer); saveAddDraft(); } });
window.addEventListener('pagehide', ()=>{ clearTimeout(_addDraftTimer); saveAddDraft(); });
function restoreAddDraft(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(ADD_DRAFT_KEY)||'null'); }catch(e){}
  if(!d || !d.v) return false;
  if(Date.now()-(d.t||0) > 12*60*60*1000){ clearAddDraft(); return false; }   // 12시간 지난 초안은 버림
  const typed=['f-artist','f-album','f-color','f-store','f-price','f-list','f-note','f-genre','f-year']
    .some(i=>String(d.v[i]||'').trim());
  if(!typed && !d.disc){ clearAddDraft(); return false; }   // 실제 입력이 없었으면 복구할 것도 없음
  const cat=d.v['f-cat']||'보유중';
  openAdd(cat==='보유중' ? (d.v['f-status']==='개봉'?'개봉':undefined) : cat);
  ADD_DRAFT_FIELDS.forEach(i=>{ const el=$('#'+i); if(el && d.v[i]!==undefined) el.value=d.v[i]; });
  const fc=$('#f-color');
  if(fc){ if(d.hex) fc.dataset.hex=d.hex; else delete fc.dataset.hex;
          if(d.disc) fc.dataset.photo=d.disc; else delete fc.dataset.photo; }
  window.__addDraft={discPhoto:d.disc||null};
  window.__addPv=d.pv||null;
  openUnknown=!!d.openUnknown;
  { const ub=$('#f-open-unknown'); if(ub) ub.classList.toggle('on', openUnknown); }
  if(d.art){ const pa=$('#pa-prev'); pa.innerHTML=''; const im=document.createElement('img'); im.src=d.art;
             pa.appendChild(im); pa.dataset.url=d.art;
             $('#pt-prev').textContent='이 커버로 저장돼요 ✓'; }
  setupColorField('f'); toggleBuyFields(); paintGradeDesc('f');
  const en=(typeof isEN==='function')&&isEN();
  previewToast(en?'Restored your unfinished entry ✓':'작성 중이던 추가 내용을 복구했어요 ✓');
  return true;
}

/* ---------- persist (in-memory + attempt localStorage) ---------- */
const ratings={};  // key -> 0..5  (for seed items)
const genres={};   // ratingKey -> genre (for seed items)
const likes={};    // ratingKey -> bool (for seed items)
const seedEdits={}; // seed id -> {status,arrive,store,price,orig,buy,pay} edits
function ratingKey(it){ return (it.artist+'|'+it.album+'|'+(it.color||'')).toLowerCase(); }
function saveRating(it){ cloudSaveItem(it); }
function saveLiked(it){ cloudSaveItem(it); }
function saveGenre(it){ cloudSaveItem(it); }
function saveLocal(){ /* 클라우드 모드: 항목별 저장(cloudSaveItem)이 영속성을 담당 */ }
// 변경된 LP 한 장을 Firebase에 저장 (로그인 모듈이 window.LPCloud를 제공)
function cloudSaveItem(it){ if(window.LPCloud && window.LPCloud.saveItem) window.LPCloud.saveItem(it); }
function cloudDeleteItem(id){ if(window.LPCloud && window.LPCloud.deleteItem) window.LPCloud.deleteItem(id); }
function deleteRecord(id){
  const idx=DATA.findIndex(x=>String(x.id)===String(id));
  if(idx<0) return;
  DATA.splice(idx,1);
  cloudDeleteItem(id);
  saveLocal();

}
function loadLocal(){
  try{
    const picks=JSON.parse(localStorage.getItem('lp_picks')||'{}');
    Object.assign(pickedArt,picks);
    Object.keys(picks).forEach(k=>artCache[k]=picks[k]);
    Object.assign(ratings, JSON.parse(localStorage.getItem('lp_ratings')||'{}'));
    Object.assign(genres, JSON.parse(localStorage.getItem('lp_genres')||'{}'));
    Object.assign(likes, JSON.parse(localStorage.getItem('lp_likes')||'{}'));
    Object.assign(seedEdits, JSON.parse(localStorage.getItem('lp_seededits')||'{}'));
    const ext=JSON.parse(localStorage.getItem('lp_added')||'[]');
    if(ext.length){DATA=[...ext,...DATA];ext.forEach(it=>{if(it._art)artCache[artKey(it.artist,it.album)]=it._art;});}
    // apply chosen covers + saved ratings + genres + seed edits to seed items
    DATA.forEach(it=>{
      const k=artKey(it.artist,it.album);if(pickedArt[k])it._art=pickedArt[k];
      if(it.rating==null){ const rk=ratingKey(it); if(ratings[rk]!=null) it.rating=ratings[rk]; }
      if(!it.genre){ const rk=ratingKey(it); if(genres[rk]) it.genre=genres[rk]; }
      { const rk=ratingKey(it); if(it.liked==null && likes[rk]!=null) it.liked=likes[rk]; }
      if(seedEdits[it.id]) Object.assign(it, seedEdits[it.id]);
    });
    loadCollections();
    loadSettings();
  }catch(e){}
}

/* ---------- calendar ---------- */
let calYear, calMonth;   // current view (month is 0-based)
// 하루에 여러 커버가 겹칠 때 사용자가 고른 대표 사진: { 'YYYY-MM-DD': itemId }
let calPick = (()=>{ try{ return JSON.parse(localStorage.getItem('lp_calpick')||'{}')||{}; }catch(e){ return {}; } })();
function saveCalPick(){ try{ localStorage.setItem('lp_calpick', JSON.stringify(calPick)); }catch(e){} }
function artFor(it){ return it._art || pickedArt[artKey(it.artist,it.album)] || artCache[artKey(it.artist,it.album)] || null; }
// 같은 앨범(가수+앨범명)이 여러 장이고 장마다 커버가 다를 때,
// 사용자가 '대표 이미지'로 지정한 장(repCover)의 커버를 우선 사용 (달력·모아보기 표시용)
function repArtFor(it){
  const k=artKey(it.artist,it.album);
  const rep=DATA.find(x=>x.repCover && artKey(x.artist,x.album)===k);
  return (rep && artFor(rep)) || artFor(it);
}
// collect date-events: {date:'YYYY-MM-DD', kind:'arrive'|'buy'|'sold'|'open', it}
function calEvents(){
  const ev=[];
  DATA.forEach(it=>{
    const g=statusGroup(it.status);
    if(g==='위시') return;
    // 판매일 → 흑백
    if(it.status==='판매' && it.sellDate) ev.push({date:it.sellDate, kind:'sold', it});
    // 도착 → 실제로 도착한(=배송전이 아닌) 항목에 도착일이 있을 때만. 배송전의 arrive는 '배송 예정일'이라 도착으로 보지 않음
    if(g!=='배송전' && it.arrive) ev.push({date:it.arrive, kind:'arrive', it});
    // 구매일 → 항상 '구매'로 표기(배송전 포함). 단 같은 날 도착이 이미 있으면 중복 방지로 생략
    if(it.buy && !(g!=='배송전' && it.arrive===it.buy)) ev.push({date:it.buy, kind:'buy', it});
    // 개봉 → CD판 (개봉일자가 있으면 그 날짜, 없으면 도착일/구매일 기준)
    if(it.status==='개봉'){
      const od=(it.openDate && it.openDate!=='모름') ? it.openDate : (it.arrive||it.buy);
      if(od) ev.push({date:od, kind:'open', it});
    }
    // 청음 기록 → 보라 점
    if(Array.isArray(it.listens)){
      it.listens.forEach(l=>{ if(l && l.date) ev.push({date:l.date, kind:'listen', it, note:l.note}); });
    }
  });
  return ev;
}
function renderCal(){
  const now=new Date();
  if(calYear==null){ calYear=now.getFullYear(); calMonth=now.getMonth(); }
  const first=new Date(calYear, calMonth, 1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear, calMonth+1, 0).getDate();
  $('#cal-title').textContent = isEN()
    ? ['January','February','March','April','May','June','July','August','September','October','November','December'][calMonth]+' '+calYear
    : `${calYear}년 ${calMonth+1}월`;
  // index events for this month by day
  const ev=calEvents().filter(e=>{ const d=new Date(e.date); return d.getFullYear()===calYear && d.getMonth()===calMonth; });
  const byDay={};
  ev.forEach(e=>{ const day=new Date(e.date).getDate(); (byDay[day]=byDay[day]||[]).push(e); });
  const dows=['일','월','화','수','목','금','토'];
  $('#cal-dows').innerHTML=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let html='';
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items=byDay[d]||[];
    const isToday = dateStr===todayStr;
    let inner='';
    if(items.length){
      // priority for the visible tile: open(CD) > sold > arrive > buy
      const order={open:0,sold:1,arrive:2,buy:3};
      const rank=k=>(order[k]!=null?order[k]:9);
      // 사용자가 이 날 대표 사진을 골랐으면 그 항목을 우선 사용
      const pid=calPick[dateStr];
      let top, picked=false;
      if(pid){ const c=[...items].filter(e=>e.it.id===pid).sort((a,b)=>rank(a.kind)-rank(b.kind))[0]; if(c){ top=c; picked=true; } }
      if(!top) top=[...items].sort((a,b)=>rank(a.kind)-rank(b.kind))[0];
      const art=repArtFor(top.it);
      const cls = top.kind==='buy'?'ph-buy' : top.kind==='sold'?'ph-sold' : '';
      // 직접 고른 항목은 사진(커버)을 그대로 보여준다. 자동 선택 개봉은 CD판으로.
      if(top.kind==='open' && !(picked && art)){
        inner=`<div class="ph-cd" style="--disc:${discColor(top.it.color)}"></div>`;
      } else if(art){
        inner=`<img class="ph-img ${cls}" src="${art}" alt="">`;
      } else {
        inner=`<div class="ph-img ${cls}" style="background:${discColor(top.it.color)};opacity:${top.kind==='buy'?.6:1}"></div>`;
      }
      const distinct=new Set(items.map(e=>e.it.id)).size;
      if(distinct>1) inner+=`<span class="multi">+${distinct-1}</span>`;
    }
    const hasListen = (byDay[d]||[]).some(e=>e.kind==='listen');
    if(hasListen) inner+=`<span class="listen-dot"></span>`;
    html+=`<div class="cal-cell ${isToday?'today':''} ${inner?'has':''}" data-date="${dateStr}" ${d===1?`style="grid-column-start:${startDow+1}"`:''}>${inner}<span class="dnum">${d}</span></div>`;
  }
  $('#cal-grid').innerHTML=html;
  $('#cal-empty').textContent = ev.length ? '' : '이 달엔 기록이 없어요';
  // 날짜 클릭 → 그날 항목 보기 + 청음 추가
  $('#cal-grid').querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    const items=byDay[+cell.dataset.date.slice(-2)]||[];
    cell.onclick=()=>{ if(window.__calSwiped) return; openDayList(cell.dataset.date, items); };
  });
  // 모든 셀을 누를 수 있게 (청음 추가 가능)
  $('#cal-grid').querySelectorAll('.cal-cell[data-date]').forEach(c=>c.classList.add('has'));
  // 달력의 현재 달에 맞춰 월별 주문/거래 요약 갱신
  const mKey=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  if(typeof renderMonthStat==='function') renderMonthStat(mKey);
}

/* 달력: 하루에 여러 앨범이 있을 때 목록 팝업 */
const KIND_LABEL={open:'개봉',sold:'판매',arrive:'도착',buy:'구매',listen:'청음'};
function openDayList(dateStr, items){
  const wrap=$('#daylist'); if(!wrap) return;
  const d=new Date(dateStr+'T00:00:00');
  const title=`${d.getMonth()+1}월 ${d.getDate()}일`;
  $('#daylist-title').textContent=items.length?`${title} · ${items.length}건`:title;
  let html='';
  // 서로 다른 커버(앨범)가 2개 이상이면 대표 사진을 고를 수 있게 📌 버튼 노출
  const distinctIds=[...new Set(items.map(e=>e.it.id))];
  const showPins = distinctIds.length>1;
  const pinSVG=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8a2 2 0 0 0 .5 1.3l1.9 2.1a1 1 0 0 1-.7 1.8H7.3a1 1 0 0 1-.7-1.8l1.9-2.1a2 2 0 0 0 .5-1.3Z"/></svg>`;
  if(items.length){
    if(showPins) html+=`<div class="dl-pinhint">${pinSVG} 달력에 대표로 나올 앨범을 골라주세요</div>`;
    html+=items.map(ev=>{
      const it=ev.it;
      const art=repArtFor(it);
      const thumb = art
        ? `<img src="${art}" alt="">`
        : `<div class="dl-ph" style="background:${discColor(it.color)}"></div>`;
      const kind=KIND_LABEL[ev.kind]||'';
      const sub = ev.kind==='listen' && ev.note ? `<div class="dl-note">🎧 ${escapeHtml(ev.note)}</div>` : '';
      const on = showPins && calPick[dateStr]===it.id;
      const item=`<button type="button" class="dl-item" data-id="${it.id}">
        <div class="dl-thumb">${thumb}</div>
        <div class="dl-info">
          <div class="dl-al">${escapeHtml(it.album||'제목 없음')}${on?'<span class="dl-rep">대표</span>':''}</div>
          <div class="dl-ar">${escapeHtml(it.artist||'')}</div>
          ${sub}
        </div>
        <span class="dl-kind dl-${ev.kind}">${kind}</span>
      </button>`;
      if(!showPins) return item;
      const pin=`<button type="button" class="dl-pin ${on?'on':''}" data-pin="${it.id}" title="${on?'대표 지정 해제':'이 날 대표 사진으로 지정'}" aria-label="대표 사진 지정">${pinSVG}</button>`;
      return `<div class="dl-row${on?' picked':''}">${item}${pin}</div>`;
    }).join('');
  } else {
    html+=`<div class="dl-emptyday">이 날엔 기록이 없어요.</div>`;
  }
  html+=`<button type="button" class="dl-addlisten" id="dl-addlisten">🎧 청음 기록 추가</button>`;
  html+=`<button type="button" class="dl-addlisten" id="dl-addbuy">🛒 구매내역 추가</button>`;
  html+=`<button type="button" class="dl-addlisten" id="dl-addsx">🔁 판매·교환 내역 추가</button>`;
  wrap.innerHTML=html;
  wrap.querySelectorAll('.dl-item').forEach(b=>b.onclick=()=>{ hide('daylist'); openDetail(b.dataset.id); });
  wrap.querySelectorAll('.dl-pin').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.pin;
    if(calPick[dateStr]===id) delete calPick[dateStr];   // 다시 누르면 자동 선택으로 되돌림
    else calPick[dateStr]=id;
    saveCalPick(); renderCal();
    openDayList(dateStr, items);   // 팝업 다시 그려 선택 상태 갱신
  });
  $('#dl-addlisten').onclick=()=>{ hide('daylist'); openListenPicker(dateStr); };
  $('#dl-addbuy').onclick=()=>{ hide('daylist'); openAdd(undefined, dateStr); };
  $('#dl-addsx').onclick=()=>{ hide('daylist'); openSellExchange(dateStr); };
  show('daylist');
}

/* 청음 추가: 어떤 앨범을 들었는지 고르는 작은 선택 (그 날짜로 기록) */
function openListenPicker(dateStr){
  const owned=DATA.filter(d=>statusGroup(d.status)!=='위시')
    .sort((a,b)=>(a.album||'').localeCompare(b.album||''));
  const wrap=$('#daylist'); if(!wrap) return;
  const d=new Date(dateStr+'T00:00:00');
  $('#daylist-title').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 · 들은 앨범 선택`;
  const itemHTML=(it)=>{
    const art=artFor(it);
    const thumb=art?`<img src="${art}" alt="">`:`<div class="dl-ph" style="background:${discColor(it.color)}"></div>`;
    return `<button type="button" class="dl-item" data-id="${it.id}">
      <div class="dl-thumb">${thumb}</div>
      <div class="dl-info"><div class="dl-al">${escapeHtml(it.album||'제목 없음')}</div><div class="dl-ar">${escapeHtml(it.artist||'')}</div></div>
      <span class="dl-kind dl-listen">선택</span>
    </button>`;
  };
  wrap.innerHTML=`
    <input type="text" id="lp-search" class="lp-search" placeholder="🔍 앨범·가수 검색" autocomplete="off">
    <div class="lp-results" id="lp-results">${owned.map(itemHTML).join('') || `<div class="dl-emptyday">등록된 앨범이 없어요.</div>`}</div>`;
  const bindItems=()=>{
    wrap.querySelectorAll('.dl-item').forEach(b=>b.onclick=()=>{
      const it=DATA.find(x=>String(x.id)===String(b.dataset.id));
      hide('daylist');
      openListenForm(it, dateStr);
    });
  };
  bindItems();
  const search=$('#lp-search');
  if(search) search.oninput=()=>{
    const q=search.value.trim().toLowerCase();
    const filtered = q ? owned.filter(it=>((it.album||'')+' '+(it.artist||'')).toLowerCase().includes(q)) : owned;
    $('#lp-results').innerHTML = filtered.length ? filtered.map(itemHTML).join('') : `<div class="dl-emptyday">검색 결과가 없어요.</div>`;
    bindItems();
  };
  show('daylist');
  setTimeout(()=>{ try{ search && search.focus(); }catch(e){} }, 150);
}

    const storeMap={};
    real.forEach(d=>{ const raw=(d.store||'').trim(); if(!raw||raw==='-')return;

/* ===== 월별 요약 (달력 아래, 달력의 그 달에 연동) ===== */
function renderMonthStat(m){
  const body=$('#cal-monthstat'); if(!body) return;
  const buy   = DATA.filter(d=>d.buy && String(d.buy).slice(0,7)===m && statusGroup(d.status)!=='위시');
  const soldM = DATA.filter(d=>d.sellDate && String(d.sellDate).slice(0,7)===m && d.status==='판매');
  const exchM = DATA.filter(d=>d.sellDate && String(d.sellDate).slice(0,7)===m && d.status==='교환');
  // 청음: 그 달에 들은 기록들 (앨범+날짜+메모를 펼침용으로 보관)
  const listenEv=[];
  DATA.forEach(d=>{ if(Array.isArray(d.listens)) d.listens.forEach(l=>{ if(l&&l.date&&String(l.date).slice(0,7)===m) listenEv.push({it:d, date:l.date, note:l.note}); }); });
  listenEv.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const buyAmt = buy.reduce((s,d)=>s+(d.price||0),0);
  const sellAmt= soldM.reduce((s,d)=>s+(d.sellPrice||0),0);
  const cards=[
    ['구매', buy, won(buyAmt), '#e8643c', 'buy'],
    ['판매·교환', soldM.concat(exchM), sellAmt?won(sellAmt):'', '#5ec27e', 'deal'],
    ['청음', listenEv, '', '#8a6fd6', 'listen'],
  ];
  const albumLine=(d,kind)=>{
    let extra='';
    if(kind==='buy' && d.price!=null) extra=` <span class="ms-li-amt">${won(d.price)}</span>`;
    else if(kind==='deal' && d.sellPrice!=null) extra=` <span class="ms-li-amt">${won(d.sellPrice)}</span>`;
    return `<div class="ms-li" data-id="${d.id}"><span class="ms-li-al">${escapeHtml(d.album||'—')}</span><span class="ms-li-ar">${escapeHtml(d.artist||'')}</span>${extra}</div>`;
  };
  const listenLine=(ev)=>{
    const mm=parseInt((ev.date||'').slice(5,7),10);
    const dd=parseInt((ev.date||'').slice(8,10),10);
    const dateLabel=(mm&&dd)?`${mm}/${dd}`:'';
    return `<div class="ms-li" data-id="${ev.it.id}"><span class="ms-li-al">${escapeHtml(ev.it.album||'—')}</span><span class="ms-li-ar">${escapeHtml(ev.it.artist||'')}</span>${ev.note?`<span class="ms-li-note">🎧 ${escapeHtml(ev.note)}</span>`:''}<span class="ms-li-amt">${dateLabel}</span></div>`;
  };
  if(!buy.length && !soldM.length && !exchM.length && !listenEv.length){
    body.innerHTML=`<div class="ms-head">이 달의 기록</div><div class="mstat-empty">이 달에는 구매·판매·교환·청음 기록이 없어요.</div>`;
    return;
  }
  body.innerHTML=`
    <div class="ms-head">이 달의 기록</div>
    <div class="mstat-cards">
      ${cards.map(([lab,arr,sub,c,key])=>`
        <button type="button" class="mstat-card${arr.length?' tappable':''}" data-key="${key}" ${arr.length?'':'disabled'}>
          <div class="mstat-dot" style="background:${c}"></div>
          <div class="mstat-lab">${lab}</div>
          <div class="mstat-cnt">${arr.length}<span>${key==='listen'?'회':'장'}</span></div>
          ${sub?`<div class="mstat-sub">${sub}</div>`:''}
          ${arr.length?`<div class="mstat-more" id="ms-more-${key}">▾</div>`:''}
        </button>`).join('')}
    </div>
    <div class="ms-detail" id="ms-detail"></div>`;
  const lists={ buy, deal:soldM.concat(exchM), listen:listenEv };
  let openKey=null;
  body.querySelectorAll('.mstat-card.tappable').forEach(btn=>btn.onclick=()=>{
    const key=btn.dataset.key;
    const det=$('#ms-detail');
    body.querySelectorAll('.mstat-card').forEach(c=>c.classList.remove('on'));
    body.querySelectorAll('.mstat-more').forEach(e=>e.textContent='▾');
    if(openKey===key){ openKey=null; det.innerHTML=''; det.classList.remove('show'); return; }
    openKey=key;
    btn.classList.add('on');
    const more=$('#ms-more-'+key); if(more) more.textContent='▴';
    det.innerHTML=lists[key].map(d=> key==='listen' ? listenLine(d) : albumLine(d,key)).join('');
    det.classList.add('show');
    det.querySelectorAll('.ms-li').forEach(li=>li.onclick=()=>openDetail(li.dataset.id));
  });
}

/* ===== 내 취향 요약 (LP 데이터 기반) ===== */
function renderTaste(){
  const wrap=$('#taste'); if(!wrap) return;
  const owned=DATA.filter(d=>statusGroup(d.status)!=='위시');   // 위시 제외, 보유/판매/교환 포함
  if(!owned.length){ wrap.innerHTML=`<div class="coll-empty">아직 데이터가 부족해요.</div>`; return; }

  // 집계 헬퍼
  const tally=(key)=>{ const m={}; owned.forEach(d=>{ const k=(d[key]||'').trim(); if(!k||k==='-')return; m[k]=(m[k]||0)+1; }); return m; };
  const top=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);

  // 1) 최애 아티스트 TOP3 (보유 수 → 평균 평점 가산)
  const byArtist={};
  owned.forEach(d=>{ const a=(d.artist||'').trim(); if(!a||a==='-')return; (byArtist[a]=byArtist[a]||[]).push(d); });
  const artistRank=Object.entries(byArtist).map(([a,arr])=>{
    const cnt=arr.length; const rated=arr.filter(x=>x.rating); const avg=rated.length?rated.reduce((s,x)=>s+x.rating,0)/rated.length:0;
    return {a, cnt, avg};
  }).sort((x,y)=> y.cnt-x.cnt || y.avg-x.avg).slice(0,3);

  // 2) 최애 장르 TOP3
  const genreTop=top(tally('genre'),3);
  const genreMax=genreTop.length?genreTop[0][1]:1;

  // 3) 가장 많이 들은 앨범 TOP5 (청음 기록 횟수)
  const listenRank=DATA
    .map(d=>({d, cnt:Array.isArray(d.listens)?d.listens.length:0}))
    .filter(x=>x.cnt>0)
    .sort((a,b)=>b.cnt-a.cnt)
    .slice(0,5);

  const cards=[];

  // 최애 아티스트
  cards.push(`<div class="t-card">
    <div class="t-head">최애 아티스트</div>
    ${artistRank.map((r,i)=>`<div class="t-row t-tap" data-ta="${i}"><span class="t-rank">${i+1}</span><span class="t-name">${escapeHtml(r.a)}</span><span class="t-val">${r.cnt}${isEN()?'':'<span class="u">장</span>'}${r.avg?` · ★${r.avg.toFixed(1)}`:''}</span></div>`).join('')||'<div class="t-empty">데이터 없음</div>'}
  </div>`);

  // 최애 장르
  cards.push(`<div class="t-card">
    <div class="t-head">최애 장르</div>
    ${genreTop.map(([g,c],i)=>`<div class="t-bar-row t-tap" data-tg="${i}"><span class="t-bar-lab">${escapeHtml(g)}</span><span class="t-bar-track"><span class="t-bar-fill" style="width:${Math.round(c/genreMax*100)}%"></span></span><span class="t-bar-num">${c}</span></div>`).join('')||'<div class="t-empty">데이터 없음</div>'}

  </div>`);

  wrap.innerHTML=cards.join('');

  wrap.querySelectorAll('[data-ta]').forEach(el=>el.onclick=()=>{
    const r=artistRank[+el.dataset.ta]; if(!r) return;
    openTasteList(`${r.a} · ${r.cnt}장`, (byArtist[r.a]||[]).map(it=>({it, tag: it.rating?('★'+it.rating):(it.status||'')})));
  });
  // 최애 장르 → 그 장르 앨범들
  wrap.querySelectorAll('[data-tg]').forEach(el=>el.onclick=()=>{
    const g=genreTop[+el.dataset.tg]; if(!g) return;
    openTasteList(`${g[0]} · ${g[1]}장`, owned.filter(d=>(d.genre||'').trim()===g[0]).map(it=>({it, tag: it.year?String(it.year):''})));
  });
  // 가장 많이 들은 앨범 → 그 앨범의 청음 기록들
  wrap.querySelectorAll('.t-row.t-tap[data-id]').forEach(el=>el.onclick=()=>{
    const it=DATA.find(d=>d.id===el.dataset.id); if(!it) return;
    const rows=(it.listens||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))
      .map(l=>({it, sub: l.note?('🎧 '+l.note):(it.artist||''), tag: dShort(l.date)}));
    openTasteList(`${it.album||it.artist} · 청음 ${rows.length}회`, rows);
  });
}
// 취향 요약 순위 클릭 → 해당 앨범 목록 팝업 (daylist 시트 재사용)
function openTasteList(title, rows){
  const wrap=$('#daylist'); if(!wrap) return;
  $('#daylist-title').textContent=title;
  wrap.innerHTML=(rows&&rows.length)?rows.map(r=>{
    const it=r.it; const art=artFor(it);
    const thumb=art?`<img src="${art}" alt="">`:`<div class="dl-ph" style="background:${it.colorHex||discColor(it.color)}"></div>`;
    return `<button type="button" class="dl-item" data-id="${it.id}">
      <div class="dl-thumb">${thumb}</div>
      <div class="dl-info">
        <div class="dl-al">${escapeHtml(it.album||'제목 없음')}</div>
        <div class="dl-ar">${r.sub!=null?escapeHtml(r.sub):escapeHtml(it.artist||'')}</div>
      </div>
      ${r.tag?`<span class="dl-kind">${r.tag}</span>`:''}
    </button>`;
  }).join('') : `<div class="dl-emptyday">해당하는 앨범이 없어요.</div>`;
  wrap.querySelectorAll('.dl-item').forEach(b=>b.onclick=()=>{ hide('daylist'); openDetail(b.dataset.id); });
  show('daylist');
}
// 특정 연도 팝업 (수집 히스토리 바 클릭): 월별 통계 + 구매 앨범 목록.
// 월 바를 누르면 그 달만 필터, 다시 누르면 전체로.
function openYearList(year, monthSel){
  const wrap=$('#daylist'); if(!wrap) return;
  const all=DATA.filter(d=>d.buy && String(d.buy).slice(0,4)===String(year) && statusGroup(d.status)!=='위시')
                .sort((a,b)=>String(a.buy).localeCompare(String(b.buy)));
  const byM=Array.from({length:12},()=>0);
  all.forEach(it=>{ const m=parseInt(String(it.buy).slice(5,7),10); if(m>=1&&m<=12) byM[m-1]++; });
  const mMax=Math.max(1,...byM);
  const list = monthSel ? all.filter(it=>parseInt(String(it.buy).slice(5,7),10)===monthSel) : all;
  $('#daylist-title').textContent = monthSel ? `${year}년 ${monthSel}월 · ${list.length}장` : `${year}년 수집 · ${all.length}장`;
  let months='';
  if(all.length){
    months=`<div class="dl-months">${byM.map((n,i)=>`
      <div class="dl-month ${monthSel===i+1?'on':''} ${n?'':'zero'}" data-m="${i+1}" role="button" title="${i+1}월 ${n}장">
        <span class="dl-mbar" style="height:${Math.round(n/mMax*100)}%"></span>
        <span class="dl-mnum">${n||''}</span>
        <span class="dl-mlab">${i+1}</span>
      </div>`).join('')}</div>`;
  }
  if(!list.length){
    wrap.innerHTML=months+`<div class="dl-emptyday">${monthSel?'이 달에 구매한 앨범이 없어요.':'이 해에 구매한 앨범이 없어요.'}</div>`;
  }else{
    wrap.innerHTML=months+list.map(it=>{
      const art=artFor(it);
      const thumb=art?`<img src="${art}" alt="">`:`<div class="dl-ph" style="background:${discColor(it.color)}"></div>`;
      const md=(String(it.buy).slice(5,10)||'').replace('-','.');   // MM.DD
      return `<button type="button" class="dl-item" data-id="${it.id}">
        <div class="dl-thumb">${thumb}</div>
        <div class="dl-info">
          <div class="dl-al">${escapeHtml(it.album||'제목 없음')}</div>
          <div class="dl-ar">${escapeHtml(it.artist||'')}</div>
        </div>
        <span class="dl-kind">${md}</span>
      </button>`;
    }).join('');
  }
  wrap.querySelectorAll('.dl-item').forEach(b=>b.onclick=()=>{ hide('daylist'); openDetail(b.dataset.id); });
  wrap.querySelectorAll('.dl-month').forEach(b=>b.onclick=()=>{
    const m=+b.dataset.m;
    openYearList(year, monthSel===m?null:m);   // 같은 달 다시 누르면 전체로
  });
  show('daylist');
}
// 컬러명을 대표 그룹으로 정규화
function normColorName(c){
  if(!c) return '';
  const s=String(c).toLowerCase();
  if(/블랙|black|검/.test(s)) return '블랙';
  if(/화이트|white|스노우|snow|불투명/.test(s)) return '화이트';
  if(/투명|clear|클리어/.test(s)) return '투명';
  if(/그레이|gray|grey|회/.test(s)) return '그레이';
  if(/레드|red|자주|핑크|pink|버건디/.test(s)) return '레드';
  if(/블루|blue|아이스/.test(s)) return '블루';
  if(/그린|green|에메랄드|민트/.test(s)) return '그린';
  if(/옐로|yellow|골드|gold/.test(s)) return '옐로우';
  if(/오렌지|orange/.test(s)) return '오렌지';
  if(/퍼플|purple|보라|바이올렛/.test(s)) return '퍼플';
  if(/마블|스플|splatter/.test(s)) return '마블';
  return '기타';
}
function colorHexFor(name){
  return {'블랙':'#222','화이트':'#e8e8e8','투명':'#c9d2da','그레이':'#8a8a8a','레드':'#d63a3a','블루':'#3a6fd6','그린':'#36a35a','옐로우':'#e6c23a','오렌지':'#e8843a','퍼플':'#8a4fd6','마블':'#9a8fb0','기타':'#6a6478'}[name]||'#6a6478';
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function exportData(){
  try{
    const payload={ exportedAt:new Date().toISOString(), version:1,
      items:DATA, collections:(typeof COLLECTIONS!=='undefined'?COLLECTIONS:[]), settings:SETTINGS };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='lp-archive-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ alert('내보내기에 실패했어요'); }
}

// 카카오 개발자 → 내 애플리케이션 → 앱 키 → 'JavaScript 키' 를 아래에 붙여넣으세요.
// (Web 플랫폼에 도메인 lp-archive.web.app 등록 필요) 키가 없으면 공유시트/링크복사로 자동 폴백.
const KAKAO_JS_KEY = '0f097d91a2944ee6d2ba148b30139f36';
function _kakaoReady(){
  return new Promise(resolve=>{
    if(!KAKAO_JS_KEY || KAKAO_JS_KEY.indexOf('PASTE')===0) return resolve(null);
    const done=()=>{ try{ if(window.Kakao && !window.Kakao.isInitialized()) window.Kakao.init(KAKAO_JS_KEY); resolve((window.Kakao&&window.Kakao.Share)?window.Kakao:null); }catch(e){ resolve(null); } };

    const s=document.createElement('script'); s.src='https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js';
    s.crossOrigin='anonymous'; s.onload=done; s.onerror=()=>resolve(null); document.head.appendChild(s);
  });
}
// 카카오 SDK 미리 로드 (공유 클릭 시 제스처 안에서 즉시 sendDefault 하도록)
try{ _kakaoReady(); }catch(e){}
function _copyShareUrl(url){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('공유 링크를 복사했어요 🎵\n'+url), ()=>prompt('아래 링크를 복사해 공유하세요', url)); return; } }catch(e){}
  prompt('아래 링크를 복사해 공유하세요', url);
}
// 이 컬렉션을 공개 링크로 공유. 공유 호출(카카오/공유시트)은 반드시 클릭 제스처 안에서 '즉시' 실행해야
// 팝업/공유시트가 차단되지 않는다. 따라서 shareId는 동기로 만들고, Firestore 발행은 백그라운드로 돌린다.
function shareCurrentCollection(){
  const c=COLLECTIONS.find(x=>x.id===_collOpenId); if(!c) return;
  if(!(window.LPCloud && window.LPCloud.shareCollection)){ alert('미리보기에서는 동작하지 않아요. 실제 앱에서 사용하세요.'); return; }
  if(!(c.ids&&c.ids.length)){ alert('공유할 LP가 없어요. 먼저 컬렉션에 LP를 담아주세요.'); return; }
  const shareId = c.shareId || ((self.crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,''):(Date.now().toString(36)+Math.random().toString(36).slice(2,10)));
  if(c.shareId!==shareId){ c.shareId=shareId; saveCollections(); }
  const url='https://lp-archive.web.app/?c='+encodeURIComponent(shareId);
  const count=(c.ids||[]).length;
  let img='https://lp-archive.web.app/icons/icon-512.png';
  for(const id of (c.ids||[])){ const it=DATA.find(x=>x.id===id); const cov=it&&(typeof artFor==='function'?artFor(it):(it._art||it.cover)); if(cov && /^https?:/.test(cov)){ img=cov; break; } }
  // 공유 문서 발행 — 백그라운드(제스처 유지). 링크와 동일 shareId 사용.
  try{ Promise.resolve(window.LPCloud.shareCollection(c, shareId)).catch(e=>console.error('share write', e)); }catch(e){ console.error(e); }
  const _text=`'${c.name||'컬렉션'}' 컬렉션을 공유했어요 🎵`;
  // 0) 앱(네이티브): 카카오 JS SDK는 앱 도메인(https://localhost)과 안 맞으므로 OS 공유시트로 공유.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
    const Sh=window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if(Sh && Sh.share){ try{ Sh.share({ title:(c.name||'내 바이닐 컬렉션'), text:_text, url, dialogTitle:'컬렉션 공유' }); }catch(e){ if(navigator.share) navigator.share({title:(c.name||'내 바이닐 컬렉션'),text:_text,url}).catch(()=>_copyShareUrl(url)); else _copyShareUrl(url); } return; }
    if(navigator.share){ navigator.share({ title:(c.name||'내 바이닐 컬렉션'), text:_text, url }).catch(e=>{ if(e&&e.name!=='AbortError') _copyShareUrl(url); }); return; }
    _copyShareUrl(url); return;
  }
  // 1) 카카오톡 예쁜 카드 (Web 도메인 등록 완료 시) — 제스처 안에서 즉시
  if(window.Kakao && window.Kakao.Share && window.Kakao.isInitialized && window.Kakao.isInitialized()){
    try{
      window.Kakao.Share.sendDefault({ objectType:'feed',
        content:{ title:(c.name||'내 바이닐 컬렉션'), description:`${count}장의 LP · My Vinyl`, imageUrl:img, link:{ mobileWebUrl:url, webUrl:url } },
        buttons:[{ title:'컬렉션 보러가기', link:{ mobileWebUrl:url, webUrl:url } }] });
      return;
    }catch(e){ console.warn('kakao share fail → fallback', e); }
  }
  // 2) 공유시트(카카오 SDK 준비 전/미지원 환경) — 제스처 안에서 즉시, 실패 시 3) 링크 복사
  if(navigator.share){ navigator.share({ title:(c.name||'내 바이닐 컬렉션'), text:`'${c.name||'컬렉션'}' 컬렉션을 공유했어요 🎵`, url }).catch(e=>{ if(e&&e.name!=='AbortError') _copyShareUrl(url); }); return; }
  _copyShareUrl(url);
}

{ const cg=$('#cal-grid'); if(cg){

} }

/* ---------- Cover Flow ---------- */
let cfItems=[], cfIndex=0, cfCards=[], cfMode='cover';   // 'cover' | 'vinyl'
function applyCfMode(){
  const stage=$('#cf-stage'); if(stage) stage.classList.toggle('vinyl-mode', cfMode==='vinyl');
  const btn=$('#cf-mode-toggle'); if(btn){ btn.classList.toggle('on', cfMode==='vinyl'); btn.title = cfMode==='vinyl' ? '자켓 보기로 전환' : 'LP판 보기로 전환'; }
  const lab=$('#cf-mode-lab'); if(lab) lab.textContent = cfMode==='vinyl' ? '자켓 보기' : 'LP판 보기';
}
function buildCoverFlow(){
  cfItems=DATA.filter(d=>{const g=statusGroup(d.status);return g==='보유중'||g==='배송전';});  // 소장/예정만
  if(typeof SETTINGS==='undefined' || SETTINGS.dedupeFlow!==false){   // 같은 앨범(가수+앨범명)은 한 장만
    const norm=d=>((d.artist||'')+'|'+(d.album||'')).toLowerCase().replace(/\s+/g,'');
    const repKeys=new Set(cfItems.filter(d=>d.repCover).map(norm));   // 대표 이미지가 지정된 앨범
    const seen=new Set();
    cfItems=cfItems.filter(d=>{ const k=norm(d);
      if(seen.has(k)) return false;
      if(repKeys.has(k) && !d.repCover) return false;   // 대표로 지정한 장이 따로 있으면 그 장을 보여준다
      seen.add(k); return true; });
  }
  if(!cfItems.length) cfItems=DATA.slice();
  const track=$('#cf-track');
  track.innerHTML=cfItems.map((it,i)=>{
    const dStyle = it.discPhoto
      ? `--photo:url(${it.discPhoto})`
      : `--disc:${it.colorHex||it.discColorCustom||discColor(it.color)};opacity:${it.discOpacity!=null?it.discOpacity:1}`;
    return `
    <div class="cf-card" data-i="${i}" data-id="${it.id}">
      <div class="cf-art">
        <div class="cf-ph"><div class="v"></div><div>${it.artist||'?'}</div></div>
        <img data-cf="${it.id}" alt="">
        <div class="cf-disc${it.discPhoto?' has-photo':''}" style="${dStyle}"></div>
      </div>
    </div>`;
  }).join('');
  cfCards=[...track.querySelectorAll('.cf-card')];
  // load art for each cover-flow card (reuse cache)
  cfItems.forEach(async it=>{
    const img=track.querySelector(`img[data-cf="${it.id}"]`);
    const url=it._art||pickedArt[artKey(it.artist,it.album)]||await fetchArt(it.artist,it.album);
    if(url&&img){img.src=url;img.onload=()=>{const ph=img.parentElement.querySelector('.cf-ph'); if(ph) ph.style.display='none';};}
  });
  cfIndex=Math.min(cfIndex,cfItems.length-1);
  layoutCoverFlow();
  applyCfMode();
  // tap center card -> 미리듣기 재생/일시정지 (길게 누르면 상세)
  cfCards.forEach(c=>{
    let lpTimer=null, lpFired=false, px=0, py=0;
    const clearLp=()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } };
    c.addEventListener('pointerdown',e=>{
      lpFired=false; px=e.clientX; py=e.clientY;
      if(+c.dataset.i===cfIndex){ lpTimer=setTimeout(()=>{ lpFired=true; openDetail(c.dataset.id); }, 550); }
    });
    c.addEventListener('pointermove',e=>{ if(Math.hypot(e.clientX-px,e.clientY-py)>10) clearLp(); });
    c.addEventListener('pointerup',clearLp);
    c.addEventListener('pointercancel',clearLp);
    c.addEventListener('click',()=>{
      if(lpFired){ lpFired=false; return; }   // 길게 눌러 상세를 연 경우
      const i=+c.dataset.i;
      if(i===cfIndex) cfTogglePlay();
      else { cfIndex=i; layoutCoverFlow(); }
    });
  });
  cfSyncPlayer();
}
// 커버플로우 중앙 카드 미리듣기 컨트롤
function cfCenterDisc(){ const c=cfCards[cfIndex]; return c ? c.querySelector('.cf-disc') : null; }
function cfSyncPlayer(){
  const pl=$('#cf-player'); if(!pl) return;
  const it=cfItems[cfIndex];
  const mine = it && _preview.id===it.id && _preview.audio;
  pl.style.display = mine ? 'flex' : 'none';
  pl.classList.toggle('playing', !!(mine && !_preview.paused));
}
function cfTogglePlay(){
  const it=cfItems[cfIndex]; if(!it) return;
  if(_preview.id===it.id && _preview.audio){
    if(_preview.paused) _resumePreview(); else _pausePreview();
  } else {
    playPreview(it, cfCenterDisc());
  }
  setTimeout(cfSyncPlayer, 250);   // playPreview 는 URL 조회가 비동기라 살짝 늦게 상태 반영
  setTimeout(cfSyncPlayer, 1200);
}
{ const pv=$('#cfp-prev'), nx=$('#cfp-next'), pp=$('#cfp-play');
  if(pp) pp.onclick=(e)=>{ e.stopPropagation(); cfTogglePlay(); };
  if(pv) pv.onclick=(e)=>{ e.stopPropagation(); const it=cfItems[cfIndex]; if(!it) return;
    if(_preview.id===it.id) previewStep(-1, cfCenterDisc()); else cfTogglePlay(); setTimeout(cfSyncPlayer,150); };
  if(nx) nx.onclick=(e)=>{ e.stopPropagation(); const it=cfItems[cfIndex]; if(!it) return;
    if(_preview.id===it.id) previewStep(1, cfCenterDisc()); else cfTogglePlay(); setTimeout(cfSyncPlayer,150); };
}
function layoutCoverFlow(){
  cfCards.forEach((c,i)=>{
    const off=i-cfIndex;
    const ax=Math.abs(off);
    if(ax>4){c.style.display='none';return;} c.style.display='';
    const x=off*48;                       // horizontal shelf spacing
    const z=-ax*120;                      // depth
    const rot=off===0?0:(off<0?42:-42);   // turn side covers
    const sc=off===0?1.18:0.92;
    c.style.transform=`translateX(${x}px) translateZ(${z}px) rotateY(${rot}deg) scale(${sc})`;
    c.style.zIndex=String(100-ax);
    c.querySelector('.cf-art').style.boxShadow=off===0?'0 22px 38px rgba(0,0,0,.6)':'0 14px 22px rgba(0,0,0,.45)';
    c.querySelector('.cf-art').style.filter=off===0?'none':'brightness(.7)';
  });

function dataURLToBlob(dataURL){
  const parts=dataURL.split(','); const head=parts[0]||'';
  const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(parts[1]||''); const len=bin.length; const arr=new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

(function setupEdgeSwipeBack(){
  const EDGE=40;        // 왼쪽 가장자리에서 이 픽셀 안쪽에서 시작해야 인식
  const TRIGGER=0.32;   // 화면 너비의 이 비율 이상 밀면 닫힘
  const W=()=>window.innerWidth||document.documentElement.clientWidth;
  let active=false, x0=0, y0=0, dx=0, dy=0, axis=null, sheet=null;
  function topSheet(){ const s=document.querySelectorAll('.sheet.show'); return s.length?s[s.length-1]:null; }
  window.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    if(document.getElementById('exit-confirm')) return;
    const t=e.touches[0];
    if(t.clientX>EDGE) return;            // 왼쪽 가장자리에서 시작한 제스처만
    active=true; x0=t.clientX; y0=t.clientY; dx=0; dy=0; axis=null;
    sheet=topSheet();                     // 닫을 시트가 없으면 시각 피드백 없이 무시
    // 컬렉션 시트는 좌우 스와이프로 닫지 않는다(위아래 드래그만) — 가로 제스처 무시
    if(sheet && /^sheet-(colldetail|collnew|collpick)$/.test(sheet.id)){ active=false; sheet=null; return; }
  },{passive:true});
  window.addEventListener('touchmove',e=>{
    if(!active) return;
    const t=e.touches[0]; dx=t.clientX-x0; dy=t.clientY-y0;
    if(axis===null){
      if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
      axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
      if(axis!=='x'){ active=false; return; }   // 세로 제스처면 기존 핸들러에 양보
      if(sheet) sheet.style.transition='none';
    }
    if(dx<0) dx=0;
    e.preventDefault();                   // 가로 스와이프 중 페이지 흔들림 방지
    if(sheet){
      sheet.style.transform=`translateX(calc(-50% + ${dx}px))`;
      sheet.style.opacity=String(Math.max(.4, 1-dx/W()));
    }
  },{passive:false});
  function settle(){
    if(!active) return; active=false;
    const s=sheet; sheet=null;
    if(axis!=='x' || !s){ return; }
    s.style.transition='';
    if(dx > W()*TRIGGER){
      const name=s.id.replace('sheet-','');
      try{ if(typeof stopBarcodeScan==='function') stopBarcodeScan(); }catch(e){}
      s.style.transform=`translateX(calc(-50% + 100vw))`;
      s.style.opacity='0';
      setTimeout(()=>{ try{ hide(name); }catch(e){ s.classList.remove('show'); }
        s.style.transform=''; s.style.opacity=''; }, 230);
    } else {
      s.style.transform=''; s.style.opacity='';   // 임계값 미달 → 원위치
    }
  }
  window.addEventListener('touchend',settle);
  window.addEventListener('touchcancel',settle);
})();
