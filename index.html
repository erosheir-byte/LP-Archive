<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Vinyl</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0d11">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Vinyl">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d11;
  --bg2:#16141b;
  --card:#1b1922;
  --card2:#221f2b;
  --line:#2c2935;
  --txt:#f3eef7;
  --muted:#9d96aa;
  --dim:#6a6478;
  --accent:#e8643c;
  --accent2:#f2a444;
  --green:#5ec27e;
  --red:#e85c6a;
  --blue:#6aa0e8;
}
/* ===== 라이트(브라이트) 테마 ===== */
html[data-theme="light"]{
  --bg:#f3f0ec;
  --bg2:#ffffff;
  --card:#ffffff;
  --card2:#f6f2ee;
  --line:#e6e0d9;
  --txt:#1d1a23;
  --muted:#6c6675;
  --dim:#a39caa;
}
html[data-theme="light"] .nav{background:rgba(255,255,255,.9)}
html[data-theme="light"] .dt-art{background:var(--card2)}
html[data-theme="light"] .dt-art .picker{background:rgba(255,255,255,.95)}
html[data-theme="light"] .cf-mode-toggle{color:var(--txt)}
html[data-theme="light"] .toast{background:rgba(40,36,48,.92)}
html[data-theme="light"] body::before{opacity:.55}
html[data-theme="light"] .set-acc.on,
html[data-theme="light"] .coll-colors .cc.on,
html[data-theme="light"] .palette .sw.on,
html[data-theme="light"] .vd-quickpal .vd-sw.on{border-color:#1d1a23}
/* ===== 앱 종료 확인 모달 ===== */
.exit-ov{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:30px;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s}
.exit-ov.show{opacity:1;pointer-events:auto}
.exit-box{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:24px 22px 18px;width:100%;max-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:scale(.94);transition:.2s}
.exit-ov.show .exit-box{transform:scale(1)}
.exit-t{font-size:16px;font-weight:700;color:var(--txt);text-align:center;margin-bottom:20px;line-height:1.4}
.exit-btns{display:flex;gap:10px}
.exit-btns button{flex:1;padding:13px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.exit-cancel{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.exit-ok{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#160d09}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;overscroll-behavior:none}
body{padding-bottom:90px;max-width:560px;margin:0 auto;position:relative;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(900px 500px at 80% -10%, rgba(232,100,60,.14), transparent 60%),
  radial-gradient(700px 500px at 0% 100%, rgba(106,160,232,.10), transparent 55%);
  pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}

/* Header */
header{padding:30px 20px 16px;position:relative}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
h1 .em{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:12px;font-weight:500}
.sub b{color:var(--txt);font-weight:700}
.sub .sep{color:var(--dim);margin:0 7px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 20px 16px}
.stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px 15px;position:relative;overflow:hidden}
.stat .lab{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.stat .val{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:25px;margin-top:5px;letter-spacing:-.02em}
.stat .val.sm{font-size:21px}
.stat.pos .val{color:var(--green)}
.stat .deco{position:absolute;right:-8px;bottom:-10px;font-size:54px;opacity:.07;font-family:'Bricolage Grotesque'}

/* Cover Flow */
.cf-wrap{padding:6px 0 2px;margin-bottom:14px}
.cf-stage{position:relative;height:188px;overflow:hidden;touch-action:pan-y;cursor:grab;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.18));perspective:1100px;user-select:none}
.cf-stage:active{cursor:grabbing}
.cf-stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(180deg,transparent,rgba(14,13,17,.85));pointer-events:none}
/* 좌/우 꾹 누르기 영역 (화살표 대신) */
.cf-hold{position:absolute;top:0;bottom:0;width:26%;z-index:18;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center}
.cf-hold-l{left:0;justify-content:flex-start;padding-left:10px}
.cf-hold-r{right:0;justify-content:flex-end;padding-right:10px}
.cf-hold:active{background:radial-gradient(circle at var(--gx,50%) 50%,rgba(232,100,60,.14),transparent 70%)}
.cf-hold-l:active{--gx:25%}
.cf-hold-r:active{--gx:75%}
/* 있는 듯 없는 듯한 화살표 힌트 */
.cf-hold::after{content:'';width:14px;height:14px;border-style:solid;border-color:rgba(255,255,255,.32);opacity:.5;transition:opacity .15s}
.cf-hold-l::after{border-width:0 0 2px 2px;transform:rotate(45deg)}
.cf-hold-r::after{border-width:2px 2px 0 0;transform:rotate(45deg)}
.cf-hold:active::after{opacity:.9}
.cf-track{position:absolute;left:50%;top:18px;width:0;height:0;transform-style:preserve-3d}
.cf-card{position:absolute;width:150px;height:150px;left:-75px;top:0;will-change:transform;transition:transform .35s cubic-bezier(.22,1,.36,1);transform-origin:center center}
.cf-card .cf-art{position:relative;width:100%;height:100%;border-radius:5px;overflow:hidden;background:#26222e;box-shadow:0 18px 30px rgba(0,0,0,.55)}
.cf-card .cf-art img{width:100%;height:100%;object-fit:cover;display:block}
.cf-card .cf-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;background:linear-gradient(135deg,#efeae3,#dcd6cc);color:#8a847c;font-size:10px;text-align:center;padding:0 8px}
.cf-card .cf-ph .v{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#888 18%,#444 19%,#666 26%,#333 34%,#555 42%)}
/* reflection */
.cf-card .cf-art::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.28),transparent 40%);pointer-events:none}
.cf-info{text-align:center;padding:12px 20px 2px;min-height:40px}
.cf-info h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;line-height:1.15;letter-spacing:-.01em}
.cf-info p{color:var(--accent2);font-size:12.5px;font-weight:600;margin-top:2px}
.cf-info .tap{color:var(--dim);font-size:10.5px;margin-top:6px;padding-bottom:6px}
/* 보기 전환 버튼 (자켓 ↔ LP판) — 헤더 우측 상단 아이콘 버튼 */
.cf-mode-toggle{position:absolute;top:74px;right:20px;z-index:21;width:36px;height:36px;margin:0;padding:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:rgba(255,255,255,.82);cursor:pointer;transition:background .15s,transform .15s}
.cf-mode-toggle:active{transform:scale(.9)}
.cf-mode-toggle.on{background:rgba(232,100,60,.55);border-color:rgba(232,100,60,.5);color:#fff}
.cf-mode-toggle #cf-mode-lab{display:none}
.cf-mode-ic{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#bbb 14%,#222 15%,#777 28%,#222 40%,#999 52%,#222 64%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
/* LP판 보기: 자켓 위에 레코드판을 덮어 원반만 보이게 */
.cf-card .cf-disc{position:absolute;inset:0;border-radius:50%;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s;
  background:
    conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.08) 0deg,rgba(255,255,255,0) 30deg,rgba(0,0,0,.22) 70deg,rgba(255,255,255,0) 110deg,rgba(255,255,255,.1) 150deg,rgba(255,255,255,0) 190deg,rgba(0,0,0,.22) 250deg,rgba(255,255,255,0) 290deg,rgba(255,255,255,.08) 330deg,rgba(255,255,255,.08) 360deg),
    repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.05) 0 1.4px,rgba(255,255,255,.015) 1.4px 2.8px),
    radial-gradient(circle at 42% 36%,rgba(255,255,255,.12) 0%,rgba(255,255,255,0) 42%,rgba(0,0,0,.28) 100%),
    var(--disc,#1a1a1a);
  background-blend-mode:screen,multiply,normal,normal;
  box-shadow:inset 0 0 20px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.5)}
.cf-card .cf-disc.has-photo{background:var(--photo) center/cover no-repeat;background-blend-mode:normal}
.cf-card .cf-disc::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30%;height:30%;border-radius:50%;background:var(--disc,#1a1a1a);filter:brightness(.6);box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 8px rgba(0,0,0,.5)}
.cf-card .cf-disc::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6%;height:6%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#e6e1d8,#c8c2b6);z-index:1}
.cf-card .cf-disc.has-photo::after,.cf-card .cf-disc.has-photo::before{display:none!important;content:none!important}
.cf-stage.vinyl-mode .cf-card .cf-disc{opacity:1;visibility:visible}
.cf-stage.vinyl-mode .cf-card .cf-art img,.cf-stage.vinyl-mode .cf-card .cf-ph{opacity:0;transition:opacity .3s}
.cf-stage.vinyl-mode .cf-card .cf-art{background:transparent;box-shadow:none!important;border-radius:50%}
.cf-stage.vinyl-mode .cf-card .cf-art::after{display:none}
.stars{display:inline-flex;gap:2px;margin:4px 0 2px;font-size:14px;line-height:1}
.stars .star{position:relative;color:#46414f;display:inline-block}
.stars .star .sfill{position:absolute;left:0;top:0;overflow:hidden;color:#f2b84a;white-space:nowrap}
.stars.edit .star{cursor:pointer;font-size:30px}
.stars.edit .star.big{padding:0 1px}
.stars.edit .hit{position:absolute;top:0;height:100%;width:50%;cursor:pointer;z-index:2}
.stars.edit .hit.half{left:0}
.stars.edit .hit.full{right:0}

/* Toolbar */
.toolbar{padding:4px 20px 14px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.search svg{flex:none}
.search input{background:none;border:none;outline:none;color:var(--txt);font-size:15px;width:100%;font-family:inherit}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#160d09}
.subchips{margin-top:-4px}
.chip.sm{padding:6px 13px;font-size:12px;background:transparent;border-color:var(--line);color:var(--dim)}
.chip.sm.on{background:rgba(232,100,60,.18);border-color:var(--accent);color:var(--accent2)}
.count{font-size:12px;color:var(--dim)}
.countrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px 12px}
.ctrls{display:flex;gap:7px;align-items:center}
.viewtoggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewtoggle .vt{background:none;border:none;color:var(--dim);padding:6px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.viewtoggle .vt.on{background:var(--accent);color:#160d09}
.discmode-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--dim);padding:6px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.discmode-btn.on{background:var(--accent);color:#160d09;border-color:var(--accent)}
.discmode-btn:active{transform:scale(.94)}
/* 그리드 'LP판 보기' 모드: 자켓을 숨기고 꾸민 디스크를 카드에 꽉 차게 표시 */
.grid:not(.list).disc-on .lp .art{opacity:0;pointer-events:none}
.grid:not(.list).disc-on .lp .disc{bottom:auto;top:50%;left:50%;width:100%;height:auto;aspect-ratio:1;transform:translate(-50%,-50%);z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 14px rgba(0,0,0,.45)}
.grid:not(.list).disc-on .lp .disc-edit{opacity:1;pointer-events:auto;transform:scale(1)}
.sortsel{background:var(--card);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:7px 10px;border-radius:10px;outline:none;cursor:pointer}
.sortsel:focus{border-color:var(--accent)}
.count b{color:var(--muted)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 20px}
/* list view */
.grid.list{grid-template-columns:1fr;gap:10px}
.grid.list .lp{display:flex;align-items:center;gap:13px;padding:10px;border-radius:14px}
.grid.list .artwrap{flex:0 0 auto;width:60px;aspect-ratio:1;border-radius:8px;overflow:hidden}
.grid.list .disc{display:none}
.grid.list .art{position:static;width:100%;height:100%;transform:none;border-radius:8px;box-shadow:none}
.grid.list .meta{flex:1;min-width:0;padding:0;margin-top:0;background:none}
.grid.list .meta .al{min-height:0;-webkit-line-clamp:1}
.grid.list .metabtm{margin-top:5px}
.grid.list .lp::before{display:none}   /* 리스트형에서는 흰 그라데이션 조명 제거 */
/* 리스트형 우측 재생 버튼 */
.grid.list .lp{position:relative}
.list-play{display:none}
.grid.list .list-play{display:flex;flex:0 0 auto;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--line);color:var(--accent2);cursor:pointer;transition:transform .12s,background .15s;margin-left:auto}
.grid.list .list-play:active{transform:scale(.88)}
.grid.list .list-play.playing{background:var(--accent);border-color:var(--accent);color:#1a0d06}
.grid.list .list-play svg{width:18px;height:18px}
.lp{position:relative;background:rgba(40,37,50,.45);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;animation:rise .5s both;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 8px 22px rgba(0,0,0,.28)}
.lp:active{transform:scale(.97);background:rgba(48,44,60,.55)}
/* single continuous glow spanning the disc area down through the title, so the whole card reads as one piece */
.lp::before{content:'';position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:150%;height:62%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.13) 0%, rgba(255,255,255,.08) 32%, rgba(255,255,255,.04) 50%, rgba(255,255,255,.02) 66%, rgba(255,255,255,0) 80%);
  z-index:0;pointer-events:none}
.lp .artwrap,.lp .meta{position:relative;z-index:1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* artwrap = sleeve; the vinyl disc peeks out below the jacket */
.artwrap{position:relative;aspect-ratio:1/1.3;overflow:hidden;background:transparent}
/* LP disc peeks out below the bottom edge of the square jacket */
.disc{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:118%;height:118%;aspect-ratio:1;border-radius:50%;
  background:
    conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.08) 0deg, rgba(255,255,255,0) 30deg,
      rgba(0,0,0,.2) 70deg, rgba(255,255,255,0) 110deg,
      rgba(255,255,255,.1) 150deg, rgba(255,255,255,0) 190deg,
      rgba(0,0,0,.2) 250deg, rgba(255,255,255,0) 290deg,
      rgba(255,255,255,.08) 330deg, rgba(255,255,255,.08) 360deg),
    repeating-radial-gradient(circle at 50% 50%,
      rgba(0,0,0,.05) 0 1.2px, rgba(255,255,255,.015) 1.2px 2.4px),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 32%, rgba(255,255,255,0) 50%, rgba(0,0,0,.22) 100%),
    var(--disc,#1a1a1a);
  background-blend-mode: screen, multiply, normal, normal;
  box-shadow:inset 0 0 14px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.15), 0 3px 7px rgba(0,0,0,.38);z-index:1;
  transition:transform .55s cubic-bezier(.25,.8,.3,1), width .55s cubic-bezier(.25,.8,.3,1), height .55s cubic-bezier(.25,.8,.3,1), top .55s cubic-bezier(.25,.8,.3,1), bottom .55s cubic-bezier(.25,.8,.3,1), box-shadow .4s}
/* pulled: the record slides up over the jacket so the whole disc shows; tap again to edit */
/* pulled: the record lifts onto the jacket and shows as a full, clean circle; tap again to edit */
.lp.pulled .disc{width:84%;height:auto;aspect-ratio:1;left:50%;bottom:auto;top:46%;
  transform:translate(-50%,-50%) rotate(var(--spin,0deg));z-index:5;
  box-shadow:0 8px 18px rgba(0,0,0,.38), inset 0 0 14px rgba(0,0,0,.45)}
.lp.pulled .disc.spinning{transition:box-shadow .4s}   /* no transform transition while dragging so it tracks the finger */
/* 30초 미리듣기 재생 중 자동 회전 — 멈춰있던 각도(--spin)에서 이어서 부드럽게 무한 회전 */
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes lp-discplay{from{--spin:0deg}to{--spin:360deg}}
.lp.pulled .disc.playing{transition:box-shadow .4s;
  transform:translate(-50%,-50%) rotate(var(--spin,0deg));
  animation:lp-discplay 2.4s linear infinite}
#preview-toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(18px);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
#preview-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lp.pulled .art{filter:brightness(.7)}
/* edit button appears only while the disc is raised */
/* small pencil button at bottom-right, appears only while the disc is raised */
.disc-edit{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(20,18,26,.85);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--txt);
  cursor:pointer;z-index:7;opacity:0;pointer-events:none;transform:scale(.7);transition:opacity .3s,transform .3s}
.lp.pulled .disc-edit{opacity:1;pointer-events:auto;transform:scale(1)}
.disc-edit:active{transform:scale(.85)}
.disc::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:25%;height:25%;border-radius:50%;
  background:var(--disc,#1a1a1a);filter:brightness(.65);
  box-shadow:0 0 0 1px rgba(0,0,0,.4), inset 0 0 6px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.1)}
/* spindle pin-hole */
.disc::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5.5%;height:5.5%;border-radius:50%;
  background:radial-gradient(circle at 40% 38%, #e6e1d8, #c8c2b6);box-shadow:0 0 0 1px rgba(0,0,0,.35), inset 0 0 2px rgba(0,0,0,.4);z-index:1}
/* album jacket: 1:1 square pinned to the top; disc peeks out below */
.art{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;background:#26222e;overflow:hidden;z-index:2;border-radius:3px;box-shadow:0 4px 10px rgba(0,0,0,.4);transition:filter .35s}
.lp.pulled .artwrap{overflow:visible}
.art img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s;background:#26222e;position:relative;z-index:1}
.art img.ld{opacity:1}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#9a948c;background:linear-gradient(135deg,#efeae3,#e3ddd4);z-index:0}
.art .ph .vinyl{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#888 18%,#444 19%,#666 26%,#333 34%,#555 42%);border:1px solid #777}
.art .ph .pn{font-size:10px;letter-spacing:.04em;text-align:center;padding:0 6px}
.cdot{position:absolute;top:8px;right:8px;width:15px;height:15px;border-radius:50%;z-index:4;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:4px 8px;border-radius:7px;backdrop-filter:blur(6px);letter-spacing:.02em;z-index:3}
.badge.sold{background:rgba(232,92,106,.9);color:#fff}
.badge.sealed{background:rgba(94,194,126,.92);color:#08130c}
.badge.gift{background:rgba(242,164,68,.92);color:#1c1304}
.meta{padding:10px 11px 12px;position:relative;z-index:3}
.meta .al{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.meta .ar{color:var(--muted);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .ar .yr{color:var(--dim)}
.meta .st{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.02em}
.st.own{background:rgba(106,160,232,.16);color:#9cc0f0;border:1px solid rgba(106,160,232,.3)}
.st.open{background:rgba(242,164,68,.16);color:#f2bf7a;border:1px solid rgba(242,164,68,.3)}
.st.seal{background:rgba(94,194,126,.16);color:#86d6a4;border:1px solid rgba(94,194,126,.32)}
.st.sold{background:rgba(232,92,106,.16);color:#f09aa4;border:1px solid rgba(232,92,106,.32)}
.st.gift{background:rgba(176,140,232,.16);color:#c3a4f0;border:1px solid rgba(176,140,232,.3)}
.st.wish{background:rgba(232,180,90,.16);color:#f0cf8a;border:1px solid rgba(232,180,90,.32)}
.metabtm{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.gtag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;background:rgba(106,160,232,.14);color:#9cc0f0;border:1px solid rgba(106,160,232,.26);--gc:106,160,232}
.gtag{background:rgba(var(--gc),.15);color:rgb(var(--gc));border-color:rgba(var(--gc),.32)}
.dt-titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.like-btn{flex:0 0 auto;background:none;border:none;color:var(--muted);line-height:0;cursor:pointer;padding:0;margin-top:2px;transition:transform .12s}
.like-btn:active{transform:scale(.8)}
.like-btn.on{color:#e85c6a}
.like-btn .heart-ic{width:24px;height:24px}
.lp .card-like{position:absolute;top:7px;right:7px;z-index:5;color:#e85c6a;line-height:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));pointer-events:none}
.lp .card-like .heart-ic{width:17px;height:17px}
/* 재생 중 곡 제목 — 인스타 사진 태그풍 작은 라벨(앨범아트 좌하단) */
.now-tag{position:absolute;left:8px;bottom:9px;max-width:calc(100% - 52px);z-index:6;
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;
  border-radius:999px;background:rgba(255,255,255,.93);color:#1b1620;
  border:1px solid rgba(255,255,255,.65);box-shadow:0 3px 12px rgba(0,0,0,.34);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  font-size:11px;font-weight:700;letter-spacing:.1px;line-height:1.3;
  opacity:0;transform:translateY(6px) scale(.96);transform-origin:left bottom;pointer-events:none;
  transition:opacity .26s ease, transform .26s cubic-bezier(.2,.9,.25,1.25)}
.now-tag.show{opacity:1;transform:translateY(0) scale(1)}
.now-tag .nt-dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px rgba(232,100,60,.22);animation:ntpulse 1.15s ease-in-out infinite}
.now-tag .nt-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes ntpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.62)}}
.grid.list .now-tag{display:none}   /* 리스트형의 작은 썸네일에는 태그 숨김 */
/* Pro lock card */
.pro-lock{text-align:center;padding:20px 16px;background:linear-gradient(160deg,rgba(242,164,68,.12),rgba(232,100,60,.08));border:1px solid rgba(242,164,68,.3);border-radius:16px}
.pro-badge{display:inline-block;background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06;font-weight:800;font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:6px;margin-bottom:10px}
.pro-badge.sm{margin:0 0 0 6px;vertical-align:middle;font-size:9px;padding:2px 6px}
.pro-title{font-weight:700;font-size:15px;margin-bottom:6px}
.pro-desc{color:var(--muted);font-size:12.5px;line-height:1.6;margin-bottom:14px}
.pro-demo{display:block;width:100%;margin-top:8px;background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit}
/* vinyl decorate */
.vd-preview{display:flex;justify-content:center;padding:14px 0 18px}
/* 색상 탭: 좌측 팔레트 + 우측 디스크 미리보기 */
.vd-preview-row{display:flex;align-items:center;gap:14px;padding:10px 0 16px}
.vd-quickpal{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:center;max-height:150px;overflow-y:auto;padding:2px}
.vd-quickpal .vd-sw{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:var(--sw);background-size:cover;cursor:pointer;padding:0;position:relative;transition:transform .12s,border-color .12s;box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.45)}
.vd-quickpal .vd-sw:active{transform:scale(.9)}
.vd-quickpal .vd-sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent);transform:scale(1.08)}
.vd-preview-row .vd-preview{flex:0 0 auto;padding:0}
.vd-preview .disc{position:relative;width:120px;height:120px;border-radius:50%;
  background:
    conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.08) 0deg,rgba(255,255,255,0) 30deg,rgba(0,0,0,.2) 70deg,rgba(255,255,255,0) 110deg,rgba(255,255,255,.1) 150deg,rgba(255,255,255,0) 190deg,rgba(0,0,0,.2) 250deg,rgba(255,255,255,0) 290deg,rgba(255,255,255,.08) 330deg,rgba(255,255,255,.08) 360deg),
    repeating-radial-gradient(circle at center,rgba(0,0,0,.04) 0 1px,rgba(255,255,255,.01) 1px 2px),
    radial-gradient(circle at 40% 35%,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 40%,rgba(0,0,0,.25) 100%),
    var(--disc,#1a1a1a);
  background-blend-mode:screen,multiply,normal,normal;
  box-shadow:inset 0 0 16px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.15),0 4px 12px rgba(0,0,0,.5)}
.vd-preview .disc::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:25%;height:25%;border-radius:50%;background:var(--disc,#1a1a1a);filter:brightness(.65);box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 6px rgba(0,0,0,.5)}
.vd-preview .disc::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6%;height:6%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#e6e1d8,#c8c2b6)}
.vd-range{width:100%;accent-color:var(--accent)}
/* disc with a custom photo: hide the synthetic gradient so the photo shows */
.disc.has-photo{background-blend-mode:normal;box-shadow:inset 0 0 16px rgba(0,0,0,.5),0 4px 9px rgba(0,0,0,.5)}
/* 사진으로 바꾼 LP는 가운데 라벨/핀홀을 완전히 숨김 */
.disc.has-photo::after,.disc.has-photo::before{display:none!important;content:none!important}
/* vinyl decorate tabs */
.vd-tabs{display:flex;gap:8px;margin:4px 0 12px}
.vd-tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.vd-tab.on{background:var(--accent);border-color:var(--accent);color:#160d09}
.vd-photodesc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
/* photo stage with circular vinyl guide */
.vd-stage{position:relative;width:230px;height:230px;margin:0 auto;border-radius:50%;overflow:hidden;background:#0c0b0f;touch-action:none;cursor:grab}
.vd-stage:active{cursor:grabbing}
.vd-imgwrap{position:absolute;inset:0}
.vd-imgwrap .vd-img{position:absolute;left:50%;top:50%;max-width:none;width:230px;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vd-guide{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5), inset 0 0 0 60px rgba(0,0,0,.08);
  background:
    repeating-radial-gradient(circle at center, rgba(255,255,255,.06) 0 1px, transparent 1px 7px);}
.vd-guide-label{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:rgba(255,255,255,.6);font-size:12px;pointer-events:none}
.vd-tilthint{text-align:center;color:var(--dim);font-size:11.5px;margin-top:6px}

/* Bottom nav / FAB */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:rgba(14,13,17,.85);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:11px 18px calc(11px + env(safe-area-inset-bottom));z-index:40}
.nav button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.15s}
.nav button.on{color:var(--accent2)}
.fab{position:fixed;bottom:78px;right:max(18px,calc(50% - 262px));width:58px;height:58px;border-radius:50%;border:none;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:45;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;background:none}
.fab svg{width:100%;height:100%;display:block}
.fab:active{transform:scale(.9) rotate(18deg)}
.fab.wish{box-shadow:0 8px 24px rgba(232,180,90,.5)}

/* Modal / sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line);z-index:55;transition:transform .3s cubic-bezier(.22,1,.36,1);padding-bottom:40px}
.sheet.show{transform:translateX(-50%) translateY(0)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:11px auto 4px;cursor:grab}
/* ===== My Page / Collections ===== */
.my-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 4px 18px}
.my-head .my-hello{flex:1;min-width:0}
.my-hello{flex:1;min-width:0}
.my-gear{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s,color .15s,background .15s}
.my-gear:active{transform:scale(.9);color:var(--accent2)}
.my-gear:hover{color:var(--accent2)}
#view-my{padding:0 20px}   /* 마이페이지 좌우 여백 */
.my-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.my-name{font-size:19px;font-weight:800;letter-spacing:-.01em}
.my-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.my-sec-head{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 12px}
.my-sec-head h3{font-size:14px;font-weight:800;margin:0}
.coll-new-btn{background:rgba(232,100,60,.16);border:1px solid rgba(232,100,60,.4);color:var(--accent2);font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:100px;cursor:pointer}
.coll-new-btn:active{transform:scale(.95)}
.coll-list{display:flex;flex-direction:column;gap:11px;padding:0 2px 20px}
.coll-card{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;transition:.15s}
.coll-card:active{transform:scale(.985);border-color:var(--accent)}
.coll-thumb{width:50px;height:50px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);position:relative;overflow:hidden}
.coll-thumb svg{width:24px;height:24px;opacity:.92}
.coll-meta{flex:1;min-width:0}
.coll-meta .nm{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coll-meta .ds{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coll-meta .ct{font-size:11px;color:var(--dim);margin-top:3px}
.coll-empty{text-align:center;color:var(--dim);font-size:13px;padding:38px 20px;line-height:1.6}
/* 좋아요한 앨범 그리드 */
.like-count{font-size:12px;color:var(--muted)}
.like-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:0 2px 24px}
.like-it{cursor:pointer}
.like-it .li-art{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center}
.like-it .li-art img{width:100%;height:100%;object-fit:cover}
.like-it .li-heart{position:absolute;top:6px;right:6px;color:#e85c6a;line-height:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.like-it .li-heart .heart-ic{width:15px;height:15px}
.like-it .ci-nm{font-size:10.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
/* 달력 하루 앨범 목록 */
.daylist{display:flex;flex-direction:column;gap:9px;padding-bottom:10px}
.dl-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:background .15s}
.dl-item:active{background:var(--card2)}
.dl-thumb{flex:0 0 auto;width:48px;height:48px;border-radius:8px;overflow:hidden;background:var(--card2)}
.dl-thumb img{width:100%;height:100%;object-fit:cover}
.dl-thumb .dl-ph{width:100%;height:100%}
.dl-info{flex:1;min-width:0}
.dl-al{font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-ar{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-kind{flex:0 0 auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--card2);color:var(--muted)}
.dl-kind.dl-open{background:rgba(54,163,90,.18);color:#6cc78a}
.dl-kind.dl-buy{background:rgba(106,160,232,.16);color:#6aa0e8}
.dl-kind.dl-arrive{background:rgba(232,164,68,.16);color:#e8a444}
.dl-kind.dl-sold{background:rgba(224,97,122,.16);color:#e0617a}
.dl-kind.dl-listen{background:rgba(138,111,214,.18);color:#b49bf0}
.dl-note{font-size:11.5px;color:#b49bf0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-emptyday{text-align:center;color:var(--dim);font-size:12.5px;padding:18px 10px 8px}
.dl-addlisten{display:block;width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1px solid rgba(138,111,214,.4);background:rgba(138,111,214,.14);color:#b49bf0;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.dl-addlisten:active{transform:scale(.98)}
.listen-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#b49bf0;box-shadow:0 0 5px rgba(180,155,240,.8);z-index:3}
/* 내 취향 요약 */
.taste{display:flex;flex-direction:column;gap:12px;padding:0 2px 26px}
.t-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.t-head{font-size:13px;font-weight:800;color:var(--accent2);margin-bottom:11px;letter-spacing:-.01em}
.t-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.t-row+.t-row{border-top:.5px solid rgba(255,255,255,.05)}
.t-rank{width:18px;height:18px;flex:0 0 auto;border-radius:50%;background:var(--card2);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.t-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.t-val{flex:0 0 auto;color:var(--muted);font-size:12.5px}
.t-val.pos{color:#5ec27e}.t-val.neg{color:#e0617a}
.t-empty{color:var(--dim);font-size:12.5px;padding:4px 0}
.t-note{color:var(--dim);font-size:11px;margin-top:8px}
/* 장르 막대 */
.t-bar-row{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px}
.t-bar-lab{flex:0 0 64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-bar-track{flex:1;height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.t-bar-fill{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.t-bar-num{flex:0 0 auto;color:var(--muted);font-size:11.5px;min-width:20px;text-align:right}
/* 컬러 분포 */
.t-colorbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:1px}
.t-colorbar span{display:block}
.t-colorlegend{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.t-cl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.t-cl i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* 연대기 */
.t-years{display:flex;align-items:flex-end;gap:8px;height:78px;padding-top:6px}
.t-year{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.t-ybar{width:60%;max-width:22px;min-height:4px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--accent2),var(--accent))}
.t-ynum{font-size:10px;color:var(--muted)}
.t-ylab{font-size:10px;color:var(--dim)}
/* 환경설정 */
.settings{display:flex;flex-direction:column;gap:12px;padding:4px 0 10px}
.set-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.set-row+.set-row{border-top:.5px solid rgba(255,255,255,.06)}
.set-row.col{flex-direction:column;align-items:stretch;gap:11px;cursor:default}
.set-l{flex:1;min-width:0}
.set-t{font-size:14px;font-weight:600;color:var(--txt)}
.set-d{font-size:11.5px;color:var(--muted);margin-top:2px}
.set-toggle{flex:0 0 auto;width:46px;height:27px;border-radius:100px;background:var(--card2);border:1px solid var(--line);position:relative;transition:background .18s}
.set-toggle.on{background:var(--accent);border-color:var(--accent)}
.set-knob{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.set-toggle.on .set-knob{transform:translateX(19px)}
.set-seg{display:flex;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:4px}
.set-seg button{flex:1;padding:9px;border:none;border-radius:8px;background:none;color:var(--muted);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.set-seg button.on{background:var(--accent);color:#160d09}
.set-accents{display:flex;gap:10px;flex-wrap:wrap}
.set-acc{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:.12s}
.set-acc.on{border-color:#fff;transform:scale(1.1);box-shadow:0 0 0 2px var(--accent)}
.set-row.tap .set-chev{color:var(--dim);font-size:16px;flex:0 0 auto}
.set-row.tap:active{background:rgba(255,255,255,.04)}
.coll-colors{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
.coll-colors .cc{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.12s}
.coll-colors .cc.on{border-color:#fff;transform:scale(1.12)}
.cd-head{display:flex;align-items:center;gap:13px;margin:4px 0 10px}
.cd-head .coll-thumb{width:58px;height:58px}
.cd-head .nm{font-size:18px;font-weight:800}
.cd-head .ds{font-size:12.5px;color:var(--muted);margin-top:3px}
.btn.ghost.danger{color:#e0617a;border-color:rgba(224,97,122,.35)}
.coll-items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;max-height:46vh;overflow-y:auto;padding:2px}
.coll-it{position:relative;cursor:pointer}
.coll-it .ci-art{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center}
.coll-it .ci-art img{width:100%;height:100%;object-fit:cover}
.coll-it .ci-ph{font-size:10px;color:var(--dim);text-align:center;padding:4px}
.coll-it .ci-nm{font-size:10.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.coll-it .ci-rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#e0617a;color:#fff;border:none;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.coll-items-empty{grid-column:1/-1;text-align:center;color:var(--dim);font-size:12.5px;padding:24px 10px}
.collpick-search{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--txt);font-family:inherit;font-size:14px;margin-bottom:12px;box-sizing:border-box}
/* 판매/교환 세그먼트 토글 */
.sx-seg{display:flex;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:6px}
.sx-segbtn{flex:1;padding:10px;border:none;border-radius:9px;background:none;color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.sx-segbtn.on{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06}
.sx-pick{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.collpick-list{max-height:54vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.collpick-row{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.collpick-row.in{border-color:var(--accent);background:rgba(232,100,60,.1)}
.collpick-row .pr-art{width:42px;height:42px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:var(--card2);display:flex;align-items:center;justify-content:center}
.collpick-row .pr-art img{width:100%;height:100%;object-fit:cover}
.collpick-row .pr-meta{flex:1;min-width:0}
.collpick-row .pr-meta .a{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collpick-row .pr-meta .b{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collpick-row .pr-chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.collpick-row.in .pr-chk{background:var(--accent);border-color:var(--accent)}
.sheet-x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;line-height:1;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.sheet-x:active{opacity:.7}

/* Detail */
.dt-art{margin:8px 20px 0;border-radius:20px;overflow:hidden;aspect-ratio:1;background:#1a1822;position:relative}
.dt-art img{width:100%;height:100%;object-fit:cover}
/* 상세 커버 우하단 연필(커버 수정) 버튼 */
.dt-edit-btn{position:absolute;right:10px;bottom:10px;z-index:3;width:38px;height:38px;border-radius:50%;
  background:rgba(14,13,17,.82);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--txt);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.dt-edit-btn:active{transform:scale(.88)}
.pk-decorate{margin-top:2px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:13px;font-weight:700;color:var(--accent2);cursor:pointer;font-family:inherit}
.pk-decorate:active{transform:scale(.97)}
.cover-btn:active{opacity:.8}
.picker{display:none;margin-top:10px}
.picker.show{display:block}
.dt-art .picker{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(12,11,15,.94);backdrop-filter:blur(4px);overflow-y:auto;padding:14px;z-index:4}
.pk-title,.pk-load{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px;text-align:center}
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#f-cands{display:none;grid-template-columns:repeat(4,1fr);gap:7px}
#f-cands.show{display:grid}
.pk-item{cursor:pointer;border-radius:9px;overflow:hidden;border:2px solid transparent;background:var(--card);transition:.12s}
.pk-item.sel{border-color:var(--accent)}
.pk-item:active{transform:scale(.95)}
.pk-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pk-cap{font-size:9px;color:var(--muted);padding:3px 4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-manual{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dt-art .pk-manual{margin-top:14px}
.pk-up{display:block;text-align:center;background:var(--card2);border:1px dashed var(--line);border-radius:11px;padding:12px;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer}
.pk-up:active{opacity:.8}
/* 주문내역 캡쳐 채우기 — 강조 */
.ord-up{background:linear-gradient(150deg,rgba(232,164,68,.16),rgba(232,100,60,.16));border-color:var(--accent2);color:var(--txt)}
.ord-status{font-size:12.5px;font-weight:600;border-radius:11px;padding:10px 12px;line-height:1.5}
.ord-status.load{background:var(--card2);color:var(--muted)}
.ord-status.ok{background:rgba(94,194,126,.14);color:var(--green)}
.ord-status.err{background:rgba(232,92,106,.14);color:var(--red)}
.ord-detail{display:block;margin-top:6px;font-size:10.5px;font-weight:500;color:var(--dim);word-break:break-all;line-height:1.45}
.ord-pick{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.ord-pick-item{text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--txt);cursor:pointer;font-family:inherit;font-weight:600}
.ord-pick-item:active{transform:scale(.99)}
.ord-pick-item b{color:var(--accent2)}
.ord-pick-item small{display:block;color:var(--muted);font-weight:500;margin-top:3px;font-size:11.5px}
/* 상태 등급 선택 */
#f-grade-fld .grade-help{color:var(--dim);font-size:11px;cursor:help}
.grade-seg{display:flex;gap:6px;margin-top:2px}
.grade-seg button{flex:1;padding:10px 0;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;transition:.12s}
.grade-seg button.on{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06;border-color:transparent}
.grade-desc{font-size:11.5px;color:var(--muted);margin-top:7px;min-height:15px}
/* 개봉일자 모름 버튼 */
.open-unknown{margin-left:8px;padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;vertical-align:middle}
.open-unknown.on{background:var(--accent);border-color:var(--accent);color:#160d09}
/* 등급 배지(카드/상세) */
.grade-badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:800;background:rgba(232,164,68,.16);color:#e8a444;border:1px solid rgba(232,164,68,.3);vertical-align:middle}
/* 바코드 스캔 */
.bc-btn{display:block;width:100%;margin-top:8px;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--accent2);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.bc-btn:active{transform:scale(.98)}
.bc-box{margin-top:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
#bc-video{width:100%;max-height:200px;object-fit:cover;border-radius:8px;background:#000;margin-bottom:10px}
.bc-manual{display:flex;gap:8px}
.bc-manual input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--txt);font-family:inherit;font-size:13px}
.bc-manual button{flex:0 0 auto;padding:0 16px;border-radius:10px;border:none;background:var(--accent);color:#160d09;font-family:inherit;font-weight:700;cursor:pointer}
.bc-status{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5;min-height:16px}
/* Discogs 토큰 입력 */
.set-token{display:flex;gap:8px}
.set-token input{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--txt);font-family:inherit;font-size:12.5px}
.set-token button{flex:0 0 auto;padding:0 16px;border-radius:10px;border:none;background:var(--accent);color:#160d09;font-family:inherit;font-weight:700;cursor:pointer}
.pk-url{display:flex;gap:7px}
.pk-url input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;min-width:0}
.pk-url input:focus{border-color:var(--accent)}
.pk-url button{flex:none;background:var(--accent);border:none;color:#160d09;font-family:inherit;font-weight:700;font-size:13px;padding:0 16px;border-radius:11px;cursor:pointer}
.dt-body{padding:18px 22px 0}
.dt-body h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.dt-body .dar{color:var(--accent2);font-size:14px;font-weight:600;margin-top:5px}
.dt-rate{margin-top:10px}
.dt-act{margin:16px 0 0}
.act-btn{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.act-btn.danger{color:#e0617a;border-color:rgba(224,97,122,.3)}
.act-btn.danger:active{background:rgba(224,97,122,.12)}
.act-btn:active{opacity:.85}
.act-btn.solid{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06;border:none;margin-top:6px}
.dt-inline{margin-top:12px}
.dt-inline:empty{margin:0}
.inl-title{font-weight:700;font-size:14px;margin-bottom:10px;color:var(--accent2)}
.dt-inline .fld{margin-bottom:11px}
.dt-inline .fld label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.dt-inline .fld input,.dt-inline .fld select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
.dt-inline .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.inl-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:11px;cursor:pointer}
.inl-check input{width:17px;height:17px;accent-color:var(--accent)}
/* color palette picker */
/* vinyl-color palette — wraps into 2-3 rows, fits on screen */
.palette{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;padding:12px;background:#14121a;border-radius:14px;border:1px solid var(--line)}
.palette .sw{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:var(--sw);background-size:cover;cursor:pointer;padding:0;position:relative;transition:transform .12s,border-color .12s,box-shadow .12s;box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.45)}
.palette .sw:active{transform:scale(.9)}
.palette .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent),0 4px 12px rgba(0,0,0,.5);transform:scale(1.08)}
.palette .sw.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-weight:800}
.palette .sw[data-label="투명"]{border:2px dashed rgba(255,255,255,.4)}
/* color field: current swatch + toggle button */
.colorfield{display:flex;align-items:center;gap:9px}
.colorfield input{flex:1}
.color-dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.4)}
.color-toggle{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--accent2);font-size:20px;font-weight:300;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.color-toggle:active{opacity:.8}
.palette.collapsed{display:none}
/* ===== 스마트 컬러 입력 ===== */
.color-sugg{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.color-sugg:empty{display:none}
.csg{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;transition:.12s}
.csg:active{transform:scale(.95)}
.csg.on{border-color:var(--accent);background:rgba(232,100,60,.14)}
.csg .csg-dot{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 1px rgba(255,255,255,.3)}
.csg.dash .csg-dot{border-style:dashed;border-color:rgba(255,255,255,.5)}
.color-sugg-lab{width:100%;font-size:10.5px;color:var(--muted);font-weight:600;margin:2px 0 -1px;letter-spacing:.02em}
/* 효과 토글 */
.fx-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.fx-chip{padding:5px 11px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
.fx-chip:active{transform:scale(.95)}
.fx-chip.on{border-style:solid;border-color:var(--accent2);background:rgba(232,164,68,.12);color:var(--txt)}
.color-final{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 12px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.color-final b{color:var(--txt);font-weight:700}
.color-final .cf-dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 2px rgba(255,255,255,.25),0 1px 3px rgba(0,0,0,.4)}
/* 정보 수정 시트 별점 */
.e-rate{display:flex;gap:6px}
.e-star{background:none;border:none;font-size:30px;line-height:1;color:#3a3640;cursor:pointer;padding:0 2px;transition:transform .1s,color .12s;font-family:inherit}
.e-star.on{color:var(--accent2)}
.e-star:active{transform:scale(.85)}
/* 월별 요약 (달력 아래) */
.cal-monthstat{padding:8px 14px 26px}
.ms-head{font-weight:700;color:var(--txt);font-size:14px;margin:6px 2px 12px}
.mstat-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.mstat-card{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 10px;text-align:center;position:relative;font-family:inherit;color:inherit;display:block;width:100%}
.mstat-dot{width:8px;height:8px;border-radius:50%;margin:0 auto 7px}
.mstat-lab{font-size:12px;color:var(--muted);font-weight:600}
.mstat-cnt{font-family:'Bricolage Grotesque';font-weight:800;font-size:26px;color:var(--txt);margin-top:3px;line-height:1}
.mstat-cnt span{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.mstat-sub{font-size:10.5px;color:var(--muted);margin-top:5px}
.mstat-empty{text-align:center;color:var(--dim);font-size:12.5px;padding:16px 0 4px}
/* 청음 기록 */
.lst-sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.lst-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.lst-head span{font-weight:700;color:var(--txt);font-size:14px}
.lst-add{background:rgba(138,111,214,.16);border:1px solid rgba(138,111,214,.4);color:#b49bf0;font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px;cursor:pointer}
.lst-add:active{transform:scale(.95)}
.lst-list{display:flex;flex-direction:column;gap:7px}
.lst-item{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.lst-date{font-size:12.5px;font-weight:700;color:#b49bf0;flex:0 0 auto;font-variant-numeric:tabular-nums}
.lst-note{font-size:12.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst-del{margin-left:auto;flex:0 0 auto;background:none;border:none;color:var(--dim);font-size:13px;cursor:pointer;padding:2px 4px}
.lst-del:active{color:var(--txt)}
.lst-empty{font-size:12.5px;color:var(--dim);padding:6px 2px}
.lf-album{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--txt);font-weight:600;margin-bottom:14px}
/* 월별 카드 탭 → 앨범 목록 펼침 */
.mstat-card.tappable{cursor:pointer}
.mstat-card[disabled]{opacity:.55}
.mstat-card.on{border-color:var(--accent);background:var(--card)}
.mstat-more{font-size:10px;color:var(--dim);margin-top:5px}
.ms-detail{display:none;margin-top:11px}
.ms-detail.show{display:block;animation:msfade .2s}
@keyframes msfade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ms-li{display:flex;align-items:baseline;gap:8px;padding:9px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.ms-li:active{background:var(--card)}
.ms-li-al{font-size:13px;font-weight:600;color:var(--txt);flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.ms-li-ar{font-size:11.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-li-amt{font-size:11.5px;color:var(--accent2);font-weight:700;flex:0 0 auto;font-variant-numeric:tabular-nums}
.ms-li-note{font-size:11px;color:#a98fe0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.lp-search{width:100%;box-sizing:border-box;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--txt);font-family:inherit;font-size:14px;margin-bottom:12px}
.lp-search:focus{outline:none;border-color:var(--accent)}
.lp-results{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.dt-rows{margin-top:18px;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dt-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:13px 15px;font-size:13.5px}
.dt-row .k{color:var(--muted)}
.dt-row .v{font-weight:600;text-align:right;max-width:62%}
.profit-pos{color:var(--green)}.profit-neg{color:var(--red)}

/* Form */
.form{padding:6px 22px 0}
.form h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;margin-bottom:4px}
.form .fhint{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.fld input,.fld select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.preview{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:14px}
.preview .pa{width:60px;height:60px;border-radius:10px;background:#26222e;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
.preview .pa img{width:100%;height:100%;object-fit:cover}
.preview .pt{font-size:12.5px;color:var(--muted)}
.btnrow{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:13px;border:none;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.primary{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06}
.btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line);flex:0 0 auto;padding:14px 18px}
.btn:active{opacity:.85}
.searching{font-size:11.5px;color:var(--accent2);margin-top:6px;display:none}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}

/* views */
.view{display:none}
.view.on{display:block}
.export-note{margin:0 20px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.6}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:center;gap:18px;padding:18px 20px 8px}
.cal-title{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;min-width:130px;text-align:center}
.cal-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px;line-height:1;cursor:pointer}
.cal-nav:active{opacity:.7}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:4px 20px 12px;font-size:11px;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend .lg{width:11px;height:11px;border-radius:3px;display:inline-block}
.lg-arrive{background:#c9b48a}
.lg-buy{background:#c9b48a;opacity:.5}
.lg-sold{background:#888;filter:grayscale(1)}
.lg-open{background:#1c1c1c;border:1px solid #555;border-radius:50%!important}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 14px 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 14px;align-content:start}
.cal-dow{text-align:center;font-size:10.5px;color:var(--dim);font-weight:600;padding:4px 0}
.cal-cell{position:relative;aspect-ratio:1;border-radius:7px;background:var(--card);overflow:hidden;border:1px solid transparent;cursor:default}
.cal-cell.has{cursor:pointer}
.cal-cell.has:active{border-color:var(--accent)}
.cal-cell:active{border-color:var(--accent)}
.cal-cell.empty{background:transparent}
.cal-cell .dnum{position:absolute;top:2px;left:4px;font-size:9.5px;color:var(--dim);z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.cal-cell.today{border-color:var(--accent)}
.cal-cell .ph-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cal-cell .ph-buy{opacity:.6}
.cal-cell .ph-sold{filter:grayscale(1)}
.cal-cell .ph-cd{position:absolute;inset:14%;border-radius:50%;background:
  conic-gradient(from 0deg,rgba(255,255,255,.1),rgba(0,0,0,.2),rgba(255,255,255,.12),rgba(0,0,0,.2),rgba(255,255,255,.1)),
  radial-gradient(circle at 40% 35%,rgba(255,255,255,.15),rgba(0,0,0,.3) 70%),var(--disc,#1a1a1a);
  background-blend-mode:screen,normal,normal;box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
.cal-cell .ph-cd::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.4)}
.cal-cell .multi{position:absolute;bottom:2px;right:3px;font-size:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 3px;z-index:3}
/* 달력 대표 지정 별버튼(하루목록 우상단 겹침) */
.dl-item{position:relative}
.dl-rep{position:absolute;top:7px;right:8px;z-index:4;width:28px;height:28px;border-radius:8px;border:none;background:rgba(0,0,0,.28);color:var(--dim);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.dl-rep:active{transform:scale(.9)}
.dl-rep.on{color:#f2c044}
/* 상태 라벨을 카드 맨 왼쪽으로 */
.dl-kind.dl-lead{order:-1;margin-right:2px}
.cal-empty{text-align:center;color:var(--dim);font-size:13px;padding:24px 20px}

/* ---------- Auth / Boot ---------- */
#boot,#auth-screen{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 80% -10%, rgba(232,100,60,.16), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(106,160,232,.12), transparent 55%)}
body.state-boot #boot{display:flex}
body.state-auth #auth-screen{display:flex}
body:not(.state-app) .wrap,
body:not(.state-app) .fab,
body:not(.state-app) .nav{display:none!important}
.boot-spin{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#auth-screen{padding:24px}
.auth-card{width:100%;max-width:360px;background:linear-gradient(165deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:24px;padding:30px 24px 26px;
  box-shadow:0 30px 70px rgba(0,0,0,.5)}
.auth-logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;
  line-height:.95;letter-spacing:-.02em;text-transform:uppercase;text-align:center}
.auth-logo .em{color:var(--accent)}
.auth-tagline{text-align:center;color:var(--muted);font-size:13px;margin-top:12px;font-weight:500}
.auth-tabs{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin:22px 0 18px}
.auth-tab{flex:1;padding:10px;border:none;border-radius:10px;background:none;color:var(--muted);
  font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.auth-tab.on{background:var(--accent);color:#160d09}
.auth-fields{display:flex;flex-direction:column;gap:10px}
.auth-fields input{width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:14px 15px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
.auth-fields input:focus{border-color:var(--accent)}
.auth-err{display:none;color:#f09aa4;font-size:12.5px;margin-top:12px;line-height:1.5;
  background:rgba(232,92,106,.1);border:1px solid rgba(232,92,106,.3);border-radius:11px;padding:10px 12px}
.auth-err.show{display:block}
.auth-btn{width:100%;padding:14px;border-radius:13px;border:none;font-family:inherit;
  font-weight:700;font-size:15px;cursor:pointer;margin-top:16px;display:flex;
  align-items:center;justify-content:center;gap:9px;transition:.15s}
.auth-btn.primary{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06}
.auth-btn.primary:active{opacity:.85}
.auth-btn.google{background:#fff;color:#1f1f1f;margin-top:10px}
.auth-btn.google:active{opacity:.9}
.auth-btn.google svg{width:18px;height:18px}
.auth-btn:disabled{opacity:.55;cursor:default}
.auth-or{display:flex;align-items:center;gap:12px;margin:18px 2px 0;color:var(--dim);font-size:11px}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:var(--line)}
.auth-foot{color:var(--dim);font-size:11.5px;margin-top:20px;text-align:center;max-width:340px;line-height:1.6}
/* account chip in header */
.acct{position:absolute;top:30px;right:20px;z-index:20}
.acct-btn{display:flex;align-items:center;gap:6px;max-width:150px;background:var(--card);
  border:1px solid var(--line);border-radius:100px;padding:7px 13px;color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.acct-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-btn:active{opacity:.8}
.acct-menu{display:none;position:absolute;top:42px;right:0;background:var(--card2);
  border:1px solid var(--line);border-radius:13px;padding:6px;min-width:130px;
  box-shadow:0 14px 30px rgba(0,0,0,.5)}
.acct-menu.show{display:block}
.acct-menu button{width:100%;background:none;border:none;color:var(--txt);font-family:inherit;
  font-size:13px;font-weight:600;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}
.acct-menu button:active{background:var(--card)}
/* 언어 선택은 설정 시트(#set-lang)로 이동 */

.share-card-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:20px 0 10px;padding:15px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#160d09;font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;transition:.12s;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.share-card-btn:active{transform:scale(.98)}
</style>

function tr(ko){ return (LANG==='en' && I18N[ko]!=null) ? I18N[ko] : ko; }

(function(){
  const ORIG = new WeakMap();        // text node -> original Korean nodeValue
  const ATTR_ORIG = new WeakMap();   // element -> {attr: originalValue}
  const ATTRS = ['placeholder','aria-label','title'];
  // fallback rules for interpolated count strings (number + Korean unit word)
  const UNIT = [
    [/^(\d[\d,]*)\s*장$/, '$1 items'],
    [/^(\d[\d,]*)\s*개의 컬렉션$/, '$1 collections'],
    [/^(\d[\d,]*)\s*개$/, '$1'],
  ];
  let observer=null, suppress=false;

  function translateString(s){
    const t=s.trim();
    if(!t) return null;
    if(I18N[t]!=null){
      // preserve surrounding whitespace
      const lead=s.match(/^\s*/)[0], trail=s.match(/\s*$/)[0];
      return lead+I18N[t]+trail;
    }
    for(const [re,rep] of UNIT){ if(re.test(t)) return s.replace(t, t.replace(re,rep)); }
    return null;
  }

  function handleTextNode(n){
    if(LANG==='en'){
      let orig = ORIG.has(n) ? ORIG.get(n) : n.nodeValue;
      const out = translateString(orig);
      if(out!=null && out!==n.nodeValue){
        if(!ORIG.has(n)) ORIG.set(n, n.nodeValue);
        suppress=true; n.nodeValue=out; suppress=false;
      }
    }else{
      if(ORIG.has(n)){ suppress=true; n.nodeValue=ORIG.get(n); suppress=false; ORIG.delete(n); }
    }
  }

  function handleAttrs(el){
    if(!el || el.nodeType!==1) return;
    let store = ATTR_ORIG.get(el);
    ATTRS.forEach(a=>{
      if(!el.hasAttribute(a)) return;
      if(LANG==='en'){
        const orig = (store && store[a]!=null) ? store[a] : el.getAttribute(a);
        const out = translateString(orig);
        if(out!=null && out!==el.getAttribute(a)){
          if(!store){ store={}; ATTR_ORIG.set(el,store); }
          if(store[a]==null) store[a]=el.getAttribute(a);
          suppress=true; el.setAttribute(a,out); suppress=false;
        }
      }else if(store && store[a]!=null){
        suppress=true; el.setAttribute(a, store[a]); suppress=false; store[a]=null;
      }
    });
    // translate value of <input type=button/submit> only
    if(el.tagName==='INPUT' && (el.type==='button'||el.type==='submit')){
      let s2=ATTR_ORIG.get(el);
      if(LANG==='en'){
        const orig=(s2&&s2._val!=null)?s2._val:el.value;
        const out=translateString(orig);
        if(out!=null && out!==el.value){ if(!s2){s2={};ATTR_ORIG.set(el,s2);} if(s2._val==null)s2._val=el.value; suppress=true; el.value=out; suppress=false; }
      }else if(s2&&s2._val!=null){ suppress=true; el.value=s2._val; suppress=false; s2._val=null; }
    }

  function walk(root){
    if(!root) return;
    if(root.nodeType===3){ handleTextNode(root); return; }
    if(root.nodeType!==1) return;
    if(root.tagName==='SCRIPT'||root.tagName==='STYLE') return;
    handleAttrs(root);
    const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT, {
      acceptNode(n){
        if(n.nodeType===1 && (n.tagName==='SCRIPT'||n.tagName==='STYLE')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while((n=tw.nextNode())){
      if(n.nodeType===3) handleTextNode(n);
      else handleAttrs(n);
    }
  }

  function translateAll(){ walk(document.body); }
  window.__i18nTranslate = translateAll;

  function startObserver(){
    if(observer) return;
    observer = new MutationObserver(muts=>{
      if(suppress) return;
      if(LANG!=='en'){
        // still need to restore on KO if mutations re-inject Korean; but restore is no-op for fresh nodes
      }
      for(const m of muts){
        if(m.type==='childList'){
          m.addedNodes.forEach(node=>{ if(LANG==='en') walk(node); });
        }else if(m.type==='characterData'){
          if(LANG==='en' && m.target && m.target.nodeType===3) handleTextNode(m.target);
        }else if(m.type==='attributes'){
          if(LANG==='en' && m.target) handleAttrs(m.target);
        }
      }
    });
    observer.observe(document.body,{childList:true,subtree:true,characterData:true,
      attributes:true,attributeFilter:ATTRS});
  }

  function setLang(l){
    LANG=l;
    try{ localStorage.setItem('lp_lang', l); }catch(e){}
    document.documentElement.lang = l;
    // update toggle highlight (언어 선택은 설정 시트 안으로 이동)
    document.querySelectorAll('#set-lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===l));
    translateAll();
    // re-render views whose render functions bake in language-specific text
    try{ if(typeof renderCal==='function' && document.querySelector('#view-cal') && document.querySelector('#view-cal').classList.contains('on')) renderCal(); }catch(e){}
    try{ if(typeof renderStats==='function') renderStats(); }catch(e){}
    try{ if(typeof renderGrid==='function') renderGrid(); }catch(e){}
    try{ if(typeof layoutCoverFlow==='function') layoutCoverFlow(); }catch(e){}
    try{ if(typeof renderTaste==='function' && document.querySelector('#view-my') && document.querySelector('#view-my').classList.contains('on')) renderTaste(); }catch(e){}
    try{ if(typeof renderCollections==='function' && document.querySelector('#view-my') && document.querySelector('#view-my').classList.contains('on')) renderCollections(); }catch(e){}
    translateAll();
  }
  window.__setLang = setLang;
  window.__LANG = ()=>LANG;

  function init(){
    document.documentElement.lang = LANG;
    // 언어 선택 UI는 설정 시트(#set-lang)로 이동, renderSettings에서 연결
    startObserver();
    if(LANG==='en') translateAll();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();

function isEN(){ return !!(window.__LANG && window.__LANG()==='en'); }

/* ---------- album art via iTunes Search API ---------- */
const pickedArt = {};            // key -> user-chosen artwork url (overrides everything)
const candCache = {};            // term -> candidate list
function cleanAlbum(a){return String(a).replace(/\(.*?\)|\[.*?\]|OST|ost/g,'').replace(/[\/].*$/,'').trim();}
function artKey(artist,album){return (artist+'|'+album).toLowerCase();}

// ---- per-source searchers (each returns [{img, artist, album, year}]) ----

// 1) iTunes (Apple) — no key, CORS-friendly
async function searchItunes(term, limit){
  const url='https://itunes.apple.com/search?media=music&entity=album&limit='+limit+'&term='+encodeURIComponent(term);
  try{const r=await fetch(url);const j=await r.json();
    return (j.results||[]).filter(x=>x.artworkUrl100).map(x=>({
      img:x.artworkUrl100.replace('100x100','600x600'),
      artist:x.artistName||'', album:x.collectionName||'',
      year:(x.releaseDate||'').slice(0,4), genre:normGenre(x.primaryGenreName), src:'iTunes'
    }));
  }catch(e){return [];}
}
// normalize iTunes genre into a short Korean label
function normGenre(g){
  if(!g) return '';
  const m={'K-Pop':'가요','Korean':'가요','J-Pop':'J-Pop','Pop':'팝','Rock':'록','Alternative':'얼터너티브',
    'R&B/Soul':'R&B/소울','Hip-Hop/Rap':'힙합','Hip Hop/Rap':'힙합','Dance':'댄스','Electronic':'일렉트로닉',
    'Jazz':'재즈','Classical':'클래식','Soundtrack':'OST','Singer/Songwriter':'싱어송라이터',
    'Folk':'포크','Country':'컨트리','World':'월드뮤직','Indie':'인디','Indie Pop':'인디팝','Metal':'메탈',
    'Blues':'블루스','Reggae':'레게','Funk':'펑크','Easy Listening':'이지리스닝','New Age':'뉴에이지'};
  return m[g]||g;
}

// 2) Deezer — no key; uses JSONP to avoid CORS
function searchDeezer(term, limit){
  return new Promise(res=>{
    const cb='dz_'+Math.random().toString(36).slice(2);
    const t=setTimeout(()=>{cleanup();res([]);},6000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=data=>{
      let out=[];
      try{ out=(data.data||[]).filter(x=>x.album&&x.album.cover_big).map(x=>({
        img:x.album.cover_big, artist:(x.artist&&x.artist.name)||'',
        album:x.album.title||'', year:'', src:'Deezer'
      }));}catch(e){}
      cleanup();res(out);
    };
    const s=document.createElement('script');
    s.onerror=()=>{cleanup();res([]);};
    s.src='https://api.deezer.com/search?limit='+limit+'&q='+encodeURIComponent(term)+'&output=jsonp&callback='+cb;
    document.body.appendChild(s);
  });
}

// 3) MusicBrainz + Cover Art Archive — no key, CORS-friendly (slower, rate-limited)
async function searchMusicBrainz(term, limit){
  try{
    const u='https://musicbrainz.org/ws/2/release-group/?fmt=json&limit='+limit+'&query='+encodeURIComponent(term);
    const r=await fetch(u,{headers:{'Accept':'application/json'}});
    const j=await r.json();
    const groups=(j['release-groups']||[]).slice(0,limit);
    const out=[];
    for(const g of groups){
      out.push({
        img:'https://coverartarchive.org/release-group/'+g.id+'/front-250',
        artist:(g['artist-credit']&&g['artist-credit'][0]&&g['artist-credit'][0].name)||'',
        album:g.title||'', year:(g['first-release-date']||'').slice(0,4), src:'MusicBrainz'
      });
    }
    return out;
  }catch(e){return [];}
}

// run one term across sources in order until enough results are found
async function searchTerm(term, limit){
  if(candCache[term]) return candCache[term];
  let out=await searchItunes(term, limit);
  if(out.length<2){ const dz=await searchDeezer(term, limit); out=out.concat(dz); }
  if(out.length===0){ const mb=await searchMusicBrainz(term, limit); out=out.concat(mb); }
  const seen={}; out=out.filter(c=>{if(seen[c.img])return false;seen[c.img]=1;return true;});
  candCache[term]=out;
  return out;
}

// gather candidates from several query forms, merged & de-duped
async function fetchCandidates(artist, album){
  const ar=(artist||'').replace(/[-]/g,'').trim();
  const al=cleanAlbum(album);
  const terms=[];
  if(ar&&al) terms.push((ar+' '+al).trim());
  if(al) terms.push(al);
  if(ar&&!al) terms.push(ar);
  let all=[];
  for(const t of terms){
    all=all.concat(await searchTerm(t,8));
    if(all.length>=4) break;   // enough good candidates, stop early
  }
  const seen={}; all=all.filter(c=>{if(seen[c.img])return false;seen[c.img]=1;return true;});
  return all;
}

// best single guess (used for first auto-load); respects a prior user pick
const genreCache={};  // artKey -> genre string
async function fetchArt(artist, album){
  const key=artKey(artist,album);
  if(pickedArt[key]!==undefined) return pickedArt[key];
  if(artCache[key]!==undefined) return artCache[key];
  const cands=await fetchCandidates(artist,album);
  const img=cands.length?cands[0].img:null;
  artCache[key]=img;
  const g=cands.find(c=>c.genre)||{}; if(g.genre) genreCache[key]=g.genre;
  return img;
}

function discColor(c){
  if(!c) return '#1a1a1a';
  for(const [k,v] of COLORHEX){ if(c.includes(k)) return v; }
  return '#1a1a1a';
