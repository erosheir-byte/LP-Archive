/* ===== 스마트 컬러 입력 ===== */
// 기본 색 라벨 (추천 칩용) — COLORHEX에서 단색 위주로 선별
const COLOR_BASE=[
  ['블랙','#1c1c1c'],['화이트','#ececec'],['그레이','#8a8a8a'],
  ['레드','#d63a3a'],['오렌지','#e8843a'],['옐로우','#e6c23a'],
  ['그린','#36a35a'],['에메랄드','#1faa7a'],['블루','#3a6fd6'],['아이스블루','#9cd0e8'],
  ['네이비','#23344d'],['퍼플','#8a4fd6'],['핑크','#e08ab0'],['자주','#8a2b4f'],
  ['브라운','#7a4a28'],['골드','#c9a227'],['실버','#c8c8cc'],['투명','#cfd2d8'],
];
// 효과/마감 (단일 선택: 투명/마블/스플래터)
const COLOR_FX=['투명','마블','스플래터'];
// 입력 문자열 → 미리보기 색 (단색만; 효과는 판에 반영하지 않음)
function colorPreviewCSS(str){
  if(!str) return '#1a1a1a';
  // 효과어는 제거하고 순수 색만 매칭
  const baseStr=str.trim().replace(/스플래터|스플레터|마블|투명|클리어/g,' ').trim();
  if(!baseStr) return '#cfd2d8';   // 효과만 있고 색이 없으면 옅은 회색
  // 긴 라벨 우선 매칭 (아이스블루가 블루보다 먼저 등)
  const colorTable=[...COLOR_BASE.map(([k,v])=>[k,v]), ...COLORHEX.filter(([k])=>!/스플|마블|투명|클리어/.test(k))]
    .sort((a,b)=>b[0].length-a[0].length);
  for(const [k,v] of colorTable){ if(baseStr.includes(k)) return v; }
  return discColor(baseStr);
}
// 입력값에 맞는 추천 색 칩 목록
function suggestColors(q){
  const s=(q||'').trim().toLowerCase();
  if(!s){
    // 입력 없으면 자주 쓰는 기본색 상위 노출
    return COLOR_BASE.slice(0,8);
  }
  // 라벨에 입력이 포함되거나, 입력이 라벨을 포함하면 추천
  const matches=COLOR_BASE.filter(([label])=>{
    const L=label.toLowerCase();
    return L.includes(s)||s.includes(L);
  });
  // 매칭 없으면 초성/부분으로 느슨하게 — 그냥 기본색 일부 노출
  return matches.length?matches:COLOR_BASE.slice(0,6);
}
// 스마트 컬러 입력 셋업 (추가폼 전용)
let _fEffect='';   // 선택된 효과(투명/마블/스플래터). 컬러명과 별개로 관리
function setupSmartColor(){
  const inp=document.getElementById('f-color');
  const dot=document.getElementById('f-colordot');
  const sugg=document.getElementById('f-color-sugg');
  const fxrow=document.getElementById('f-fxrow');
  if(!inp||!dot||!sugg) return;
  // 컬러 입력에 효과어가 섞여 들어왔으면(과거 데이터/자동완성) 분리
  (function initSplit(){
    let v=inp.value.trim(); _fEffect='';
    for(const fx of COLOR_FX){ if(new RegExp(fx).test(v)){ _fEffect=fx; v=v.replace(new RegExp('\\s*'+fx,'g'),'').trim(); } }
    inp.value=v;
  })();
  const refreshDot=()=>{ dot.style.background=colorPreviewCSS(inp.value); };   // 단색만
  const renderSugg=()=>{
    const list=suggestColors(inp.value);
    let html='';
    if(!inp.value.trim()) html+=`<span class="color-sugg-lab">자주 쓰는 색</span>`;
    html+=list.map(([label,hex])=>{
      const on = inp.value.trim()===label;
      const dash = label==='투명' ? ' dash':'';
      return `<button type="button" class="csg${on?' on':''}${dash}" data-label="${label}"><span class="csg-dot" style="background:${hex}"></span>${label}</button>`;
    }).join('');
    sugg.innerHTML=html;
    sugg.querySelectorAll('.csg').forEach(b=>b.onclick=()=>{
      inp.value=b.dataset.label;       // 컬러만 설정 (효과는 안 건드림)
      refreshDot(); renderSugg(); renderFinal();
    });
  };
  // 효과 칩 — 단일 선택, 컬러명과 독립
  const renderFx=()=>{
    if(!fxrow) return;
    fxrow.innerHTML=COLOR_FX.map(fx=>`<button type="button" class="fx-chip${_fEffect===fx?' on':''}" data-fx="${fx}">${fx}</button>`).join('');
    fxrow.querySelectorAll('.fx-chip').forEach(b=>b.onclick=()=>{
      const fx=b.dataset.fx;
      _fEffect = (_fEffect===fx) ? '' : fx;   // 재클릭 해제
      renderFx(); renderFinal();
    });
  };
  // 최종 표시 (컬러 / 효과를 분리해서)
  const renderFinal=()=>{
    const fin=document.getElementById('f-color-final'); if(!fin) return;
    const base=inp.value.trim();
    if(!base && !_fEffect){ fin.style.display='none'; return; }
    fin.style.display='';
    const colorPart = base ? `<b>${escapeHtml(base)}</b>` : `<span style="color:var(--muted)">색 미정</span>`;
    const fxPart = _fEffect ? ` · 효과 <b>${escapeHtml(_fEffect)}</b>` : '';
    fin.innerHTML=`<span class="cf-dot" style="background:${colorPreviewCSS(base)}"></span>${colorPart}${fxPart}`;
  };
  inp.oninput=()=>{ refreshDot(); renderSugg(); renderFinal(); };
  refreshDot(); renderSugg(); renderFx(); renderFinal();
}
// 저장용: 컬러 + 효과 합친 문자열 (예: "레드 스플래터")
function fColorCombined(){
  const inp=document.getElementById('f-color');
  const base=(inp?inp.value.trim():'');
  if(_fEffect && base) return base+' '+_fEffect;
  if(_fEffect && !base) return _fEffect;
  return base;
}

// render swatches into a container; onPick(label) fires when a swatch is tapped
function renderPalette(containerId, inputId, onPick){
  const box=document.getElementById(containerId); if(!box) return;
  const cur=(document.getElementById(inputId)||{}).value||'';
  box.innerHTML=PALETTE.map(([label,bg])=>{
    const on = cur && cur.replace(/\s+/g,'') === label.replace(/\s+/g,'') ? ' on':'';

const DEFAULT_SETTINGS={ hideMoney:false, defaultView:'grid', showGenre:true, showYear:true, accent:'#e8643c', discogsToken:'WrQmVDqssjeZdRRllyWaacrSnrsoPUpEyXUrXlFv', showGrade:true, crackleLevel:'low', theme:'dark' };

function loadSettings(){
  let raw={}; try{ raw=JSON.parse(localStorage.getItem('lp_settings')||'{}'); }catch(e){ raw={}; }
  SETTINGS=Object.assign({}, DEFAULT_SETTINGS, raw);
  // 구버전 마이그레이션: vinylCrackle(불리언) → crackleLevel

  document.documentElement.style.setProperty('--accent', pair[1]);

function statusGroup(s){
  if(s==='위시') return '위시';
  if(s==='도착 전'||s==='배송전') return '배송전';
  if(s==='판매'||s==='교환'||s==='선물') return '판매·교환';
  return '보유중';   // 개봉, 미개봉, 확인필요 등
}
const CHIPS=['전체','배송전','보유중','판매·교환','위시'];
const SUBCHIPS=['개봉','미개봉'];

function passes(it){
  const q=filter.q.toLowerCase();
  if(q && !(it.artist.toLowerCase().includes(q)||it.album.toLowerCase().includes(q)||(it.color||'').toLowerCase().includes(q)||(it.effect||'').toLowerCase().includes(q))) return false;
  if(filter.genre && (it.genre||'')!==filter.genre) return false;
  const g=statusGroup(it.status);
  const c=filter.chip;
  if(c==='전체') return g!=='위시';        // 전체에서 위시 제외
  if(c==='보유중'){
    if(g!=='보유중') return false;
    if(filter.sub==='개봉') return it.status==='개봉';
    if(filter.sub==='미개봉') return it.status==='미개봉';
    return true;
  }
  return g===c;
}

          <div class="ph"><div class="vinyl"></div><div class="pn">${it.artist||'?'}</div></div>
          <img data-art="${it.id}" alt="">
        </div>
        ${it.liked?'<span class="card-like">'+heartSVG(true)+'</span>':''}
        <button class="disc-edit" data-edit="${it.id}" aria-label="바이닐 꾸미기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      </div>
      <div class="meta">
        <div class="al">${it.album||'—'}</div>
        <div class="ar">${it.artist||'—'}${(it.year && (typeof SETTINGS==='undefined'||SETTINGS.showYear!==false))?` <span class="yr">· ${it.year}</span>`:''}</div>
        <div class="metabtm">${statusChip(it.status)}${genreTag(it.genre)}</div>
      </div>
      <button class="list-play" data-play="${it.id}" aria-label="미리듣기">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>`).join('');
  document.querySelectorAll('.lp[data-id]').forEach(el=>{
    const art=el.querySelector('.art');
    const disc=el.querySelector('.disc');
    const playBtn=el.querySelector('.list-play');
    if(playBtn){
      playBtn.onclick=(e)=>{
        e.stopPropagation();
        const it = DATA.find(d=>d.id===el.dataset.id);
        if(!it) return;
        if(_preview.id===it.id){ stopPreview(); return; }   // 이미 재생 중이면 정지
        playPreview(it, playBtn);   // 버튼에 재생 상태 표시
      };
    }
    el.onclick=()=>{
      if(el.classList.contains('pulled')){ el.classList.remove('pulled'); stopPreview(); return; }  // tap elsewhere: slide disc back
      openDetail(el.dataset.id);
    };
    if(art) art.onclick=(e)=>{
      e.stopPropagation();
      if(el.classList.contains('pulled')){ el.classList.remove('pulled'); stopPreview(); return; }   // cover tap closes the pulled disc
      openDetail(el.dataset.id);
    };
    if(disc){
      const it = DATA.find(d=>d.id===el.dataset.id);
      let spin=0, dragging=false, moved=false, lastAng=0, cx=0, cy=0, spinAtPlay=0, playing=false;
      const angle=(x,y)=>Math.atan2(y-cy, x-cx)*180/Math.PI;
      const down=(x,y)=>{
        if(!el.classList.contains('pulled')) return;   // only spin when raised
        const r=disc.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2;
        dragging=true; moved=false; lastAng=angle(x,y);
        disc.classList.add('spinning');
        // 이미 이 판이 재생 중이면 곡 전환 기준점을 현재 각도로 다시 잡음
        if(it && _preview.id===it.id){ playing=true; spinAtPlay=spin; }
        if(it) _fetchPreviewUrl(it);   // 회전 시작에 대비해 미리듣기 URL 미리 받아두기
      };
      const move=(x,y)=>{
        if(!dragging) return;
        let a=angle(x,y), d=a-lastAng;
        if(d>180) d-=360; if(d<-180) d+=360;   // wrap
        if(Math.abs(d)>1.5 && !moved){            // 드래그로 회전 시작 → 미리듣기 재생
          moved=true;
          if(it){ playPreview(it, disc); playing=true; spinAtPlay=spin; }
        }
        spin+=d; lastAng=a;
        disc.style.setProperty('--spin', spin+'deg');
        // 재생 중: 시작 각도 대비 한 바퀴(±360°) 돌 때마다 다음/이전 곡
        if(playing && _preview.id===(it&&it.id)){
          while(spin-spinAtPlay>=180){ spinAtPlay+=180; previewStep(+1, disc); }   // 시계방향 반바퀴 → 다음곡
          while(spin-spinAtPlay<=-180){ spinAtPlay-=180; previewStep(-1, disc); }  // 반시계방향 반바퀴 → 이전곡
        }
      };
      const up=()=>{ if(!dragging)return; dragging=false; disc.classList.remove('spinning');
        if(_preview.audio && _preview.discEl===disc){
          // 손으로 돌리던 각도를 0~360으로 정규화한 뒤 인라인 값을 비워 키프레임이 이어받게 함
          spin=((spin%360)+360)%360;
          disc.style.removeProperty('--spin');
          disc.style.animationDelay=(-(spin/360)*2.4)+'s';   // 멈춘 각도에서 시작
          disc.classList.add('playing');
        } };   // 손 떼면 음악에 맞춰 계속 회전
      disc.addEventListener('mousedown',e=>{ down(e.clientX,e.clientY);
        const mm=ev=>move(ev.clientX,ev.clientY), mu=()=>{up();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
        window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); });
      disc.addEventListener('touchstart',e=>down(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
      disc.addEventListener('touchmove',e=>{ if(dragging){e.preventDefault();} move(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
      disc.addEventListener('touchend',up);
      disc.onclick=(e)=>{
        e.stopPropagation();
        if(moved){ moved=false; return; }   // was a spin, not a tap
        const willPull = !el.classList.contains('pulled');
        el.classList.toggle('pulled');       // tap to raise / slide back
        if(!willPull){ stopPreview(); playing=false; }         // 판을 내리면 미리듣기 정지
      };
    }
    const editBtn=el.querySelector('.disc-edit');
    if(editBtn) editBtn.onclick=(e)=>{ e.stopPropagation(); openDetail(el.dataset.id,'vinyl'); };
  });
  // lazy-load covers as cards scroll into view (prevents request flooding that left lower cards blank)
  if(window._artObs) window._artObs.disconnect();
  const byId={}; list.forEach(it=>byId[it.id]=it);
  window._artObs=new IntersectionObserver((ents,obs)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ const id=e.target.dataset.id; if(byId[id])loadArt(byId[id]); obs.unobserve(e.target);} });
  },{rootMargin:'300px'});
  document.querySelectorAll('.lp[data-id]').forEach(el=>window._artObs.observe(el));
}

/* ---------- 30초 미리듣기 (iTunes previewUrl) ---------- */
/* ===== LP 지직거림(크래클) — Web Audio 절차적 생성 (외부 음원 불필요) ===== */
const VinylNoise = (function(){
  let ctx=null, master=null, hissSrc=null, hissGain=null, popTimer=null, running=false;
  // 강도별 파라미터 — gap(간격)이 클수록·chance가 낮을수록 빈도↓
  const LV = {
    low:    { gapMin:380, gapMax:2400, chance:0.5,  amp:0.20, hiss:0.016, master:0.24, cluster:0.07 },
    normal: { gapMin:170, gapMax:1300, chance:0.75, amp:0.46, hiss:0.034, master:0.32, cluster:0.13 }
  };
  function ensure(){
    if(ctx) return ctx;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
    try{ ctx=new AC(); }catch(e){ return null; }
    master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
    return ctx;
  }
  function noiseBuf(sec){
    const n=Math.max(1,Math.floor(ctx.sampleRate*sec)), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    return b;
  }
  // 단발 팝/클릭 — 길이·음높이·세기 모두 무작위
  function click(peak){
    if(!ctx) return;
    const dur=0.0018+Math.random()*0.02;
    const src=ctx.createBufferSource(); src.buffer=noiseBuf(dur);
    const g=ctx.createGain(); const t=ctx.currentTime;
    g.gain.setValueAtTime(Math.max(0.0008,peak),t);
    g.gain.exponentialRampToValueAtTime(0.0006,t+dur+0.018);
    const bp=ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=800+Math.random()*4200; bp.Q.value=0.4+Math.random()*1.4;
    src.connect(bp); bp.connect(g); g.connect(master); try{src.start();}catch(e){}
  }
  function start(level){
    if(running || !ensure()) return;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    running=true;
    const cfg=LV[level]||LV.low;
    // 표면 잡음(히스): 대역 필터 + 작은 게인
    hissSrc=ctx.createBufferSource(); hissSrc.buffer=noiseBuf(2.3); hissSrc.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=820;
    hissGain=ctx.createGain(); hissGain.gain.value=cfg.hiss;
    hissSrc.connect(hp); hp.connect(lp); lp.connect(hissGain); hissGain.connect(master);
    try{ hissSrc.start(); }catch(e){}
    // 무작위 팝 — 빈도 낮게, 변동 크게
    const tick=()=>{
      if(!running) return;
      if(Math.random()<cfg.chance){
        click(cfg.amp*(0.1+Math.random()*Math.random()));        // 대체로 약하고 드물게 도드라짐
        if(Math.random()<cfg.cluster){                           // 가끔 빠른 연타(군집)
          const extra=1+Math.floor(Math.random()*2);
          for(let k=1;k<=extra;k++) setTimeout(()=>{ if(running) click(cfg.amp*(0.08+Math.random()*Math.random())); }, k*(18+Math.random()*70));
        }
      }
      let gap=cfg.gapMin+Math.random()*(cfg.gapMax-cfg.gapMin);
      if(Math.random()<0.22) gap*=(1.7+Math.random()*3.5);       // 가끔 긴 정적
      popTimer=setTimeout(tick, gap);
    };
    setTimeout(tick, 200+Math.random()*700);
    const t=ctx.currentTime; master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(cfg.master,t+0.5);
  }
  function stop(){
    if(!running) return; running=false;
    if(popTimer){ clearTimeout(popTimer); popTimer=null; }
    if(ctx&&master){ const t=ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(0,t+0.3); }
    setTimeout(()=>{ try{ if(hissSrc){ hissSrc.stop(); hissSrc.disconnect(); } }catch(e){} hissSrc=null; },360);
  }
  return { start, stop };
})();
function crackleLevel(){ const v=(typeof SETTINGS!=='undefined')?SETTINGS.crackleLevel:'low'; return (v==='off')?null:(v||'low'); }

const _preview = { audio:null, id:null, discEl:null, cache:{}, last:{}, urls:[], idx:0 };
// 한국어 환경이면 KR 스토어(국내 발매반 + 해외 카탈로그 모두 포함)를 우선 조회
const _ituCountry = (typeof navigator!=='undefined' && (navigator.language||'').toLowerCase().startsWith('ko')) ? 'KR' : '';
// 검색어 정리: 괄호/대괄호 부가표기, 리마스터·디럭스 등 잡음 단어 제거
function _cleanTerm(s){
  return (s||'')
    .replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ')
    .replace(/\b(deluxe|remaster(ed)?|edition|expanded|anniversary|reissue|mono|stereo|disc\s*\d+|vol\.?\s*\d+|lp|ep)\b/ig,' ')
    .replace(/\s+/g,' ').trim();
}
// iTunes Search → [{url, collection}] (실패/0건이면 []). fetch라 CORS 막히면 throw→[]
async function _itunesSongs(term){
  if(!term) return [];
  let url='https://itunes.apple.com/search?media=music&entity=song&limit=25&term='+encodeURIComponent(term);
  if(_ituCountry) url+='&country='+_ituCountry;
  try{
    const r=await fetch(url);
    if(!r.ok) return [];
    const j=await r.json();
    _preview.reached=true;   // 응답을 받았다 = iTunes 접속 정상
    return (j.results||[]).filter(x=>x.previewUrl).map(x=>({url:x.previewUrl, title:x.trackName||'', artist:x.artistName||'', collection:x.collectionName||''}));
  }catch(e){ return []; }
}
// Deezer 검색 → [{url, collection}]. JSONP라 CORS 영향 없음(앨범아트와 동일 방식).
// track.preview = 30초 MP3 미리듣기 URL. iTunes가 CORS로 막혀도 이쪽으로 재생됨.
function _deezerSongs(term){
  return new Promise(res=>{
    if(!term){ res([]); return; }
    const cb='dzp_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const to=setTimeout(()=>{ cleanup(); res([]); }, 6000);
    function cleanup(){ clearTimeout(to); try{ delete window[cb]; }catch(e){} try{ s.remove(); }catch(e){} }
    window[cb]=data=>{
      _preview.reached=true;
      let out=[];
      try{ out=(data.data||[]).filter(x=>x.preview).map(x=>({url:x.preview, title:x.title||x.title_short||'', artist:(x.artist&&x.artist.name)||'', collection:(x.album&&x.album.title)||''})); }catch(e){}
      cleanup(); res(out);
    };
    s.onerror=()=>{ cleanup(); res([]); };
    s.src='https://api.deezer.com/search?limit=25&q='+encodeURIComponent(term)+'&output=jsonp&callback='+cb;
    document.body.appendChild(s);
  });
}
async function _fetchPreviewUrl(it){
  // cache[it.id] = previewUrl 배열 (수록곡들). 빈 결과는 캐시하지 않아 다음 시도에 재조회됨.
  if(_preview.cache[it.id]!==undefined) return _preview.cache[it.id];
  _preview.reached=false;
  const artist=(it.artist||'').trim(), album=(it.album||'').trim();
  const cArtist=_cleanTerm(artist), cAlbum=_cleanTerm(album);
  const al=album.toLowerCase().trim();
  // 정확한 조합부터 점점 느슨하게 — 첫 결과가 나오면 채택
  const terms=[ (artist+' '+album).trim(), (cArtist+' '+cAlbum).trim(),
                cAlbum, album, (cArtist||artist) ]
    .filter((v,i,a)=>v && a.indexOf(v)===i);
  const sources=[_itunesSongs, _deezerSongs];   // iTunes 우선, 막히면 Deezer(JSONP) 폴백
  let tracks=[];   // [{url, title, artist}] — url뿐 아니라 곡 제목도 함께 보관(재생 중 표시용)
  outer:
  for(const term of terms){
    for(const src of sources){
      const pool=await src(term);
      if(!pool.length) continue;
      // 같은 앨범 곡 우선(앨범명이 비슷한 것), 없으면 결과 전체에서
      let chosen=pool;
      if(al){
        const same=pool.filter(x=>(x.collection||'').toLowerCase().includes(al) || al.includes((x.collection||'').toLowerCase()));
        if(same.length) chosen=same;
      }
      tracks=chosen.filter(x=>x.url);
      if(tracks.length) break outer;
    }
  }
  if(tracks.length) _preview.cache[it.id]=tracks;   // 성공한 경우에만 캐시(일시 오류는 재시도 허용)
  return tracks;
}
function _pickPreviewUrl(it, urls){
  if(!urls || !urls.length) return null;
  if(urls.length===1) return urls[0];
  // 직전에 튼 곡은 피해서 랜덤 (판 돌릴 때마다 다른 곡)
  const last=_preview.last[it.id];
  let pool=urls;
  if(last){ const f=urls.filter(u=>u!==last); if(f.length) pool=f; }
  const url=pool[Math.floor(Math.random()*pool.length)];
  _preview.last[it.id]=url;
  return url;
}
function stopPreview(){
  try{ VinylNoise.stop(); }catch(e){}
  if(_preview.audio){ try{_preview.audio.pause();}catch(e){} _preview.audio=null; }
  // 재생 중 떠 있던 곡 제목 태그 모두 제거(부드럽게 사라지게 한 뒤 정리)
  document.querySelectorAll('.now-tag').forEach(t=>{ t.classList.remove('show'); setTimeout(()=>{ try{t.remove();}catch(e){} },260); });
  if(_preview.discEl){ _preview.discEl.classList.remove('playing'); _preview.discEl.style.animationDelay=''; _preview.discEl=null; }
  _preview.id=null; _preview.urls=[]; _preview.idx=0;
}
// 현재 _preview.urls[idx] 곡을 재생 (오디오 엘리먼트만 교체, 회전은 유지)
function _playPreviewIdx(disc){
  const urls=_preview.urls;
  if(!urls || !urls.length){ previewToast('🔇 미리듣기를 찾지 못했어요'); return; }
  _preview.idx=((_preview.idx%urls.length)+urls.length)%urls.length;
  const track=urls[_preview.idx];
  const url=(track&&track.url)||'';
  if(_preview.audio){ try{_preview.audio.pause();}catch(e){} }
  const a=new Audio(url); a.preload='auto';
  _preview.audio=a; _preview.discEl=disc;
  _showNowTag(track);   // 앨범아트 위에 현재 곡 제목 태그 표시
  a.onended=()=>stopPreview();
  a.onerror=()=>{ previewToast('재생할 수 없어요'); stopPreview(); };
  a.play().then(()=>{ const _cl=crackleLevel(); if(_cl) try{ VinylNoise.start(_cl); }catch(e){}
            if(_preview.discEl===disc && !disc.classList.contains('spinning')){
            const cur=parseFloat(getComputedStyle(disc).getPropertyValue('--spin'))||0;
            const norm=((cur%360)+360)%360;
            disc.style.removeProperty('--spin');
            disc.style.animationDelay=(-(norm/360)*2.4)+'s';
            disc.classList.add('playing');
          } })
          .catch(()=>{});
  if(urls.length>1) previewToast('♪ '+(_preview.idx+1)+' / '+urls.length);
}
// 재생 중 한 바퀴 돌렸을 때 다음/이전 곡으로 전환
function previewStep(dir, disc){   // dir: +1 다음곡, -1 이전곡
  if(!_preview.urls || _preview.urls.length<2) return;
  _preview.idx += (dir>0?1:-1);
  _playPreviewIdx(disc);
}
async function playPreview(it, disc){
  if(!it) return;
  if(_preview.id===it.id) return;        // 이미 이 판이 재생 중이면 그대로 둠
  stopPreview();
  _preview.id = it.id;
  let urls = _preview.cache[it.id];
  if(urls===undefined) urls = await _fetchPreviewUrl(it);
  if(_preview.id!==it.id) return;        // 기다리는 사이 다른 판을 돌렸으면 취소
  if(!urls || !urls.length){
    // iTunes 응답은 받았는데 곡이 없으면 '없음', 응답 자체를 못 받았으면 '연결 문제'
    previewToast(_preview.reached ? '🔇 미리듣기를 찾지 못했어요' : '📶 미리듣기 연결에 실패했어요 (네트워크 확인)');
    _preview.id=null; return;
  }
  _preview.urls = urls;
  _preview.idx = Math.floor(Math.random()*urls.length);   // 첫 곡은 랜덤 시작
  _preview.last[it.id]=(urls[_preview.idx]||{}).url;
  _playPreviewIdx(disc);
}
// 재생 중인 곡 제목을 해당 카드 앨범아트 위에 인스타 태그처럼 표시
function _showNowTag(track){
  try{
    if(!_preview.discEl || !_preview.discEl.closest) return;
    const card=_preview.discEl.closest('.lp'); if(!card) return;
    const wrap=card.querySelector('.artwrap'); if(!wrap) return;
    let tag=wrap.querySelector('.now-tag');
    if(!tag){ tag=document.createElement('div'); tag.className='now-tag';
      tag.innerHTML='<span class="nt-dot"></span><span class="nt-txt"></span>';
      wrap.appendChild(tag);
    }
    const title=(track&&track.title)? track.title : '미리듣기';
    tag.querySelector('.nt-txt').textContent=title;   // textContent → 제목에 든 특수문자 안전
    // 곡이 바뀔 때마다 팝 애니메이션 다시 트리거
    tag.classList.remove('show'); void tag.offsetWidth; tag.classList.add('show');
  }catch(e){}
}
function previewToast(msg){
  let t=document.getElementById('preview-toast');
  if(!t){ t=document.createElement('div'); t.id='preview-toast'; document.body.appendChild(t); }
  t.textContent=(typeof tr==='function'?tr(msg):msg); t.classList.add('show');
  clearTimeout(previewToast._t); previewToast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

async function loadArt(it){
  const img=document.querySelector(`img[data-art="${it.id}"]`);
  if(!img||img.dataset.done) return;
  img.dataset.done='1';
  const key=artKey(it.artist,it.album);
  const url = it._art || pickedArt[key] || await fetchArt(it.artist,it.album);
  // auto-fill genre if we learned it during the search
  if(!it.genre && genreCache[key]){ it.genre=genreCache[key]; saveGenre(it); refreshGenreChips(); }
  if(!url){ img.dataset.done=''; return; }   // no art found; keep placeholder, allow later retry
  it._art=url;
  const ph=img.parentElement.querySelector('.ph');
  const reveal=()=>{ img.classList.add('ld'); if(ph) ph.style.display='none'; img.dataset.shown='1'; };
  img.onload=reveal;
  // if it fails, just keep showing the placeholder — never wipe an image that already displayed
  img.onerror=()=>{ if(!img.dataset.shown){ img.dataset.done=''; } };
  img.src=url;
  if(img.complete && img.naturalWidth>0) reveal();     // already cached
}

let detailId=null;

  R('구매일', it.buy);
  R('도착일', it.arrive);
  if(it.status==='판매'){

  };

  if(mode==='cover') setTimeout(()=>openCoverPicker(it), 50);

function showEditForm(it){
  const wish=it.status==='위시';
  const opt=(v,cur)=>`<option value="${v}" ${v===cur?'selected':''}>${v}</option>`;
  const statuses=['미개봉','개봉','배송전','판매','교환','선물','위시'];
  const pays=['카드','현금','복지포인트','선물'];
  // 기본값 채우기
  $('#e-artist').value=it.artist||'';
  $('#e-album').value=it.album||'';
  $('#e-genre').value=it.genre||'';
  $('#e-year').value=(it.year!=null?it.year:'');
  $('#e-color').value=(it.color||'')+(it.effect?(' '+it.effect):'');
  $('#e-status').innerHTML=statuses.map(s=>opt(s,it.status)).join('');
  $('#e-pay').innerHTML=`<option value=""></option>`+pays.map(s=>opt(s,it.pay)).join('');
  $('#e-store').value=it.store||'';
  $('#e-price').value=(it.price!=null?it.price:'');
  $('#e-orig').value=(it.orig!=null && it.orig!==it.price ? it.orig : '');
  $('#e-buy').value=it.buy||'';
  $('#e-arrive').value=it.arrive||'';
  $('#e-sell').value=(it.sellPrice!=null?it.sellPrice:'');
  $('#e-note').value=it.note||'';
  // 별점
  let editRating=it.rating||0;
  function paintRate(){
    const box=$('#e-rate'); if(!box) return;
    let h='';
    for(let r=1;r<=5;r++){ h+=`<button type="button" class="e-star${r<=editRating?' on':''}" data-r="${r}">★</button>`; }
    box.innerHTML=h;
    box.querySelectorAll('.e-star').forEach(b=>b.onclick=()=>{ const r=+b.dataset.r; editRating=(editRating===r)?0:r; paintRate(); });
  }
  paintRate();
  // 팔레트
  setupColorField('e');
  renderPalette('e-palette','e-color',()=>{});
  $('#e-palette').classList.remove('collapsed');
  show('edit');
  $('#e-save').onclick=()=>{
    const oldKey=artKey(it.artist,it.album);
    it.artist=$('#e-artist').value.trim();
    it.album=$('#e-album').value.trim();
    it.genre=$('#e-genre').value.trim();
    it.year=Number($('#e-year').value)||null;
    { let cv=$('#e-color').value.trim(); let ef='';
      for(const fx of ['투명','마블','스플래터']){ if(new RegExp(fx).test(cv)){ ef=fx; cv=cv.replace(new RegExp('\\s*'+fx,'g'),'').trim(); } }
      it.color=cv; it.effect=ef; }
    it.status=$('#e-status').value;
    it.store=$('#e-store').value.trim();
    it.price=Number($('#e-price').value)||null;
    it.orig=(Number($('#e-orig').value)||it.price)||null;
    it.buy=$('#e-buy').value||null;
    it.pay=$('#e-pay').value;
    it.arrive=$('#e-arrive').value||null;
    it.sellPrice=Number($('#e-sell').value)||null;
    if(it.sellPrice!=null && it.price!=null) it.profit=it.sellPrice-it.price;
    it.note=$('#e-note').value.trim();
    it.rating=editRating;
    const newKey=artKey(it.artist,it.album);
    if(oldKey!==newKey && pickedArt[oldKey]){ pickedArt[newKey]=pickedArt[oldKey]; artCache[newKey]=pickedArt[oldKey]; }
    persistFull(it);
    hide('edit'); hide('detail');
    renderChips();renderGrid();renderStats();buildCoverFlow();refreshGenreChips();
  };
}

  let vimg=null, vx=0, vy=0, vscale=1, vrot=0, vopacity=1;
  function tfm(){ return `translate(-50%,-50%) translate(${vx}px,${vy}px) rotate(${vrot}deg) scale(${vscale})`; }
  function renderImg(){

    imgwrap._im=im;
  }
  function place(){
    const im=imgwrap._im; if(!im)return;
    im.style.transform=tfm(); im.style.opacity=vopacity;
  }
  function enableControls(on){ [zoom,popac].forEach(s=>{ if(s) s.disabled=!on; }); }
  // 라벨 클릭이 막히는 환경 대비: 라벨을 직접 누르면 파일 입력 강제 오픈

    popac.value=100; $('#vd-popacity-lab').textContent='100%';

    renderImg();
  }
  $('#vd-file').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    try{ loadVimg(await fileToDataURL(f, 1000)); }
    catch(err){ alert('이미지를 불러오지 못했어요'); }
  };
  // 미리보기(샌드박스)에서 파일 선택이 막힐 때 쓰는 샘플 주입 훅
  window.__vdLoadSample=(dataURL)=>{ try{ loadVimg(dataURL); }catch(e){} };
  zoom.oninput=()=>{ vscale=zoom.value/100; $('#vd-zoomlab').textContent=zoom.value+'%'; place(); };
  popac.oninput=()=>{ vopacity=popac.value/100; $('#vd-popacity-lab').textContent=popac.value+'%'; place(); };
  // drag (1 finger) + pinch (2 fingers: scale + tilt)
  let drag=false,sx=0,sy=0,ox=0,oy=0;
  let pinch=false,pinchD0=0,pinchScale0=1,pinchAng0=0,pinchRot0=0;
  const dStart=(x,y)=>{ if(!vimg)return; drag=true;sx=x;sy=y;ox=vx;oy=vy; };
  const dMove=(x,y)=>{ if(!drag)return; vx=ox+(x-sx); vy=oy+(y-sy); place(); };
  const dEnd=()=>{ drag=false; };
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const ang=(t)=>Math.atan2(t[1].clientY-t[0].clientY, t[1].clientX-t[0].clientX)*180/Math.PI;
  stage.addEventListener('touchstart',e=>{
    if(!vimg) return;
    if(e.touches.length>=2){ pinch=true; drag=false; pinchD0=dist(e.touches); pinchScale0=vscale; pinchAng0=ang(e.touches); pinchRot0=vrot; }
    else dStart(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(!vimg) return;
    if(pinch && e.touches.length>=2){
      e.preventDefault();
      const ratio=dist(e.touches)/(pinchD0||1);
      vscale=Math.min(2.5, Math.max(0.5, pinchScale0*ratio));
      zoom.value=Math.round(vscale*100); $('#vd-zoomlab').textContent=Math.round(vscale*100)+'%';
      let dr=ang(e.touches)-pinchAng0;
      vrot=Math.max(-180, Math.min(180, pinchRot0+dr));
      place();
    } else if(drag){ e.preventDefault(); dMove(e.touches[0].clientX,e.touches[0].clientY); }
  },{passive:false});
  stage.addEventListener('touchend',e=>{ if(e.touches.length<2){ pinch=false; } if(e.touches.length===0){ dEnd(); } });
  stage.addEventListener('mousedown',e=>{ dStart(e.clientX,e.clientY);
    const mm=ev=>dMove(ev.clientX,ev.clientY), mu=()=>{dEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu); });
  // wheel zoom on desktop
  stage.addEventListener('wheel',e=>{ if(!vimg)return; e.preventDefault();
    vscale=Math.min(2.5,Math.max(0.5, vscale*(e.deltaY<0?1.06:0.94)));
    zoom.value=Math.round(vscale*100); $('#vd-zoomlab').textContent=Math.round(vscale*100)+'%'; place();
  },{passive:false});
  // if already has a photo, preload it
  if(it.discPhoto){ vimg=it.discPhoto; enableControls(true); $('#vd-photo-save').disabled=false; $('#vd-guide-label').style.display='none'; renderImg(); }

  $('#vd-photo-save').onclick=async ()=>{
    if(!vimg){ alert('사진을 먼저 올려주세요'); return; }
    // render the visible circle region to a square canvas, masked to a circle
    const cropped=await cropToVinyl(imgwrap._im, stage, {vx,vy,vscale,vrot,opacity:vopacity});
    let url=cropped; try{ url=await window.LPCloud.uploadImage(dataURLToBlob(cropped),'jpg'); }catch(up){}
    it.discPhoto=url;
    it.discColorCustom=null; it.discOpacity=null;   // photo overrides color
    persistFull(it);
    hide('detail');
    renderGrid();buildCoverFlow();
  };
  $('#vd-photo-reset').onclick=()=>{
    it.discPhoto=null; persistFull(it);
    hide('detail'); renderGrid();buildCoverFlow();
  };
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
// normalize a CSS color (hex or rgb) to #rrggbb for <input type=color>
function toHex(c){
  if(!c) return '#1a1a1a';
  if(c[0]==='#'){ return c.length===4 ? '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(0,7); }
  const m=c.match(/\d+/g); if(!m) return '#1a1a1a';
  return '#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');
}
// crop the visible square stage region to a circular vinyl image (회전·투명도 반영)
function cropToVinyl(imgEl, stageEl, t){
  return new Promise((res)=>{
    const rect=stageEl.getBoundingClientRect();
    const St=rect.width||230;             // 스테이지 CSS 크기
    const S=300;                          // output size
    const scale=S/St;                     // stage px -> canvas px
    const c=document.createElement('canvas'); c.width=S; c.height=S;
    const ctx=c.getContext('2d');
    // circular clip
    ctx.save();
    ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.clip();
    // 검은 배경(투명 영역이 비치지 않도록)
    ctx.fillStyle='#111'; ctx.fillRect(0,0,S,S);
    // 편집기 변환의 '실제 효과'를 그대로 재현:
    //  - 이미지는 stage 중심에서 (vx,vy)만큼 이동한 지점이 '이미지 중심'
    //  - 그 중심을 기준으로 vrot 회전 · vscale 배율 (transform-origin: center)
    const o = t || {};
    const Wd = imgEl.offsetWidth  || imgEl.naturalWidth;   // 화면 표시 크기(CSS px, 보통 230)
    const Hd = imgEl.offsetHeight || imgEl.naturalHeight;
    const dw = Wd*scale, dh = Hd*scale;                    // 캔버스에서의 기본(배율1) 표시 크기
    ctx.translate(S/2 + (o.vx||0)*scale, S/2 + (o.vy||0)*scale);
    ctx.rotate((o.vrot||0)*Math.PI/180);
    ctx.scale(o.vscale||1, o.vscale||1);
    ctx.globalAlpha = (o.opacity!=null ? o.opacity : 1);
    ctx.drawImage(imgEl, -dw/2, -dh/2, dw, dh);            // 중심 기준으로 그림
    ctx.globalAlpha=1;
    ctx.restore();
    // subtle vinyl sheen
    const g=ctx.createRadialGradient(S*0.4,S*0.35,0,S/2,S/2,S/2);
    g.addColorStop(0,'rgba(255,255,255,.12)'); g.addColorStop(.4,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,.25)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.fill();
    res(c.toDataURL('image/jpeg',0.85));
  });
}

// downscale an uploaded image to keep localStorage small, return dataURL
function fileToDataURL(file, max=600){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let{width:w,height:h}=im;
        const sc=Math.min(1,max/Math.max(w,h));
        const c=document.createElement('canvas');
        c.width=Math.round(w*sc);c.height=Math.round(h*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.85));
      };
      im.onerror=rej; im.src=r.result;
    };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

// swipe-down to dismiss (drag from the grab handle / top area)
function enableSwipeClose(name){
  const sheet=$('#sheet-'+name);
  const handle=$('#grab-'+name);
  let y0=null,dy=0,drag=false;
  const startY=y=>{ if(sheet.scrollTop>2)return; drag=true;y0=y;dy=0;sheet.style.transition='none'; };
  const moveY=y=>{ if(!drag)return; dy=y-y0; if(dy<0)dy=0;
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`; };
  const endY=()=>{ if(!drag)return; drag=false; sheet.style.transition='';
    if(dy>110){ sheet.style.transform=`translateX(-50%) translateY(100%)`; setTimeout(()=>hide(name),200); }
    else sheet.style.transform=''; };
  // dragging anywhere on the handle, or on the sheet when scrolled to top
  [handle,sheet].forEach(el=>{
    el.addEventListener('touchstart',e=>startY(e.touches[0].clientY),{passive:true});
    el.addEventListener('touchmove',e=>{ if(drag&&dy>0)e.preventDefault(); moveY(e.touches[0].clientY); },{passive:false});
    el.addEventListener('touchend',endY);
  });
  // mouse (desktop) on handle only
  handle.addEventListener('mousedown',e=>{startY(e.clientY);
    const mm=ev=>moveY(ev.clientY), mu=()=>{endY();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);});
}

        }catch(e){}

      };

    }catch(e){ /* ZXing 폴백으로 진행 */ }
  }
  // 3) ZXing 폴백 (BarcodeDetector 미지원 시)
  try{
    bcStatus(bcT('Loading scanner…','스캐너 불러오는 중…'));
    const ZX=await loadZXing();
    const Reader = ZX.BrowserMultiFormatReader || (ZX.default && ZX.default.BrowserMultiFormatReader);
    _bcReader=new Reader();
    bcStatus(bcT('Point the barcode at the camera…','바코드를 카메라에 비춰주세요…'));
    _bcControls=await _bcReader.decodeFromStream(_bcStream, vid, (result)=>{
      if(result){ onBarcodeFound(result.getText ? result.getText() : result.text); }
    });
  }catch(e){
    bcStatus(bcT('Scanner unavailable. Enter the number below.','스캔을 사용할 수 없어요. 아래에 번호를 직접 입력하세요.'));
  }
}
function stopBarcodeScan(){
  if(_bcRAF){ cancelAnimationFrame(_bcRAF); _bcRAF=null; }
  if(_bcControls){ try{ _bcControls.stop(); }catch(e){} _bcControls=null; }
  if(_bcReader){ try{ _bcReader.reset && _bcReader.reset(); }catch(e){} _bcReader=null; }
  if(_bcStream){ _bcStream.getTracks().forEach(t=>t.stop()); _bcStream=null; }
  const vid=$('#bc-video'); if(vid){ vid.style.display='none'; try{vid.srcObject=null;}catch(e){} }
}
async function lookupBarcode(code){
  code=String(code||'').replace(/\D/g,'');
  if(!code){ bcStatus('바코드 번호를 인식하지 못했어요.'); return; }
  const token=(SETTINGS && SETTINGS.discogsToken||'').trim();
  if(!token){ bcStatus('Discogs 토큰이 없어요. 마이페이지 환경설정에서 입력하세요.'); return; }
  bcStatus(isEN() ? ('Looking up barcode '+code+'…') : ('바코드 '+code+' 조회 중…'));
  try{
    const url='https://api.discogs.com/database/search?type=release&barcode='+encodeURIComponent(code)+'&per_page=5&token='+encodeURIComponent(token);
    const res=await fetch(url,{headers:{'User-Agent':'LPArchive/1.0'}});
    if(!res.ok){ bcStatus(isEN() ? ('Lookup failed (HTTP '+res.status+'). Check your token or network.') : ('조회 실패 (HTTP '+res.status+'). 토큰이나 네트워크를 확인하세요.')); return; }
    const data=await res.json();
    const results=(data && data.results)||[];
    if(!results.length){ bcStatus('이 바코드로 음반을 찾지 못했어요. 번호를 확인하거나 직접 입력하세요.'); return; }
    applyDiscogsResult(results[0]);
    bcStatus((isEN()?'✓ Found: ':'✓ 찾았어요: ')+(results[0].title||''));
  }catch(err){
    bcStatus('조회 중 오류가 났어요. 네트워크를 확인하세요.');
  }
}
function applyDiscogsResult(r){
  // Discogs title은 보통 "Artist - Album" 형식
  let artist='', album='';
  if(r.title && r.title.includes(' - ')){ const p=r.title.split(' - '); artist=p[0].trim(); album=p.slice(1).join(' - ').trim(); }
  else { album=(r.title||'').trim(); }
  if(artist) $('#f-artist').value=artist;
  if(album) $('#f-album').value=album;
  // 발매연도 (Discogs year)
  if(r.year){ const yf=$('#f-year'); if(yf && !yf.value){ const y=parseInt(String(r.year).slice(0,4),10); if(y) yf.value=y; } }
  // 커버
  const cover=r.cover_image||r.thumb;
  if(cover && !/spacer\.gif/.test(cover)){ setPrevImg(cover,'Discogs 커버로 저장돼요 ✓'); }
  // 장르
  if(r.genre && r.genre.length){ const gf=$('#f-genre'); if(gf && !gf.value) gf.value=r.genre[0]; }
}

function _collStatsForCard(){
  const real=DATA.filter(d=>statusGroup(d.status)!=='위시');
  const owned=DATA.filter(d=>statusGroup(d.status)==='보유중');
  const liked=DATA.filter(d=>d.liked).length;
  const buy=real.reduce((s,d)=>s+(d.price||0),0);
  const gc={}, ac={};
  real.forEach(d=>{ if(d.genre) gc[d.genre]=(gc[d.genre]||0)+1; if(d.artist && d.artist!=='-') ac[d.artist]=(ac[d.artist]||0)+1; });
  const top=o=>Object.keys(o).sort((a,b)=>o[b]-o[a])[0]||'';
  return { total:real.length, owned:owned.length, liked, buy, genre:top(gc), artist:top(ac) };
}

async function shareCollectionCard(){

/* ---------- persist (in-memory + attempt localStorage) ---------- */
const ratings={};  // key -> 0..5  (for seed items)
const genres={};   // ratingKey -> genre (for seed items)
const likes={};    // ratingKey -> bool (for seed items)
const seedEdits={}; // seed id -> {status,arrive,store,price,orig,buy,pay} edits
function ratingKey(it){ return (it.artist+'|'+it.album+'|'+(it.color||'')).toLowerCase(); }
function saveRating(it){ cloudSaveItem(it); }
function saveLiked(it){ cloudSaveItem(it); }
function saveGenre(it){ cloudSaveItem(it); }
function saveLocal(){ /* 클라우드 모드: 항목별 저장(cloudSaveItem)이 영속성을 담당 */ }
// 변경된 LP 한 장을 Firebase에 저장 (로그인 모듈이 window.LPCloud를 제공)
function cloudSaveItem(it){ if(window.LPCloud && window.LPCloud.saveItem) window.LPCloud.saveItem(it); }
function cloudDeleteItem(id){ if(window.LPCloud && window.LPCloud.deleteItem) window.LPCloud.deleteItem(id); }
function deleteRecord(id){
  const idx=DATA.findIndex(x=>String(x.id)===String(id));
  if(idx<0) return;
  DATA.splice(idx,1);
  cloudDeleteItem(id);
  saveLocal();
  hide('detail');
  renderGrid(); renderChips(); buildCoverFlow();
  if(typeof renderStats==='function') renderStats();
  if(typeof renderCal==='function') renderCal();
  if($('#view-my') && $('#view-my').classList.contains('on')){ if(typeof renderLikes==='function') renderLikes(); if(typeof renderTaste==='function') renderTaste(); if(typeof renderCollections==='function') renderCollections(); }
}
function loadLocal(){
  try{
    const picks=JSON.parse(localStorage.getItem('lp_picks')||'{}');
    Object.assign(pickedArt,picks);
    Object.keys(picks).forEach(k=>artCache[k]=picks[k]);
    Object.assign(ratings, JSON.parse(localStorage.getItem('lp_ratings')||'{}'));
    Object.assign(genres, JSON.parse(localStorage.getItem('lp_genres')||'{}'));
    Object.assign(likes, JSON.parse(localStorage.getItem('lp_likes')||'{}'));
    Object.assign(seedEdits, JSON.parse(localStorage.getItem('lp_seededits')||'{}'));
    const ext=JSON.parse(localStorage.getItem('lp_added')||'[]');
    if(ext.length){DATA=[...ext,...DATA];ext.forEach(it=>{if(it._art)artCache[artKey(it.artist,it.album)]=it._art;});}
    // apply chosen covers + saved ratings + genres + seed edits to seed items
    DATA.forEach(it=>{
      const k=artKey(it.artist,it.album);if(pickedArt[k])it._art=pickedArt[k];
      if(it.rating==null){ const rk=ratingKey(it); if(ratings[rk]!=null) it.rating=ratings[rk]; }
      if(!it.genre){ const rk=ratingKey(it); if(genres[rk]) it.genre=genres[rk]; }
      { const rk=ratingKey(it); if(it.liked==null && likes[rk]!=null) it.liked=likes[rk]; }
      if(seedEdits[it.id]) Object.assign(it, seedEdits[it.id]);
    });
    loadCollections();
    loadSettings();
  }catch(e){}
}

/* ---------- calendar ---------- */
let calYear, calMonth;   // current view (month is 0-based)
function artFor(it){ return it._art || pickedArt[artKey(it.artist,it.album)] || artCache[artKey(it.artist,it.album)] || null; }

/* 날짜별 "대표 이벤트" 사용자 지정. key='YYYY-MM-DD' → 'itemId|kind' */
let calRepPick={};
function loadCalRep(){ try{ calRepPick=JSON.parse(localStorage.getItem('lp_calrep')||'{}'); }catch(e){ calRepPick={}; } }
function saveCalRep(){ try{ localStorage.setItem('lp_calrep', JSON.stringify(calRepPick)); }catch(e){} }
function repKeyOf(ev){ return (ev.it.id)+'|'+ev.kind; }
function setCalRep(dateStr, ev){ calRepPick[dateStr]=repKeyOf(ev); saveCalRep(); }
function clearCalRep(dateStr){ delete calRepPick[dateStr]; saveCalRep(); }
loadCalRep();

// collect date-events: {date:'YYYY-MM-DD', kind:'arrive'|'buy'|'sold'|'open', it}
function calEvents(){
  const ev=[];
  DATA.forEach(it=>{
    if(statusGroup(it.status)==='위시') return;
    const g=statusGroup(it.status);
    // 판매일 → 흑백
    if(it.status==='판매' && it.sellDate) ev.push({date:it.sellDate, kind:'sold', it});
    // 도착일 → 원본 (도착했으면 구매일은 생략, 도착이 대표)
    if(it.arrive) ev.push({date:it.arrive, kind:'arrive', it});
    // 구매일: 도착 전(배송중)이면 투명 60%, 도착일이 없을 때만 구매일로 표기
    if(it.buy && !it.arrive){
      ev.push({date:it.buy, kind: g==='배송전' ? 'buy' : 'arrive', it});
    }
    // 개봉 → CD판 (개봉일자가 있으면 그 날짜, 없으면 도착일/구매일 기준)
    if(it.status==='개봉'){
      const od=(it.openDate && it.openDate!=='모름') ? it.openDate : (it.arrive||it.buy);
      if(od) ev.push({date:od, kind:'open', it});
    }
    // 청음 기록 → 보라 점
    if(Array.isArray(it.listens)){
      it.listens.forEach(l=>{ if(l && l.date) ev.push({date:l.date, kind:'listen', it, note:l.note}); });
    }
  });
  return ev;
}
function renderCal(){
  const now=new Date();
  if(calYear==null){ calYear=now.getFullYear(); calMonth=now.getMonth(); }
  const first=new Date(calYear, calMonth, 1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear, calMonth+1, 0).getDate();
  $('#cal-title').textContent = isEN()
    ? ['January','February','March','April','May','June','July','August','September','October','November','December'][calMonth]+' '+calYear
    : `${calYear}년 ${calMonth+1}월`;
  // index events for this month by day
  const ev=calEvents().filter(e=>{ const d=new Date(e.date); return d.getFullYear()===calYear && d.getMonth()===calMonth; });
  const byDay={};
  ev.forEach(e=>{ const day=new Date(e.date).getDate(); (byDay[day]=byDay[day]||[]).push(e); });
  const dows=['일','월','화','수','목','금','토'];
  $('#cal-dows').innerHTML=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let html='';
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items=byDay[d]||[];
    const isToday = dateStr===todayStr;
    let inner='';
    if(items.length){
      // priority for the visible tile: open(CD) > sold > arrive > buy
      const order={open:0,sold:1,arrive:2,buy:3,listen:4};
      let top=null;
      // 사용자가 이 날짜의 대표를 직접 지정했으면 그걸 우선
      const pick=calRepPick[dateStr];
      if(pick){ top=items.find(e=>repKeyOf(e)===pick) || null; }
      if(!top) top=[...items].sort((a,b)=>order[a.kind]-order[b.kind])[0];
      const art=artFor(top.it);
      if(top.kind==='open'){
        inner=`<div class="ph-cd" style="--disc:${discColor(top.it.color)}"></div>`;
      } else if(art){
        const cls = top.kind==='buy'?'ph-buy' : top.kind==='sold'?'ph-sold' : '';
        inner=`<img class="ph-img ${cls}" src="${art}" alt="">`;
      } else {
        const cls = top.kind==='buy'?'ph-buy':top.kind==='sold'?'ph-sold':'';
        inner=`<div class="ph-img ${cls}" style="background:${discColor(top.it.color)};opacity:${top.kind==='buy'?.6:1}"></div>`;
      }
      if(items.length>1) inner+=`<span class="multi">+${items.length-1}</span>`;
    }
    const hasListen = (byDay[d]||[]).some(e=>e.kind==='listen');
    if(hasListen) inner+=`<span class="listen-dot"></span>`;
    html+=`<div class="cal-cell ${isToday?'today':''} ${inner?'has':''}" data-date="${dateStr}" ${d===1?`style="grid-column-start:${startDow+1}"`:''}>${inner}<span class="dnum">${d}</span></div>`;
  }
  $('#cal-grid').innerHTML=html;
  $('#cal-empty').textContent = ev.length ? '' : '이 달엔 기록이 없어요';
  // 날짜 클릭 → 그날 항목 보기 + 청음 추가
  $('#cal-grid').querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    const items=byDay[+cell.dataset.date.slice(-2)]||[];
    cell.onclick=()=> openDayList(cell.dataset.date, items);
  });
  // 모든 셀을 누를 수 있게 (청음 추가 가능)
  $('#cal-grid').querySelectorAll('.cal-cell[data-date]').forEach(c=>c.classList.add('has'));
  // 달력의 현재 달에 맞춰 월별 주문/거래 요약 갱신
  const mKey=`${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  if(typeof renderMonthStat==='function') renderMonthStat(mKey);
}

/* 달력: 하루에 여러 앨범이 있을 때 목록 팝업 */
const KIND_LABEL={open:'개봉',sold:'판매',arrive:'도착',buy:'구매',listen:'청음'};
function openDayList(dateStr, items){
  const wrap=$('#daylist'); if(!wrap) return;
  const d=new Date(dateStr+'T00:00:00');
  const title=`${d.getMonth()+1}월 ${d.getDate()}일`;
  $('#daylist-title').textContent=items.length?`${title} · ${items.length}건`:title;
  // 타일에 표시되는 종류(청음 제외)가 2개 이상이면 대표 선택 가능
  const tileable=items.filter(e=>e.kind!=='listen');
  const canPickRep = tileable.length>1;
  let html='';
  if(items.length){
    html+=items.map(ev=>{
      const it=ev.it;
      const art=artFor(it);
      const thumb = art
        ? `<img src="${art}" alt="">`
        : `<div class="dl-ph" style="background:${discColor(it.color)}"></div>`;
      const kind=KIND_LABEL[ev.kind]||'';
      const sub = ev.kind==='listen' && ev.note ? `<div class="dl-note">🎧 ${escapeHtml(ev.note)}</div>` : '';
      // 대표 지정 별 버튼 (타일에 나오는 종류만, 우상단 겹침)
      let repBtn='';
      if(canPickRep && ev.kind!=='listen'){
        const on = calRepPick[dateStr]===repKeyOf(ev);
        repBtn=`<button type="button" class="dl-rep ${on?'on':''}" data-rep="${escapeHtml(repKeyOf(ev))}" title="달력 대표 이미지로 지정">${on?'⭐':'☆'}</button>`;
      }
      return `<div class="dl-item" data-id="${it.id}">
        <span class="dl-kind dl-lead dl-${ev.kind}">${kind}</span>
        <div class="dl-thumb">${thumb}</div>
        <div class="dl-info">
          <div class="dl-al">${escapeHtml(it.album||'제목 없음')}</div>
          <div class="dl-ar">${escapeHtml(it.artist||'')}</div>
          ${sub}
        </div>
        ${repBtn}
      </div>`;
    }).join('');
  } else {
    html+=`<div class="dl-emptyday">이 날엔 기록이 없어요.</div>`;
  }
  if(canPickRep){
    html+=`<div class="dl-rep-hint" style="font-size:11.5px;color:var(--muted);margin:4px 2px 0;line-height:1.5">⭐ 별을 눌러 달력에 보일 대표 이미지를 고를 수 있어요.</div>`;
  }
  html+=`<button type="button" class="dl-addlisten" id="dl-addlisten">🎧 청음 기록 추가</button>`;
  wrap.innerHTML=html;
  wrap.querySelectorAll('.dl-item').forEach(b=>b.onclick=()=>{ hide('daylist'); openDetail(b.dataset.id); });
  // 대표 지정 별 버튼
  wrap.querySelectorAll('.dl-rep').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const key=b.dataset.rep;
    if(calRepPick[dateStr]===key){ clearCalRep(dateStr); }   // 다시 누르면 해제(자동선택으로)
    else { calRepPick[dateStr]=key; saveCalRep(); }
    // 시트 내 별 상태 갱신
    wrap.querySelectorAll('.dl-rep').forEach(x=>{
      const on=calRepPick[dateStr]===x.dataset.rep;
      x.classList.toggle('on',on); x.textContent=on?'⭐':'☆';
    });
    if(typeof renderCal==='function') renderCal();
  });
  $('#dl-addlisten').onclick=()=>{ hide('daylist'); openListenPicker(dateStr); };
  show('daylist');
}

/* 청음 추가: 어떤 앨범을 들었는지 고르는 작은 선택 (그 날짜로 기록) */

    <div class="stat"><div class="lab">총 구매가</div><div class="val sm">${won(totalBuy)}</div></div>

    </div>
    ${buckets.map(([v,items],bi)=>`
      <div style="margin:8px 0">
        <div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'" style="display:flex;align-items:center;gap:8px;margin-bottom:3px;cursor:pointer">
          <span style="min-width:78px;display:inline-flex">${starsCompact(v)}</span>
          <span style="flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(items.length/rated.length*100)}%;background:linear-gradient(90deg,var(--accent2),var(--accent))"></span></span>
          <b style="color:var(--txt);font-size:12px;min-width:18px;text-align:right">${items.length}</b>
          <span style="color:var(--dim);font-size:11px">▸</span>
        </div>
        <div style="display:none;font-size:11.5px;color:var(--muted);padding:6px 0 4px 50px;line-height:1.7">${items.map(d=>`${d.album||'—'} <span style="color:var(--dim)">· ${d.artist||''}</span>`).join('<br>')}</div>
      </div>`).join('')}
    <div style="height:1px;background:var(--line);margin:14px 0"></div>` : '';

  // 소장 가치 (구매가 vs 판매 차익)
  const bestSell=sold.slice().sort((a,b)=>((b.profit||0))-((a.profit||0)))[0];
  const valueHTML=`
    <div style="font-weight:700;color:var(--txt);margin-bottom:8px">소장 가치</div>

    ${bestSell?`<div style="display:flex;justify-content:space-between;margin:6px 0"><span>가장 잘 판 LP</span><b style="color:var(--txt)">${bestSell.album||bestSell.artist||''}</b></div>`:''}`;

  $('#bigstats').innerHTML=ratingHTML+valueHTML;

/* ===== 월별 요약 (달력 아래, 달력의 그 달에 연동) ===== */
function renderMonthStat(m){
  const body=$('#cal-monthstat'); if(!body) return;
  const buy   = DATA.filter(d=>d.buy && String(d.buy).slice(0,7)===m && statusGroup(d.status)!=='위시');
  const soldM = DATA.filter(d=>d.sellDate && String(d.sellDate).slice(0,7)===m && d.status==='판매');
  const exchM = DATA.filter(d=>d.sellDate && String(d.sellDate).slice(0,7)===m && d.status==='교환');
  // 청음: 그 달에 들은 기록들 (앨범+날짜+메모를 펼침용으로 보관)
  const listenEv=[];
  DATA.forEach(d=>{ if(Array.isArray(d.listens)) d.listens.forEach(l=>{ if(l&&l.date&&String(l.date).slice(0,7)===m) listenEv.push({it:d, date:l.date, note:l.note}); }); });
  listenEv.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const buyAmt = buy.reduce((s,d)=>s+(d.price||0),0);
  const sellAmt= soldM.reduce((s,d)=>s+(d.sellPrice||0),0);
  const cards=[
    ['구매', buy, won(buyAmt), '#e8643c', 'buy'],
    ['판매·교환', soldM.concat(exchM), sellAmt?won(sellAmt):'', '#5ec27e', 'deal'],
    ['청음', listenEv, '', '#8a6fd6', 'listen'],
  ];
  const albumLine=(d,kind)=>{
    let extra='';
    if(kind==='buy' && d.price!=null) extra=` <span class="ms-li-amt">${won(d.price)}</span>`;
    else if(kind==='deal' && d.sellPrice!=null) extra=` <span class="ms-li-amt">${won(d.sellPrice)}</span>`;
    return `<div class="ms-li" data-id="${d.id}"><span class="ms-li-al">${escapeHtml(d.album||'—')}</span><span class="ms-li-ar">${escapeHtml(d.artist||'')}</span>${extra}</div>`;
  };
  const listenLine=(ev)=>{
    const mm=parseInt((ev.date||'').slice(5,7),10);
    const dd=parseInt((ev.date||'').slice(8,10),10);
    const dateLabel=(mm&&dd)?`${mm}/${dd}`:'';
    return `<div class="ms-li" data-id="${ev.it.id}"><span class="ms-li-al">${escapeHtml(ev.it.album||'—')}</span><span class="ms-li-ar">${escapeHtml(ev.it.artist||'')}</span>${ev.note?`<span class="ms-li-note">🎧 ${escapeHtml(ev.note)}</span>`:''}<span class="ms-li-amt">${dateLabel}</span></div>`;
  };
  if(!buy.length && !soldM.length && !exchM.length && !listenEv.length){
    body.innerHTML=`<div class="ms-head">이 달의 기록</div><div class="mstat-empty">이 달에는 구매·판매·교환·청음 기록이 없어요.</div>`;
    return;
  }
  body.innerHTML=`
    <div class="ms-head">이 달의 기록</div>
    <div class="mstat-cards">
      ${cards.map(([lab,arr,sub,c,key])=>`
        <button type="button" class="mstat-card${arr.length?' tappable':''}" data-key="${key}" ${arr.length?'':'disabled'}>
          <div class="mstat-dot" style="background:${c}"></div>
          <div class="mstat-lab">${lab}</div>
          <div class="mstat-cnt">${arr.length}<span>${key==='listen'?'회':'장'}</span></div>
          ${sub?`<div class="mstat-sub">${sub}</div>`:''}
          ${arr.length?`<div class="mstat-more" id="ms-more-${key}">▾</div>`:''}
        </button>`).join('')}
    </div>
    <div class="ms-detail" id="ms-detail"></div>`;
  const lists={ buy, deal:soldM.concat(exchM), listen:listenEv };
  let openKey=null;
  body.querySelectorAll('.mstat-card.tappable').forEach(btn=>btn.onclick=()=>{
    const key=btn.dataset.key;
    const det=$('#ms-detail');
    body.querySelectorAll('.mstat-card').forEach(c=>c.classList.remove('on'));
    body.querySelectorAll('.mstat-more').forEach(e=>e.textContent='▾');
    if(openKey===key){ openKey=null; det.innerHTML=''; det.classList.remove('show'); return; }
    openKey=key;
    btn.classList.add('on');
    const more=$('#ms-more-'+key); if(more) more.textContent='▴';
    det.innerHTML=lists[key].map(d=> key==='listen' ? listenLine(d) : albumLine(d,key)).join('');
    det.classList.add('show');
    det.querySelectorAll('.ms-li').forEach(li=>li.onclick=()=>openDetail(li.dataset.id));
  });
}

/* ===== 내 취향 요약 (LP 데이터 기반) ===== */
function renderTaste(){
  const wrap=$('#taste'); if(!wrap) return;
  const owned=DATA.filter(d=>statusGroup(d.status)!=='위시');   // 위시 제외, 보유/판매/교환 포함
  if(!owned.length){ wrap.innerHTML=`<div class="coll-empty">아직 데이터가 부족해요.</div>`; return; }

  // 집계 헬퍼
  const tally=(key)=>{ const m={}; owned.forEach(d=>{ const k=(d[key]||'').trim(); if(!k||k==='-')return; m[k]=(m[k]||0)+1; }); return m; };
  const top=(m,n)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);

  // 1) 최애 아티스트 TOP3 (보유 수 → 평균 평점 가산)
  const byArtist={};
  owned.forEach(d=>{ const a=(d.artist||'').trim(); if(!a||a==='-')return; (byArtist[a]=byArtist[a]||[]).push(d); });
  const artistRank=Object.entries(byArtist).map(([a,arr])=>{
    const cnt=arr.length; const rated=arr.filter(x=>x.rating); const avg=rated.length?rated.reduce((s,x)=>s+x.rating,0)/rated.length:0;
    return {a, cnt, avg};
  }).sort((x,y)=> y.cnt-x.cnt || y.avg-x.avg).slice(0,3);

  // 2) 최애 장르 TOP3
  const genreTop=top(tally('genre'),3);
  const genreMax=genreTop.length?genreTop[0][1]:1;

  // 3) 바이닐 컬러 분포 (대표색으로 그룹)
  const colorMap={};
  owned.forEach(d=>{ const c=normColorName(d.color); if(!c)return; colorMap[c]=(colorMap[c]||0)+1; });
  const colorTop=Object.entries(colorMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const colorTotal=Object.values(colorMap).reduce((s,n)=>s+n,0)||1;

  // 4) 자주 간 구매처 TOP3
  const storeTop=top(tally('store'),3).filter(([k])=>k!=='선물'&&k!=='교환');

  // 5) 수집 연대기 (연도별)
  const byYear={};
  owned.forEach(d=>{ if(!d.buy)return; const y=String(d.buy).slice(0,4); if(!/^\d{4}$/.test(y))return; byYear[y]=(byYear[y]||0)+1; });
  const years=Object.keys(byYear).sort();
  const yearMax=Math.max(1,...Object.values(byYear));

  const cards=[];

  // 최애 아티스트
  cards.push(`<div class="t-card">
    <div class="t-head">최애 아티스트</div>
    ${artistRank.map((r,i)=>`<div class="t-row"><span class="t-rank">${i+1}</span><span class="t-name">${escapeHtml(r.a)}</span><span class="t-val">${r.cnt}${isEN()?'':'<span class="u">장</span>'}${r.avg?` · ★${r.avg.toFixed(1)}`:''}</span></div>`).join('')||'<div class="t-empty">데이터 없음</div>'}
  </div>`);

  // 최애 장르
  cards.push(`<div class="t-card">
    <div class="t-head">최애 장르</div>
    ${genreTop.map(([g,c])=>`<div class="t-bar-row"><span class="t-bar-lab">${escapeHtml(g)}</span><span class="t-bar-track"><span class="t-bar-fill" style="width:${Math.round(c/genreMax*100)}%"></span></span><span class="t-bar-num">${c}</span></div>`).join('')||'<div class="t-empty">데이터 없음</div>'}
  </div>`);

  // 컬러 분포
  cards.push(`<div class="t-card">
    <div class="t-head">바이닐 컬러 분포</div>
    <div class="t-colorbar">${colorTop.map(([c,n])=>`<span style="flex:${n};background:${colorHexFor(c)}" title="${escapeHtml(c)} ${n}장"></span>`).join('')}</div>
    <div class="t-colorlegend">${colorTop.map(([c,n])=>`<span class="t-cl"><i style="background:${colorHexFor(c)}"></i>${escapeHtml(c)} ${Math.round(n/colorTotal*100)}%</span>`).join('')}</div>
  </div>`);

  // 단골 구매처
  cards.push(`<div class="t-card">
    <div class="t-head">자주 간 구매처</div>
    ${storeTop.map((s,i)=>`<div class="t-row"><span class="t-rank">${i+1}</span><span class="t-name">${escapeHtml(s[0])}</span><span class="t-val">${s[1]}${isEN()?'':'장'}</span></div>`).join('')||'<div class="t-empty">데이터 없음</div>'}
  </div>`);

  // 수집 연대기
  cards.push(`<div class="t-card">
    <div class="t-head">수집 연대기</div>
    <div class="t-years">${years.map(y=>`<div class="t-year"><span class="t-ybar" style="height:${Math.round(byYear[y]/yearMax*100)}%"></span><span class="t-ynum">${byYear[y]}</span><span class="t-ylab">'${y.slice(2)}</span></div>`).join('')||'<div class="t-empty">데이터 없음</div>'}</div>
  </div>`);

  wrap.innerHTML=cards.join('');
}
// 컬러명을 대표 그룹으로 정규화
function normColorName(c){
  if(!c) return '';
  const s=String(c).toLowerCase();
  if(/블랙|black|검/.test(s)) return '블랙';
  if(/화이트|white|스노우|snow|불투명/.test(s)) return '화이트';
  if(/투명|clear|클리어/.test(s)) return '투명';
  if(/그레이|gray|grey|회/.test(s)) return '그레이';
  if(/레드|red|자주|핑크|pink|버건디/.test(s)) return '레드';
  if(/블루|blue|아이스/.test(s)) return '블루';
  if(/그린|green|에메랄드|민트/.test(s)) return '그린';
  if(/옐로|yellow|골드|gold/.test(s)) return '옐로우';
  if(/오렌지|orange/.test(s)) return '오렌지';
  if(/퍼플|purple|보라|바이올렛/.test(s)) return '퍼플';
  if(/마블|스플|splatter/.test(s)) return '마블';
  return '기타';
}
function colorHexFor(name){
  return {'블랙':'#222','화이트':'#e8e8e8','투명':'#c9d2da','그레이':'#8a8a8a','레드':'#d63a3a','블루':'#3a6fd6','그린':'#36a35a','옐로우':'#e6c23a','오렌지':'#e8843a','퍼플':'#8a4fd6','마블':'#9a8fb0','기타':'#6a6478'}[name]||'#6a6478';
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function exportData(){
  try{

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='lp-archive-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){ alert('내보내기에 실패했어요'); }
}

/* ---------- Cover Flow ---------- */
let cfItems=[], cfIndex=0, cfCards=[], cfMode='cover';   // 'cover' | 'vinyl'
function applyCfMode(){
  const stage=$('#cf-stage'); if(stage) stage.classList.toggle('vinyl-mode', cfMode==='vinyl');
  const btn=$('#cf-mode-toggle'); if(btn){ btn.classList.toggle('on', cfMode==='vinyl'); btn.title = cfMode==='vinyl' ? '자켓 보기로 전환' : 'LP판 보기로 전환'; }
  const lab=$('#cf-mode-lab'); if(lab) lab.textContent = cfMode==='vinyl' ? '자켓 보기' : 'LP판 보기';
}
function buildCoverFlow(){
  cfItems=DATA.filter(d=>{const g=statusGroup(d.status);return g==='보유중'||g==='배송전';});  // 소장/예정만
  if(!cfItems.length) cfItems=DATA.slice();
  const track=$('#cf-track');
  track.innerHTML=cfItems.map((it,i)=>{
    const dStyle = it.discPhoto
      ? `--photo:url(${it.discPhoto})`
      : `--disc:${it.discColorCustom||discColor(it.color)};opacity:${it.discOpacity!=null?it.discOpacity:1}`;
    return `
    <div class="cf-card" data-i="${i}" data-id="${it.id}">
      <div class="cf-art">
        <div class="cf-ph"><div class="v"></div><div>${it.artist||'?'}</div></div>
        <img data-cf="${it.id}" alt="">
        <div class="cf-disc${it.discPhoto?' has-photo':''}" style="${dStyle}"></div>
      </div>
    </div>`;
  }).join('');
  cfCards=[...track.querySelectorAll('.cf-card')];
  // load art for each cover-flow card (reuse cache)
  cfItems.forEach(async it=>{
    const img=track.querySelector(`img[data-cf="${it.id}"]`);
    const url=it._art||pickedArt[artKey(it.artist,it.album)]||await fetchArt(it.artist,it.album);
    if(url&&img){img.src=url;img.onload=()=>{const ph=img.parentElement.querySelector('.cf-ph'); if(ph) ph.style.display='none';};}
  });
  cfIndex=Math.min(cfIndex,cfItems.length-1);
  layoutCoverFlow();
  applyCfMode();
  // tap center card -> detail
  cfCards.forEach(c=>c.addEventListener('click',()=>{
    const i=+c.dataset.i;
    if(i===cfIndex) openDetail(c.dataset.id);
    else { cfIndex=i; layoutCoverFlow(); }
  }));
}
function layoutCoverFlow(){
  cfCards.forEach((c,i)=>{
    const off=i-cfIndex;
    const ax=Math.abs(off);
    if(ax>4){c.style.display='none';return;} c.style.display='';
    const x=off*48;                       // horizontal shelf spacing
    const z=-ax*120;                      // depth
    const rot=off===0?0:(off<0?42:-42);   // turn side covers
    const sc=off===0?1.18:0.92;
    c.style.transform=`translateX(${x}px) translateZ(${z}px) rotateY(${rot}deg) scale(${sc})`;
    c.style.zIndex=String(100-ax);
    c.querySelector('.cf-art').style.boxShadow=off===0?'0 22px 38px rgba(0,0,0,.6)':'0 14px 22px rgba(0,0,0,.45)';
    c.querySelector('.cf-art').style.filter=off===0?'none':'brightness(.7)';
  });
  const it=cfItems[cfIndex]; if(!it)return;
  $('#cf-info').innerHTML=`<h3>${it.album||'—'}</h3>${starsView(it.rating)}<p>${it.artist||'—'}</p><div class="tap">탭하면 상세 정보 · ${it.genre?it.genre+' · ':''}${it.color||''}</div>`;
}
function cfMove(d){ cfIndex=Math.max(0,Math.min(cfItems.length-1,cfIndex+d)); layoutCoverFlow(); }

// drag / swipe / wheel
(function(){
  const stage=$('#cf-stage');
  let down=false,sx=0,acc=0,moved=false;
  const start=x=>{down=true;sx=x;acc=0;moved=false;};
  const move=x=>{ if(!down)return; const dx=x-sx; if(Math.abs(dx)>6)moved=true;
    if(Math.abs(dx)>42){ cfMove(dx<0?1:-1); sx=x; } };
  const end=()=>{down=false;};
  stage.addEventListener('mousedown',e=>start(e.clientX));
  window.addEventListener('mousemove',e=>move(e.clientX));
  window.addEventListener('mouseup',end);
  stage.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});
  stage.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
  stage.addEventListener('touchend',end);
  stage.addEventListener('click',e=>{ if(moved){e.stopPropagation();e.preventDefault();} },true);
  let wlock=0;
  stage.addEventListener('wheel',e=>{ if(Math.abs(e.deltaX)<Math.abs(e.deltaY))return;
    e.preventDefault(); const now=Date.now(); if(now-wlock<160)return; wlock=now; cfMove(e.deltaX>0?1:-1); },{passive:false});
  // 좌/우 버튼: 한 번 탭 = 한 칸, 꾹 누르면 그 방향으로 점점 빠르게 연속 이동
  (function holdNav(){
    let timer=null, raf=null, started=false;
    function stop(){
      if(timer){ clearTimeout(timer); timer=null; }
      if(raf){ clearInterval(raf); raf=null; }
      started=false;
    }
    function begin(dir){
      stop();
      // 누르자마자 한 칸 이동(탭 느낌)
      cfMove(dir);
      // 길게 누르면 350ms 후 연속 이동 시작, 점점 빨라짐
      timer=setTimeout(()=>{
        started=true;
        let delay=140;
        const tick=()=>{
          if((dir<0&&cfIndex<=0)||(dir>0&&cfIndex>=cfItems.length-1)){ stop(); return; }
          cfMove(dir);
          delay=Math.max(45, delay-12);   // 가속
          clearInterval(raf); raf=setInterval(tick, delay);
        };
        raf=setInterval(tick, delay);
      }, 350);
    }
    function bind(btn, dir){
      if(!btn) return;
      const onDown=e=>{ e.stopPropagation(); e.preventDefault(); begin(dir); };
      btn.addEventListener('mousedown', onDown);
      btn.addEventListener('touchstart', onDown, {passive:false});
      btn.addEventListener('mouseup', stop);
      btn.addEventListener('mouseleave', stop);
      btn.addEventListener('touchend', e=>{ e.preventDefault(); stop(); });
      btn.addEventListener('touchcancel', stop);
      // 드래그 중 버튼 밖에서 떼는 경우 대비
      window.addEventListener('mouseup', stop);
      // 기존 click 이동은 mousedown에서 처리하므로 click은 무력화
      btn.addEventListener('click', e=>{ e.stopPropagation(); e.preventDefault(); });
    }
    bind($('#cf-hold-l'), -1);
    bind($('#cf-hold-r'),  1);
  })();
  const mt=$('#cf-mode-toggle');
  if(mt) mt.addEventListener('click',e=>{ e.stopPropagation(); cfMode = cfMode==='vinyl'?'cover':'vinyl'; applyCfMode(); });
})();

// 데이터URL → Blob (Storage 업로드용)
function dataURLToBlob(dataURL){
  const parts=dataURL.split(','); const head=parts[0]||'';
  const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(parts[1]||''); const len=bin.length; const arr=new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
// 최초 로그인 시: 기존 SEED + (이 기기의) 로컬 데이터를 모아 반환 → 계정으로 이전
window.buildInitialData=function(){
  if(localStorage.getItem('lp_migrated')==='1'){
    return SEED.map((x,i)=>({...x, id:'s'+i}));   // 이후 새 계정은 기본 시드만
  }
  loadLocal();                                    // 최초 1회만 기존 로컬 기록까지 이전
  try{ localStorage.setItem('lp_migrated','1'); }catch(e){}
  return DATA;
};
// 헤더 계정칩에 이메일 표시
window.setAccount=function(email){ const e=$('#acct-email'); if(e) e.textContent=email||'계정'; };
// 로그인 + 데이터 로드 완료 후 앱을 그림
window.bootApp=function(items){
  DATA=Array.isArray(items)?items:[];
  // 이전 사용자 흔적 제거 후, 저장된 커버를 캐시에 반영
  Object.keys(pickedArt).forEach(k=>delete pickedArt[k]);
  DATA.forEach(it=>{ if(it._art){ const k=artKey(it.artist,it.album); pickedArt[k]=it._art; artCache[k]=it._art; } });
  filter={q:'',chip:'전체',sub:'',sort:'default',genre:'',view:'grid'};
  calYear=null; cfIndex=0;
  if($('#q')) $('#q').value='';
  renderChips();renderStats();renderGrid();buildCoverFlow();refreshGenreChips();
};

/* ===== 안드로이드 하드웨어 뒤로가기 ===== */
/* 우선순위: 열린 시트/오버레이 닫기 → 비홈(보관함) 뷰면 보관함으로 → 더 닫을 게 없으면 종료 확인 */
function showExitConfirm(){
  if(document.getElementById('exit-confirm')) return;
  const en = (typeof isEN==='function') && isEN();
  const m=document.createElement('div'); m.id='exit-confirm'; m.className='exit-ov';
  m.innerHTML=`<div class="exit-box">
    <div class="exit-t">${en?'Exit the app?':'앱을 종료하시겠어요?'}</div>
    <div class="exit-btns">
      <button type="button" class="exit-cancel">${en?'Cancel':'취소'}</button>
      <button type="button" class="exit-ok">${en?'Exit':'종료'}</button>
    </div></div>`;
  document.body.appendChild(m);
  requestAnimationFrame(()=>m.classList.add('show'));
  const close=()=>{ m.classList.remove('show'); setTimeout(()=>{ try{m.remove();}catch(e){} },200); };
  m.querySelector('.exit-cancel').onclick=close;
  m.onclick=(e)=>{ if(e.target===m) close(); };
  m.querySelector('.exit-ok').onclick=()=>{
    try{ const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App; if(A&&A.exitApp) A.exitApp(); }catch(e){}
  };
}
function handleAppBack(){
  // 0) 종료 확인 모달이 떠 있으면 그것부터 닫기
  const ec=document.getElementById('exit-confirm');
  if(ec){ ec.classList.remove('show'); setTimeout(()=>{ try{ec.remove();}catch(e){} },200); return; }
  // 1) 열린 시트(가장 위) 닫기
  const sheets=document.querySelectorAll('.sheet.show');
  if(sheets.length){
    try{ if(typeof stopBarcodeScan==='function') stopBarcodeScan(); }catch(e){}
    const top=sheets[sheets.length-1];
    try{ hide(top.id.replace('sheet-','')); }catch(e){ top.classList.remove('show'); }
    return;
  }
  // 2) 남은 오버레이 닫기
  const ov=document.querySelector('.ov.show');
  if(ov){ ov.classList.remove('show'); return; }
  // 3) 보관함(홈) 뷰가 아니면 보관함으로
  const cur=document.querySelector('.view.on');
  if(cur && cur.id!=='view-coll'){
    const home=document.querySelector('.nav button[data-v="coll"]');
    if(home){ home.click(); return; }
  }
  // 4) 더 닫을 게 없으면 종료 확인
  showExitConfirm();
}
(function setupBackButton(){
  function reg(){
    try{
      const Cap=window.Capacitor;
      if(Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.App && Cap.Plugins.App.addListener){
        Cap.Plugins.App.addListener('backButton', ()=>handleAppBack());
        return true;
      }
    }catch(e){}
    return false;
  }
  if(!reg()){ let n=0; const t=setInterval(()=>{ if(reg()||++n>20) clearInterval(t); },300); }
})();
