    '규칙:',
    '- artist: 가수/아티스트명. 상품명에 "[LP] 아티스트 - 앨범" 형태면 분리해. 모르면 "".',
    '- album: 앨범명만. [LP],[수입],[45rpm],디스크장수,에디션표기 등 대괄호 수식어는 제거해 깔끔하게.',
    '- store: 쇼핑몰 이름(예: yes24, 알라딘). 화면 로고/헤더로 추정. 모르면 "".',
    '- price: 해당 상품의 "단가"(숫자만, 원 단위). 수량이 여러 개여도 1개 가격. 총액만 보이고 수량>1이면 총액/수량으로 계산.',
    '- qty: 수량(정수). 없으면 1.',
    '- buyDate: 주문일자를 YYYY-MM-DD로. 화면에 날짜가 없으면 "".',
    '- genre: 한국어 장르로 추정(예: 가요, 팝, 록, R&B·소울, 힙합, OST, 재즈, 클래식, 인디). 모르면 "".',
    '- color: 컬러 바이닐 색상이 상품명에 있으면(예: GREEN, 투명, 레드) 한국어로. 없으면 "".',
    '음반 항목이 하나도 없으면 {"items":[]} 를 반환해.'
  ].join('\n');

  function _stripFences(t){ return String(t||'').replace(/```json/gi,'').replace(/```/g,'').trim(); }

  // 전역으로 노출 → 앱(classic) 코드의 onchange 핸들러가 호출
  window.extractOrderFromImage = async function(file){
    if(!_aiModel) throw new Error('AI-not-configured');
    const b64=await _fileToB64(file);
    const r=await _aiModel.generateContent([
      { text:_ORDER_PROMPT },
      { inlineData:{ mimeType:file.type||'image/jpeg', data:b64 } }
    ]);
    const txt=_stripFences(r.response.text());
    let parsed;
    try{ parsed=JSON.parse(txt); }
    catch(e){ const m=txt.match(/\{[\s\S]*\}/); if(m) parsed=JSON.parse(m[0]); else throw new Error('parse-fail'); }
    const items=Array.isArray(parsed&&parsed.items)?parsed.items:[];
    // 숫자 정규화
    items.forEach(o=>{ if(o.price!=null){ const n=Number(String(o.price).replace(/[^\d.]/g,'')); o.price=isNaN(n)?null:n; }
                       if(o.qty!=null){ const q=parseInt(o.qty,10); o.qty=isNaN(q)?1:q; } });
    return { items };
  };

  // LP 한 장을 Firestore 문서로 직렬화 (커버는 cover 필드로 저장)
  const FIELDS=['no','artist','album','color','store','orig','price','pay','buy','arrive',
    'status','sellDate','sellPrice','profit','note','genre','rating','liked',
    'discColorCustom','discOpacity','discPhoto','colorHex',
    'listPrice','sleeveGrade','mediaGrade','openDate','listens','previewAlbumId','previewAlbumName',
    'rpm','inch','year','repCover'];
  function serialize(it){
    const o={};
    FIELDS.forEach(f=>{ o[f]=(it[f]===undefined?null:it[f]); });
    o.cover = it._art || it.cover || null;
    return o;
  }
  function deserialize(id,d){
    const it=Object.assign({},d,{id});
    if(d.cover) it._art=d.cover;
    return it;
  }
  async function loadItems(uid){
    const snap=await getDocs(collection(db,'users',uid,'lps'));
    const out=[]; snap.forEach(s=>out.push(deserialize(s.id,s.data())));
    return out;
  }
  async function migrate(uid,items){
    for(let i=0;i<items.length;i+=400){
      const b=writeBatch(db);
      items.slice(i,i+400).forEach(it=>b.set(doc(db,'users',uid,'lps',String(it.id)),serialize(it)));
      await b.commit();
    }
  }

  // ===== 앱(classic) → 클라우드 다리 =====
  window.LPCloud={
    saveItem(it){
      if(!currentUser||!it||it.id==null) return;
      clearTimeout(saveTimers[it.id]);
      saveTimers[it.id]=setTimeout(async()=>{
        try{ await setDoc(doc(db,'users',currentUser.uid,'lps',String(it.id)),serialize(it)); }
        catch(e){ console.error('저장 실패',e); }
      },400);
    },
    async deleteItem(id){
      if(!currentUser) return;
      try{ await deleteDoc(doc(db,'users',currentUser.uid,'lps',String(id))); }catch(e){}
    },
    // 이 계정의 모든 LP 삭제 (계정 비우기). 초기화 표식은 남겨 재로그인 시 샘플이 다시 생기지 않게 한다.
    async clearAll(){
      if(!currentUser) throw new Error('not-signed-in');
      const snap=await getDocs(collection(db,'users',currentUser.uid,'lps'));
      const ids=[]; snap.forEach(s=>ids.push(s.id));
      for(let i=0;i<ids.length;i+=400){
        const b=writeBatch(db);
        ids.slice(i,i+400).forEach(id=>b.delete(doc(db,'users',currentUser.uid,'lps',String(id))));
        await b.commit();
      }
      try{ await setDoc(doc(db,'users',currentUser.uid,'meta','state'),{initialized:true},{merge:true}); }catch(e){}
      return ids.length;
    },
    // 컬렉션(플레이리스트)은 한 문서에 배열로 저장 → 재시작/기기 이동에도 유지
    saveCollections(list){
      if(!currentUser) return;
      clearTimeout(saveTimers.__colls);
      // JSON 왕복으로 undefined 필드 제거(Firestore는 undefined 저장 불가)
      let safe=[]; try{ safe=JSON.parse(JSON.stringify(Array.isArray(list)?list:[])); }catch(e){ safe=[]; }
      saveTimers.__colls=setTimeout(async()=>{
        try{ await setDoc(doc(db,'users',currentUser.uid,'meta','collections'), { list: safe }); }
        catch(e){ console.error('컬렉션 저장 실패',e); }
      },400);
    },
    async loadCollections(){
      if(!currentUser) return null;   // 미로그인 → 로컬 유지
      try{
        const snap=await getDoc(doc(db,'users',currentUser.uid,'meta','collections'));
        if(snap.exists()){ const d=snap.data(); return Array.isArray(d.list)?d.list:[]; }
        return [];
      }catch(e){ console.error('컬렉션 로드 실패',e); return null; }
    },
    async uploadImage(blob,ext){
      if(!currentUser) throw new Error('not-signed-in');
      const name=Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+(ext||'jpg');
      const r=ref(storage,'users/'+currentUser.uid+'/'+name);
      await uploadBytes(r,blob);
      return await getDownloadURL(r);
    },
    // 컬렉션을 공개 문서(shared/{id})로 발행 → 링크로 누구나 읽기전용 열람. 민감정보(가격·메모)는 제외.
    async shareCollection(coll, shareId){
      if(!currentUser) throw new Error('not-signed-in');
      if(!coll) throw new Error('no-collection');
      const rnd=(self.crypto&&crypto.randomUUID)?crypto.randomUUID().replace(/-/g,''):(Date.now().toString(36)+Math.random().toString(36).slice(2,10));
      shareId=shareId||coll.shareId||rnd;
      const items=(coll.ids||[]).map(id=>DATA.find(x=>x.id===id)).filter(Boolean).map(it=>{
        const cover=(typeof artFor==='function'?artFor(it):(it._art||it.cover))||'';
        return { artist:it.artist||'', album:it.album||'', genre:it.genre||'', color:it.color||'', cover:(/^https?:/.test(cover)?cover:null) };
      });
      const payload={ ownerUid:currentUser.uid, owner:((currentUser.displayName||'').trim().slice(0,40))||null,
        name:(coll.name||'컬렉션').slice(0,60), desc:(coll.desc||'').slice(0,140), color:coll.color||null, items, updatedAt:Date.now() };
      await setDoc(doc(db,'shared',String(shareId)), payload);
      return shareId;
    },
    logout(){ return signOut(auth); },
    // 회원 탈퇴: 이 계정의 모든 데이터(Firestore lps·meta, Storage 이미지) + 인증 계정 자체를 삭제.
    // deleteUser 는 최근 로그인 상태를 요구 → requires-recent-login 이면 재인증(이메일=비번, 구글=팝업) 후 재시도.
    async deleteAccount(password){
      const user=auth.currentUser;
      if(!user) throw new Error('not-signed-in');
      const uid=user.uid;
      // 1) Firestore 데이터 삭제 (lps 전체 + 컬렉션·상태 메타)
      try{ await this.clearAll(); }catch(e){ console.error('clearAll',e); }
      try{ await deleteDoc(doc(db,'users',uid,'meta','collections')); }catch(e){}
      try{ await deleteDoc(doc(db,'users',uid,'meta','state')); }catch(e){}
      // 2) Storage 업로드 이미지 삭제 (best-effort)
      try{ const l=await listAll(ref(storage,'users/'+uid)); await Promise.all(l.items.map(i=>deleteObject(i).catch(()=>{}))); }catch(e){}
      // 3) 인증 계정 삭제 (필요 시 재인증)
      try{
        await deleteUser(user);
      }catch(e){
        if(e && e.code==='auth/requires-recent-login'){
          const pid=(user.providerData&&user.providerData[0]&&user.providerData[0].providerId)||'';
          if(pid==='password'){
            if(!password){ const err=new Error('need-password'); err.code='need-password'; throw err; }
            await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, password));
          }else{
            await reauthenticateWithPopup(user, new GoogleAuthProvider());
          }
          await deleteUser(user);
        }else{
          throw e;
        }
      }
    }
  };

  // ===== 로그인 상태 감지 =====
  onAuthStateChanged(auth, async user=>{
    currentUser=user;
    if(!user){ setState('auth'); showErr(''); resetInputs(); return; }
    setState('boot');
    try{
      let items=await loadItems(user.uid);
      // 계정을 '딱 한 번'만 초기화(샘플 1장)한다. 이미 초기화된 계정은 비어 있어도 다시 시드하지 않음
      // → '계정 비우기'로 비운 계정이 재로그인할 때 샘플이 되살아나지 않게 하기 위함.
      let inited=false;
      try{ const ms=await getDoc(doc(db,'users',user.uid,'meta','state')); inited = ms.exists() && ms.data().initialized===true; }catch(e){}
      if(items.length===0 && !inited){
        const seed=window.buildInitialData?window.buildInitialData():[];
        if(seed.length) await migrate(user.uid, seed);
        items=seed;
      }
      // 초기화 표식 남기기 (기존 데이터가 있는 계정도 표식만 남기고 lps 는 건드리지 않음)
      try{ await setDoc(doc(db,'users',user.uid,'meta','state'),{initialized:true},{merge:true}); }catch(e){}
      if(window.setAccount) window.setAccount(user.email||user.displayName||'계정');
      if(window.bootApp) window.bootApp(items);
      setState('app');
    }catch(e){
      console.error(e);
      setState('auth');
      showErr('데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
    }
  });

  // ===== 인증 UI =====
  let mode='login';
  function resetInputs(){ ['#auth-email','#auth-pw','#auth-pw2'].forEach(s=>{const el=$(s);if(el)el.value='';}); }
  function setMode(m){
    mode=m;
    document.querySelectorAll('.auth-tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
    $('#auth-pw2').style.display = m==='signup'?'':'none';
    $('#auth-submit').textContent = m==='signup'?'회원가입':'로그인';
    showErr('');
  }
  document.querySelectorAll('.auth-tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));

  function mapErr(code){
    const m={
      'auth/invalid-email':'이메일 형식이 올바르지 않아요.',
      'auth/missing-password':'비밀번호를 입력해 주세요.',
      'auth/weak-password':'비밀번호는 6자 이상이어야 해요.',
      'auth/email-already-in-use':'이미 가입된 이메일이에요. 로그인해 주세요.',
      'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않아요.',
      'auth/user-not-found':'가입되지 않은 이메일이에요.',
      'auth/wrong-password':'비밀번호가 올바르지 않아요.',
      'auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 시도해 주세요.',
      'auth/network-request-failed':'네트워크 연결을 확인해 주세요.',
      'auth/operation-not-allowed':'이 로그인 방식이 콘솔에서 켜져 있지 않아요. (Authentication → Sign-in method)',
      'auth/unauthorized-domain':'이 도메인이 인증에 등록되지 않았어요. (콘솔 → Authentication → 설정 → 승인된 도메인)'
    };
    return m[code]||('오류가 발생했어요. ('+code+')');
  }
  async function submit(){
    const email=$('#auth-email').value.trim();
    const pw=$('#auth-pw').value;
    showErr(''); const btn=$('#auth-submit'); btn.disabled=true;
    try{
      if(mode==='signup'){
        if(pw!==$('#auth-pw2').value){ showErr('비밀번호가 서로 달라요.'); btn.disabled=false; return; }
        await createUserWithEmailAndPassword(auth,email,pw);
      }else{
        await signInWithEmailAndPassword(auth,email,pw);
      }
    }catch(e){ showErr(mapErr(e.code)); }
    btn.disabled=false;
  }
  $('#auth-submit').onclick=submit;
  $('#auth-pw').addEventListener('keydown',e=>{ if(e.key==='Enter'&&mode==='login')submit(); });
  $('#auth-pw2').addEventListener('keydown',e=>{ if(e.key==='Enter')submit(); });
  // 리다이렉트 로그인으로 돌아왔을 때 결과/에러 처리 (구글 에러 메시지를 그대로 표면화)
  getRedirectResult(auth).catch(e=>{ if(e&&e.code) showErr(mapErr(e.code)); });
  const _isMobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const _isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  async function googleNative(){
    // 앱(WebView)에서는 네이티브 구글 로그인 플러그인으로 인증 → Firebase 자격증명으로 로그인
    const GA = window.Capacitor.Plugins.GoogleAuth;
    await GA.initialize({
      clientId: '1032038131088-pgv6aiv1b66njk867s2q4l8kq34aucee.apps.googleusercontent.com',
      scopes: ['profile','email'],
      grantOfflineAccess: false
    });
    const res = await GA.signIn();
    const idToken = res && res.authentication && res.authentication.idToken;
    if(!idToken) throw {code:'auth/no-id-token'};
    await signInWithCredential(auth, GoogleAuthProvider.credential(idToken));
  }
  $('#auth-google').onclick=async()=>{
    showErr('');
    const provider=new GoogleAuthProvider();
    try{
      if(_isNative){ await googleNative(); return; }
      // 팝업 우선: 모바일에서 리다이렉트는 인증도메인↔앱도메인이 달라(서드파티 쿠키 차단)
      // 복귀 시 상태를 잃고 로그인화면으로 튕기므로, 사용자 클릭(제스처) 기반 팝업을 사용.
      // 팝업이 막히면 아래 catch에서 리다이렉트로 폴백한다.
      await signInWithPopup(auth,provider);
    }catch(e){
      // 팝업이 차단되면 리다이렉트로 폴백
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
        try{ await signInWithRedirect(auth,provider); return; }catch(e2){ showErr(mapErr(e2.code)); return; }
      }
      if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'&&String(e&&e.code||'').indexOf('popup_closed')<0) showErr(mapErr(e&&e.code));
    }
  };

  // ===== 계정 메뉴 =====
  const acctBtn=$('#acct-btn'), acctMenu=$('#acct-menu');
  if(acctBtn) acctBtn.onclick=e=>{ e.stopPropagation(); acctMenu.classList.toggle('show'); };
  document.addEventListener('click',()=>{ if(acctMenu) acctMenu.classList.remove('show'); });
  const lo=$('#acct-logout'); if(lo) lo.onclick=()=>{ acctMenu.classList.remove('show'); signOut(auth); };
}
</script>
</body>
