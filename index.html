<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LP 보관함</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0d11">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LP 보관함">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0d11;
  --bg2:#16141b;
  --card:#1b1922;
  --card2:#221f2b;
  --line:#2c2935;
  --txt:#f3eef7;
  --muted:#9d96aa;
  --dim:#6a6478;
  --accent:#e8643c;
  --accent2:#f2a444;
  --green:#5ec27e;
  --red:#e85c6a;
  --blue:#6aa0e8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Noto Sans KR',sans-serif;overscroll-behavior:none}
body{padding-bottom:90px;max-width:560px;margin:0 auto;position:relative;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(900px 500px at 80% -10%, rgba(232,100,60,.14), transparent 60%),
  radial-gradient(700px 500px at 0% 100%, rgba(106,160,232,.10), transparent 55%);
  pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}

/* Header */
header{padding:30px 20px 16px;position:relative}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:46px;line-height:.95;letter-spacing:-.02em;text-transform:uppercase}
h1 .em{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:12px;font-weight:500}
.sub b{color:var(--txt);font-weight:700}
.sub .sep{color:var(--dim);margin:0 7px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:6px 20px 16px}
.stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px 15px;position:relative;overflow:hidden}
.stat .lab{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.stat .val{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:25px;margin-top:5px;letter-spacing:-.02em}
.stat .val.sm{font-size:21px}
.stat.pos .val{color:var(--green)}
.stat .deco{position:absolute;right:-8px;bottom:-10px;font-size:54px;opacity:.07;font-family:'Bricolage Grotesque'}

/* Cover Flow */
.cf-wrap{padding:10px 0 4px;margin-bottom:6px}
.cf-stage{position:relative;height:240px;overflow:hidden;touch-action:pan-y;cursor:grab;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.18));perspective:1100px;user-select:none}
.cf-stage:active{cursor:grabbing}
.cf-stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:46%;
  background:linear-gradient(180deg,transparent,rgba(14,13,17,.85));pointer-events:none}
.cf-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);background:rgba(20,18,26,.45);backdrop-filter:blur(8px);
  color:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,transform .15s;padding:0}
.cf-nav svg{width:20px;height:20px}
.cf-nav:hover{background:rgba(232,100,60,.6);color:#fff}
.cf-nav:active{transform:translateY(-50%) scale(.88)}
.cf-nav.prev{left:14px}
.cf-nav.next{right:14px}
.cf-track{position:absolute;left:50%;top:30px;width:0;height:0;transform-style:preserve-3d}
.cf-card{position:absolute;width:150px;height:150px;left:-75px;top:0;will-change:transform;transition:transform .35s cubic-bezier(.22,1,.36,1);transform-origin:center center}
.cf-card .cf-art{position:relative;width:100%;height:100%;border-radius:5px;overflow:hidden;background:#26222e;box-shadow:0 18px 30px rgba(0,0,0,.55)}
.cf-card .cf-art img{width:100%;height:100%;object-fit:cover;display:block}
.cf-card .cf-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;background:linear-gradient(135deg,#efeae3,#dcd6cc);color:#8a847c;font-size:10px;text-align:center;padding:0 8px}
.cf-card .cf-ph .v{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#888 18%,#444 19%,#666 26%,#333 34%,#555 42%)}
/* reflection */
.cf-card .cf-art::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.28),transparent 40%);pointer-events:none}
.cf-info{text-align:center;padding:10px 20px 2px;min-height:46px}
.cf-info h3{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;line-height:1.15;letter-spacing:-.01em}
.cf-info p{color:var(--accent2);font-size:12.5px;font-weight:600;margin-top:2px}
.cf-info .tap{color:var(--dim);font-size:10.5px;margin-top:4px}
.stars{display:inline-flex;gap:2px;margin:4px 0 2px;font-size:14px;line-height:1}
.stars .star{position:relative;color:#46414f;display:inline-block}
.stars .star .sfill{position:absolute;left:0;top:0;overflow:hidden;color:#f2b84a;white-space:nowrap}
.stars.edit .star{cursor:pointer;font-size:30px}
.stars.edit .star.big{padding:0 1px}
.stars.edit .hit{position:absolute;top:0;height:100%;width:50%;cursor:pointer;z-index:2}
.stars.edit .hit.half{left:0}
.stars.edit .hit.full{right:0}

/* Toolbar */
.toolbar{padding:4px 20px 14px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.search svg{flex:none}
.search input{background:none;border:none;outline:none;color:var(--txt);font-size:15px;width:100%;font-family:inherit}
.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:100px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#160d09}
.subchips{margin-top:-4px}
.chip.sm{padding:6px 13px;font-size:12px;background:transparent;border-color:var(--line);color:var(--dim)}
.chip.sm.on{background:rgba(232,100,60,.18);border-color:var(--accent);color:var(--accent2)}
.count{font-size:12px;color:var(--dim)}
.countrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 20px 12px}
.ctrls{display:flex;gap:7px;align-items:center}
.viewtoggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewtoggle .vt{background:none;border:none;color:var(--dim);padding:6px 8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.viewtoggle .vt.on{background:var(--accent);color:#160d09}
.sortsel{background:var(--card);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;padding:7px 10px;border-radius:10px;outline:none;cursor:pointer}
.sortsel:focus{border-color:var(--accent)}
.count b{color:var(--muted)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 20px}
/* list view */
.grid.list{grid-template-columns:1fr;gap:10px}
.grid.list .lp{display:flex;align-items:center;gap:13px;padding:10px;border-radius:14px}
.grid.list .artwrap{flex:0 0 auto;width:60px;aspect-ratio:1;border-radius:8px;overflow:hidden}
.grid.list .disc{display:none}
.grid.list .art{position:static;width:100%;height:100%;transform:none;border-radius:8px;box-shadow:none}
.grid.list .meta{flex:1;min-width:0;padding:0;margin-top:0;background:none}
.grid.list .meta .al{min-height:0;-webkit-line-clamp:1}
.grid.list .metabtm{margin-top:5px}
.lp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s;animation:rise .5s both}
/* single continuous glow spanning the disc area down through the title, so the whole card reads as one piece */
.lp::before{content:'';position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:150%;height:62%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%, rgba(255,255,255,.13) 0%, rgba(255,255,255,.08) 32%, rgba(255,255,255,.04) 50%, rgba(255,255,255,.02) 66%, rgba(255,255,255,0) 80%);
  z-index:0;pointer-events:none}
.lp .artwrap,.lp .meta{position:relative;z-index:1}
.lp:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* artwrap = sleeve; the vinyl disc peeks out below the jacket */
.artwrap{position:relative;aspect-ratio:1/1.3;overflow:hidden;background:transparent}
/* LP disc peeks out below the bottom edge of the square jacket */
.disc{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:118%;height:118%;aspect-ratio:1;border-radius:50%;
  background:
    conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,.08) 0deg, rgba(255,255,255,0) 30deg,
      rgba(0,0,0,.2) 70deg, rgba(255,255,255,0) 110deg,
      rgba(255,255,255,.1) 150deg, rgba(255,255,255,0) 190deg,
      rgba(0,0,0,.2) 250deg, rgba(255,255,255,0) 290deg,
      rgba(255,255,255,.08) 330deg, rgba(255,255,255,.08) 360deg),
    repeating-radial-gradient(circle at 50% 50%,
      rgba(0,0,0,.05) 0 1.2px, rgba(255,255,255,.015) 1.2px 2.4px),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.12) 0%, rgba(255,255,255,.03) 32%, rgba(255,255,255,0) 50%, rgba(0,0,0,.22) 100%),
    var(--disc,#1a1a1a);
  background-blend-mode: screen, multiply, normal, normal;
  box-shadow:inset 0 0 16px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.15), 0 4px 9px rgba(0,0,0,.5);z-index:1;
  transition:transform .55s cubic-bezier(.25,.8,.3,1), width .55s cubic-bezier(.25,.8,.3,1), height .55s cubic-bezier(.25,.8,.3,1), top .55s cubic-bezier(.25,.8,.3,1), bottom .55s cubic-bezier(.25,.8,.3,1), box-shadow .4s}
/* pulled: the record slides up over the jacket so the whole disc shows; tap again to edit */
/* pulled: the record lifts onto the jacket and shows as a full, clean circle; tap again to edit */
.lp.pulled .disc{width:84%;height:auto;aspect-ratio:1;left:50%;bottom:auto;top:46%;
  transform:translate(-50%,-50%) rotate(var(--spin,0deg));z-index:5;
  box-shadow:0 14px 34px rgba(0,0,0,.65), inset 0 0 16px rgba(0,0,0,.55)}
.lp.pulled .disc.spinning{transition:box-shadow .4s}   /* no transform transition while dragging so it tracks the finger */
/* 30초 미리듣기 재생 중 자동 회전 */
@keyframes lp-discplay{to{transform:translate(-50%,-50%) rotate(360deg)}}
.lp.pulled .disc.playing{transition:box-shadow .4s;animation:lp-discplay 2.4s linear infinite}
#preview-toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(18px);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,0,0,.4)}
#preview-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lp.pulled .art{filter:brightness(.55)}
/* edit button appears only while the disc is raised */
/* small pencil button at bottom-right, appears only while the disc is raised */
.disc-edit{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(20,18,26,.85);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--txt);
  cursor:pointer;z-index:7;opacity:0;pointer-events:none;transform:scale(.7);transition:opacity .3s,transform .3s}
.lp.pulled .disc-edit{opacity:1;pointer-events:auto;transform:scale(1)}
.disc-edit:active{transform:scale(.85)}
.disc::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:25%;height:25%;border-radius:50%;
  background:var(--disc,#1a1a1a);filter:brightness(.65);
  box-shadow:0 0 0 1px rgba(0,0,0,.4), inset 0 0 6px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.1)}
/* spindle pin-hole */
.disc::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5.5%;height:5.5%;border-radius:50%;
  background:radial-gradient(circle at 40% 38%, #e6e1d8, #c8c2b6);box-shadow:0 0 0 1px rgba(0,0,0,.35), inset 0 0 2px rgba(0,0,0,.4);z-index:1}
/* album jacket: 1:1 square pinned to the top; disc peeks out below */
.art{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;background:#26222e;overflow:hidden;z-index:2;border-radius:3px;box-shadow:0 5px 14px rgba(0,0,0,.5);transition:filter .35s}
.lp.pulled .artwrap{overflow:visible}
.art img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s;background:#26222e;position:relative;z-index:1}
.art img.ld{opacity:1}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#9a948c;background:linear-gradient(135deg,#efeae3,#e3ddd4);z-index:0}
.art .ph .vinyl{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#888 18%,#444 19%,#666 26%,#333 34%,#555 42%);border:1px solid #777}
.art .ph .pn{font-size:10px;letter-spacing:.04em;text-align:center;padding:0 6px}
.cdot{position:absolute;top:8px;right:8px;width:15px;height:15px;border-radius:50%;z-index:4;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:4px 8px;border-radius:7px;backdrop-filter:blur(6px);letter-spacing:.02em;z-index:3}
.badge.sold{background:rgba(232,92,106,.9);color:#fff}
.badge.sealed{background:rgba(94,194,126,.92);color:#08130c}
.badge.gift{background:rgba(242,164,68,.92);color:#1c1304}
.meta{padding:10px 11px 12px;position:relative;z-index:3}
.meta .al{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.meta .ar{color:var(--muted);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .st{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.02em}
.st.own{background:rgba(106,160,232,.16);color:#9cc0f0;border:1px solid rgba(106,160,232,.3)}
.st.open{background:rgba(242,164,68,.16);color:#f2bf7a;border:1px solid rgba(242,164,68,.3)}
.st.seal{background:rgba(94,194,126,.16);color:#86d6a4;border:1px solid rgba(94,194,126,.32)}
.st.sold{background:rgba(232,92,106,.16);color:#f09aa4;border:1px solid rgba(232,92,106,.32)}
.st.gift{background:rgba(176,140,232,.16);color:#c3a4f0;border:1px solid rgba(176,140,232,.3)}
.st.wish{background:rgba(232,180,90,.16);color:#f0cf8a;border:1px solid rgba(232,180,90,.32)}
.metabtm{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.gtag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;background:rgba(106,160,232,.14);color:#9cc0f0;border:1px solid rgba(106,160,232,.26);--gc:106,160,232}
.gtag{background:rgba(var(--gc),.15);color:rgb(var(--gc));border-color:rgba(var(--gc),.32)}
.dt-titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.like-btn{flex:0 0 auto;background:none;border:none;color:var(--accent);font-size:26px;line-height:1;cursor:pointer;padding:0;margin-top:2px;transition:transform .12s}
.like-btn:active{transform:scale(.8)}
.like-btn.on{color:#e85c6a}
.lp .card-like{position:absolute;top:7px;right:7px;z-index:5;font-size:17px;color:#e85c6a;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
/* Pro lock card */
.pro-lock{text-align:center;padding:20px 16px;background:linear-gradient(160deg,rgba(242,164,68,.12),rgba(232,100,60,.08));border:1px solid rgba(242,164,68,.3);border-radius:16px}
.pro-badge{display:inline-block;background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06;font-weight:800;font-size:11px;letter-spacing:.08em;padding:3px 9px;border-radius:6px;margin-bottom:10px}
.pro-badge.sm{margin:0 0 0 6px;vertical-align:middle;font-size:9px;padding:2px 6px}
.pro-title{font-weight:700;font-size:15px;margin-bottom:6px}
.pro-desc{color:var(--muted);font-size:12.5px;line-height:1.6;margin-bottom:14px}
.pro-demo{display:block;width:100%;margin-top:8px;background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer;font-family:inherit}
/* vinyl decorate */
.vd-preview{display:flex;justify-content:center;padding:14px 0 18px}
.vd-preview .disc{position:relative;width:120px;height:120px;border-radius:50%;
  background:
    conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.08) 0deg,rgba(255,255,255,0) 30deg,rgba(0,0,0,.2) 70deg,rgba(255,255,255,0) 110deg,rgba(255,255,255,.1) 150deg,rgba(255,255,255,0) 190deg,rgba(0,0,0,.2) 250deg,rgba(255,255,255,0) 290deg,rgba(255,255,255,.08) 330deg,rgba(255,255,255,.08) 360deg),
    repeating-radial-gradient(circle at center,rgba(0,0,0,.04) 0 1px,rgba(255,255,255,.01) 1px 2px),
    radial-gradient(circle at 40% 35%,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 40%,rgba(0,0,0,.25) 100%),
    var(--disc,#1a1a1a);
  background-blend-mode:screen,multiply,normal,normal;
  box-shadow:inset 0 0 16px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.15),0 4px 12px rgba(0,0,0,.5)}
.vd-preview .disc::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:25%;height:25%;border-radius:50%;background:var(--disc,#1a1a1a);filter:brightness(.65);box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 6px rgba(0,0,0,.5)}
.vd-preview .disc::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6%;height:6%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#e6e1d8,#c8c2b6)}
.vd-range{width:100%;accent-color:var(--accent)}
/* disc with a custom photo: hide the synthetic gradient so the photo shows */
.disc.has-photo{background-blend-mode:normal;box-shadow:inset 0 0 16px rgba(0,0,0,.5),0 4px 9px rgba(0,0,0,.5)}
.disc.has-photo::after{background:rgba(0,0,0,.4);filter:none}
/* vinyl decorate tabs */
.vd-tabs{display:flex;gap:8px;margin:4px 0 12px}
.vd-tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.vd-tab.on{background:var(--accent);border-color:var(--accent);color:#160d09}
.vd-photodesc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
/* photo stage with circular vinyl guide */
.vd-stage{position:relative;width:230px;height:230px;margin:0 auto;border-radius:50%;overflow:hidden;background:#0c0b0f;touch-action:none;cursor:grab}
.vd-stage:active{cursor:grabbing}
.vd-imgwrap{position:absolute;inset:0}
.vd-imgwrap .vd-img{position:absolute;left:50%;top:50%;max-width:none;width:230px;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vd-guide{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5), inset 0 0 0 60px rgba(0,0,0,.08);
  background:
    repeating-radial-gradient(circle at center, rgba(255,255,255,.06) 0 1px, transparent 1px 7px);}
.vd-guide::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28%;height:28%;border-radius:50%;border:2px dashed rgba(255,255,255,.5)}
.vd-guide::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5%;height:5%;border-radius:50%;background:rgba(255,255,255,.7);z-index:2}
.vd-guide-label{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:rgba(255,255,255,.6);font-size:12px;pointer-events:none}

/* Bottom nav / FAB */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:rgba(14,13,17,.85);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:11px 18px calc(11px + env(safe-area-inset-bottom));z-index:40}
.nav button{background:none;border:none;color:var(--dim);font-family:inherit;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:.15s}
.nav button.on{color:var(--accent2)}
.fab{position:fixed;bottom:78px;right:max(18px,calc(50% - 262px));width:58px;height:58px;border-radius:50%;background:linear-gradient(150deg,var(--accent2),var(--accent));border:none;color:#1a0d06;font-size:30px;font-weight:300;box-shadow:0 8px 24px rgba(232,100,60,.45);z-index:45;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.9)}
.fab.wish{background:linear-gradient(150deg,#f0cf8a,#e8a23c);color:#3a2406;font-size:26px;box-shadow:0 8px 24px rgba(232,180,90,.5)}

/* Modal / sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line);z-index:55;transition:transform .3s cubic-bezier(.22,1,.36,1);padding-bottom:40px}
.sheet.show{transform:translateX(-50%) translateY(0)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:11px auto 4px;cursor:grab}
.sheet-x{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;line-height:1;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.sheet-x:active{opacity:.7}

/* Detail */
.dt-art{margin:8px 20px 0;border-radius:20px;overflow:hidden;aspect-ratio:1;background:#1a1822;position:relative}
.dt-art img{width:100%;height:100%;object-fit:cover}
.cover-btns{position:absolute;right:10px;bottom:10px;display:flex;gap:7px;z-index:3}
.cover-btn{background:rgba(14,13,17,.82);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer}
.cover-btn:active{opacity:.8}
.picker{display:none;margin-top:10px}
.picker.show{display:block}
.dt-art .picker{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(12,11,15,.94);backdrop-filter:blur(4px);overflow-y:auto;padding:14px;z-index:4}
.pk-title,.pk-load{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px;text-align:center}
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#f-cands{display:none;grid-template-columns:repeat(4,1fr);gap:7px}
#f-cands.show{display:grid}
.pk-item{cursor:pointer;border-radius:9px;overflow:hidden;border:2px solid transparent;background:var(--card);transition:.12s}
.pk-item.sel{border-color:var(--accent)}
.pk-item:active{transform:scale(.95)}
.pk-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pk-cap{font-size:9px;color:var(--muted);padding:3px 4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-manual{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dt-art .pk-manual{margin-top:14px}
.pk-up{display:block;text-align:center;background:var(--card2);border:1px dashed var(--line);border-radius:11px;padding:12px;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer}
.pk-up:active{opacity:.8}
.pk-url{display:flex;gap:7px}
.pk-url input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font-size:13px;font-family:inherit;outline:none;min-width:0}
.pk-url input:focus{border-color:var(--accent)}
.pk-url button{flex:none;background:var(--accent);border:none;color:#160d09;font-family:inherit;font-weight:700;font-size:13px;padding:0 16px;border-radius:11px;cursor:pointer}
.dt-body{padding:18px 22px 0}
.dt-body h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.01em}
.dt-body .dar{color:var(--accent2);font-size:14px;font-weight:600;margin-top:5px}
.dt-rate{margin-top:10px}
.dt-act{margin:16px 0 0}
.act-btn{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.act-btn:active{opacity:.85}
.act-btn.solid{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06;border:none;margin-top:6px}
.dt-inline{margin-top:12px}
.dt-inline:empty{margin:0}
.inl-title{font-weight:700;font-size:14px;margin-bottom:10px;color:var(--accent2)}
.dt-inline .fld{margin-bottom:11px}
.dt-inline .fld label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.dt-inline .fld input,.dt-inline .fld select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
.dt-inline .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.inl-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:11px;cursor:pointer}
.inl-check input{width:17px;height:17px;accent-color:var(--accent)}
/* color palette picker */
/* vinyl-color palette — wraps into 2-3 rows, fits on screen */
.palette{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;padding:12px;background:#14121a;border-radius:14px;border:1px solid var(--line)}
.palette .sw{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:var(--sw);background-size:cover;cursor:pointer;padding:0;position:relative;transition:transform .12s,border-color .12s,box-shadow .12s;box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.45)}
.palette .sw:active{transform:scale(.9)}
.palette .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent),0 4px 12px rgba(0,0,0,.5);transform:scale(1.08)}
.palette .sw.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-weight:800}
.palette .sw[data-label="투명"]{border:2px dashed rgba(255,255,255,.4)}
/* color field: current swatch + toggle button */
.colorfield{display:flex;align-items:center;gap:9px}
.colorfield input{flex:1}
.color-dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 2px rgba(255,255,255,.2),0 1px 3px rgba(0,0,0,.4)}
.color-toggle{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--accent2);font-size:20px;font-weight:300;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.color-toggle:active{opacity:.8}
.palette.collapsed{display:none}
.dt-rows{margin-top:18px;display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dt-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:13px 15px;font-size:13.5px}
.dt-row .k{color:var(--muted)}
.dt-row .v{font-weight:600;text-align:right;max-width:62%}
.profit-pos{color:var(--green)}.profit-neg{color:var(--red)}

/* Form */
.form{padding:6px 22px 0}
.form h2{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;margin-bottom:4px}
.form .fhint{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;letter-spacing:.02em}
.fld input,.fld select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.preview{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:14px}
.preview .pa{width:60px;height:60px;border-radius:10px;background:#26222e;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim)}
.preview .pa img{width:100%;height:100%;object-fit:cover}
.preview .pt{font-size:12.5px;color:var(--muted)}
.btnrow{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border-radius:13px;border:none;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.btn.primary{background:linear-gradient(150deg,var(--accent2),var(--accent));color:#1a0d06}
.btn.ghost{background:var(--card);color:var(--muted);border:1px solid var(--line);flex:0 0 auto;padding:14px 18px}
.btn:active{opacity:.85}
.searching{font-size:11.5px;color:var(--accent2);margin-top:6px;display:none}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}

/* views */
.view{display:none}
.view.on{display:block}
.export-note{margin:0 20px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.6}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:center;gap:18px;padding:18px 20px 8px}
.cal-title{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;min-width:130px;text-align:center}
.cal-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px;line-height:1;cursor:pointer}
.cal-nav:active{opacity:.7}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:4px 20px 12px;font-size:11px;color:var(--muted)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend .lg{width:11px;height:11px;border-radius:3px;display:inline-block}
.lg-arrive{background:#c9b48a}
.lg-buy{background:#c9b48a;opacity:.5}
.lg-sold{background:#888;filter:grayscale(1)}
.lg-open{background:#1c1c1c;border:1px solid #555;border-radius:50%!important}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 14px 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 14px;align-content:start}
.cal-dow{text-align:center;font-size:10.5px;color:var(--dim);font-weight:600;padding:4px 0}
.cal-cell{position:relative;aspect-ratio:1;border-radius:7px;background:var(--card);overflow:hidden;border:1px solid transparent}
.cal-cell.empty{background:transparent}
.cal-cell .dnum{position:absolute;top:2px;left:4px;font-size:9.5px;color:var(--dim);z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.cal-cell.today{border-color:var(--accent)}
.cal-cell .ph-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cal-cell .ph-buy{opacity:.6}
.cal-cell .ph-sold{filter:grayscale(1)}
.cal-cell .ph-cd{position:absolute;inset:14%;border-radius:50%;background:
  conic-gradient(from 0deg,rgba(255,255,255,.1),rgba(0,0,0,.2),rgba(255,255,255,.12),rgba(0,0,0,.2),rgba(255,255,255,.1)),
  radial-gradient(circle at 40% 35%,rgba(255,255,255,.15),rgba(0,0,0,.3) 70%),var(--disc,#1a1a1a);
  background-blend-mode:screen,normal,normal;box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
.cal-cell .ph-cd::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.4)}
.cal-cell .multi{position:absolute;bottom:2px;right:3px;font-size:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 3px;z-index:3}
.cal-empty{text-align:center;color:var(--dim);font-size:13px;padding:24px 20px}

/* ---------- Auth / Boot ---------- */
#boot,#auth-screen{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);
  background-image:
    radial-gradient(900px 500px at 80% -10%, rgba(232,100,60,.16), transparent 60%),
    radial-gradient(700px 500px at 0% 100%, rgba(106,160,232,.12), transparent 55%)}
body.state-boot #boot{display:flex}

body:not(.state-app) .fab,

.boot-spin{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);

  border-radius:13px;padding:14px 15px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}

.auth-err{display:none;color:#f09aa4;font-size:12.5px;margin-top:12px;line-height:1.5;
  background:rgba(232,92,106,.1);border:1px solid rgba(232,92,106,.3);border-radius:11px;padding:10px 12px}

.auth-btn{width:100%;padding:14px;border-radius:13px;border:none;font-family:inherit;
  font-weight:700;font-size:15px;cursor:pointer;margin-top:16px;display:flex;

  font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}

  font-size:13px;font-weight:600;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}

</style>

/* ---------- album art via iTunes Search API ---------- */
const pickedArt = {};            // key -> user-chosen artwork url (overrides everything)
const candCache = {};            // term -> candidate list
function cleanAlbum(a){return String(a).replace(/\(.*?\)|\[.*?\]|OST|ost/g,'').replace(/[\/].*$/,'').trim();}
function artKey(artist,album){return (artist+'|'+album).toLowerCase();}

// ---- per-source searchers (each returns [{img, artist, album, year}]) ----

// 1) iTunes (Apple) — no key, CORS-friendly
async function searchItunes(term, limit){
  const url='https://itunes.apple.com/search?media=music&entity=album&limit='+limit+'&term='+encodeURIComponent(term);
  try{const r=await fetch(url);const j=await r.json();
    return (j.results||[]).filter(x=>x.artworkUrl100).map(x=>({
      img:x.artworkUrl100.replace('100x100','600x600'),
      artist:x.artistName||'', album:x.collectionName||'',
      year:(x.releaseDate||'').slice(0,4), genre:normGenre(x.primaryGenreName), src:'iTunes'
    }));
  }catch(e){return [];}
}
// normalize iTunes genre into a short Korean label
function normGenre(g){
  if(!g) return '';
  const m={'K-Pop':'가요','Korean':'가요','J-Pop':'J-Pop','Pop':'팝','Rock':'록','Alternative':'얼터너티브',
    'R&B/Soul':'R&B/소울','Hip-Hop/Rap':'힙합','Hip Hop/Rap':'힙합','Dance':'댄스','Electronic':'일렉트로닉',
    'Jazz':'재즈','Classical':'클래식','Soundtrack':'OST','Singer/Songwriter':'싱어송라이터',
    'Folk':'포크','Country':'컨트리','World':'월드뮤직','Indie':'인디','Indie Pop':'인디팝','Metal':'메탈',
    'Blues':'블루스','Reggae':'레게','Funk':'펑크','Easy Listening':'이지리스닝','New Age':'뉴에이지'};
  return m[g]||g;
}

// 2) Deezer — no key; uses JSONP to avoid CORS
function searchDeezer(term, limit){
  return new Promise(res=>{
    const cb='dz_'+Math.random().toString(36).slice(2);
    const t=setTimeout(()=>{cleanup();res([]);},6000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=data=>{
      let out=[];
      try{ out=(data.data||[]).filter(x=>x.album&&x.album.cover_big).map(x=>({
        img:x.album.cover_big, artist:(x.artist&&x.artist.name)||'',
        album:x.album.title||'', year:'', src:'Deezer'
      }));}catch(e){}
      cleanup();res(out);
    };
    const s=document.createElement('script');
    s.onerror=()=>{cleanup();res([]);};
    s.src='https://api.deezer.com/search?limit='+limit+'&q='+encodeURIComponent(term)+'&output=jsonp&callback='+cb;
    document.body.appendChild(s);
  });
}

// 3) MusicBrainz + Cover Art Archive — no key, CORS-friendly (slower, rate-limited)
async function searchMusicBrainz(term, limit){
  try{
    const u='https://musicbrainz.org/ws/2/release-group/?fmt=json&limit='+limit+'&query='+encodeURIComponent(term);
    const r=await fetch(u,{headers:{'Accept':'application/json'}});
    const j=await r.json();
    const groups=(j['release-groups']||[]).slice(0,limit);
    const out=[];
    for(const g of groups){
      out.push({
        img:'https://coverartarchive.org/release-group/'+g.id+'/front-250',
        artist:(g['artist-credit']&&g['artist-credit'][0]&&g['artist-credit'][0].name)||'',
        album:g.title||'', year:(g['first-release-date']||'').slice(0,4), src:'MusicBrainz'
      });
    }
    return out;
  }catch(e){return [];}
}

// run one term across sources in order until enough results are found
async function searchTerm(term, limit){
  if(candCache[term]) return candCache[term];
  let out=await searchItunes(term, limit);
  if(out.length<2){ const dz=await searchDeezer(term, limit); out=out.concat(dz); }
  if(out.length===0){ const mb=await searchMusicBrainz(term, limit); out=out.concat(mb); }
  const seen={}; out=out.filter(c=>{if(seen[c.img])return false;seen[c.img]=1;return true;});
  candCache[term]=out;
  return out;
}

// gather candidates from several query forms, merged & de-duped
async function fetchCandidates(artist, album){
  const ar=(artist||'').replace(/[-]/g,'').trim();
  const al=cleanAlbum(album);
  const terms=[];
  if(ar&&al) terms.push((ar+' '+al).trim());
  if(al) terms.push(al);
  if(ar&&!al) terms.push(ar);
  let all=[];
  for(const t of terms){
    all=all.concat(await searchTerm(t,8));
    if(all.length>=4) break;   // enough good candidates, stop early
  }
  const seen={}; all=all.filter(c=>{if(seen[c.img])return false;seen[c.img]=1;return true;});
  return all;
}

// best single guess (used for first auto-load); respects a prior user pick
const genreCache={};  // artKey -> genre string
async function fetchArt(artist, album){
  const key=artKey(artist,album);
  if(pickedArt[key]!==undefined) return pickedArt[key];
  if(artCache[key]!==undefined) return artCache[key];
  const cands=await fetchCandidates(artist,album);
  const img=cands.length?cands[0].img:null;
  artCache[key]=img;
  const g=cands.find(c=>c.genre)||{}; if(g.genre) genreCache[key]=g.genre;
  return img;
}

// render swatches into a container; onPick(label) fires when a swatch is tapped
function renderPalette(containerId, inputId, onPick){
  const box=document.getElementById(containerId); if(!box) return;
  const cur=(document.getElementById(inputId)||{}).value||'';
  box.innerHTML=PALETTE.map(([label,bg])=>{
    const on = cur && cur.replace(/\s+/g,'') === label.replace(/\s+/g,'') ? ' on':'';
    return `<button type="button" class="sw${on}" data-label="${label}" title="${label}" style="--sw:${bg}"></button>`;
  }).join('');
  box.querySelectorAll('.sw').forEach(el=>el.onclick=()=>{
    const label=el.dataset.label;
    const inp=document.getElementById(inputId);
    if(inp) inp.value=label;
    renderPalette(containerId, inputId, onPick);   // re-render so the ✓ lands on the picked swatch
    if(onPick) onPick(label);
  });
}
// wire up a color field: live preview dot + "+" toggle for the palette
function setupColorField(prefix){   // prefix: 'f' or 'e'
  const inp=document.getElementById(prefix+'-color');

  const pal=document.getElementById(prefix+'-palette');

  if(!inp||!dot||!pal||!tog) return;
  const refresh=()=>{
    dot.style.background=discColor(inp.value);

  tog.onclick=()=>{ pal.classList.toggle('collapsed'); };

  if(s==='위시') return '위시';
  if(s==='도착 전'||s==='배송전') return '배송전';
  if(s==='판매'||s==='교환'||s==='선물') return '판매·교환';
  return '보유중';   // 개봉, 미개봉, 확인필요 등

const CHIPS=['전체','배송전','보유중','판매·교환','위시'];

function passes(it){
  const q=filter.q.toLowerCase();
  if(q && !(it.artist.toLowerCase().includes(q)||it.album.toLowerCase().includes(q)||(it.color||'').toLowerCase().includes(q))) return false;
  if(filter.genre && (it.genre||'')!==filter.genre) return false;
  const g=statusGroup(it.status);
  const c=filter.chip;
  if(c==='전체') return g!=='위시';        // 전체에서 위시 제외
  if(c==='보유중'){
    if(g!=='보유중') return false;
    if(filter.sub==='개봉') return it.status==='개봉';
    if(filter.sub==='미개봉') return it.status==='미개봉';
    return true;
  }
  return g===c;
}

  }

function renderGrid(){

  $('#grid').classList.toggle('list', filter.view==='list');
  let list=DATA.filter(passes);
  const cmp={
    album:(a,b)=>(a.album||'').localeCompare(b.album||'','ko'),
    artist:(a,b)=>(a.artist||'').localeCompare(b.artist||'','ko'),
    rating:(a,b)=>(b.rating||0)-(a.rating||0),
    priceHigh:(a,b)=>(b.price||0)-(a.price||0),
    priceLow:(a,b)=>(a.price||0)-(b.price||0),
  }[filter.sort];
  if(cmp) list=[...list].sort(cmp);
  $('#count').innerHTML=`<b>${list.length}</b>장 표시 중`;
  const isWish=filter.chip==='위시';
  // FAB reflects context: wish vs normal add
  const fab=$('#fab');
  if(fab){
    fab.classList.toggle('wish', isWish);
    fab.innerHTML = '+';
    fab.title = isWish ? '위시 추가' : 'LP 추가';
  }
  if(!list.length){$('#grid').innerHTML='<div class="empty" style="grid-column:1/-1">'+(isWish?'위시가 비어 있어요 — 오른쪽 아래 + 버튼으로 추가하세요':'검색 결과가 없어요')+'</div>';return;}
  $('#grid').innerHTML=list.map((it,i)=>`
    <div class="lp" data-id="${it.id}" style="animation-delay:${Math.min(i*30,400)}ms">
      <div class="artwrap">
        <div class="disc${it.discPhoto?' has-photo':''}" style="${discStyle(it)}"></div>
        <div class="art">
          <div class="ph"><div class="vinyl"></div><div class="pn">${it.artist||'?'}</div></div>
          <img data-art="${it.id}" alt="">
        </div>
        ${it.liked?'<span class="card-like">♥</span>':''}
        <button class="disc-edit" data-edit="${it.id}" aria-label="바이닐 꾸미기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      </div>
      <div class="meta">
        <div class="al">${it.album||'—'}</div>
        <div class="ar">${it.artist||'—'}</div>
        <div class="metabtm">${statusChip(it.status)}${genreTag(it.genre)}</div>
      </div>
    </div>`).join('');
  document.querySelectorAll('.lp[data-id]').forEach(el=>{
    const art=el.querySelector('.art');
    const disc=el.querySelector('.disc');
    el.onclick=()=>{
      if(el.classList.contains('pulled')){ el.classList.remove('pulled'); stopPreview(); return; }  // tap elsewhere: slide disc back
      openDetail(el.dataset.id);
    };
    if(art) art.onclick=(e)=>{
      e.stopPropagation();
      if(el.classList.contains('pulled')){ el.classList.remove('pulled'); stopPreview(); return; }   // cover tap closes the pulled disc
      openDetail(el.dataset.id,'cover');
    };
    if(disc){
      const it = DATA.find(d=>d.id===el.dataset.id);
      let spin=0, dragging=false, moved=false, lastAng=0, cx=0, cy=0;
      const angle=(x,y)=>Math.atan2(y-cy, x-cx)*180/Math.PI;
      const down=(x,y)=>{
        if(!el.classList.contains('pulled')) return;   // only spin when raised
        const r=disc.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2;
        dragging=true; moved=false; lastAng=angle(x,y);
        disc.classList.add('spinning');
        if(it) _fetchPreviewUrl(it);   // 회전 시작에 대비해 미리듣기 URL 미리 받아두기
      };
      const move=(x,y)=>{
        if(!dragging) return;
        let a=angle(x,y), d=a-lastAng;
        if(d>180) d-=360; if(d<-180) d+=360;   // wrap
        if(Math.abs(d)>1.5 && !moved){ moved=true; if(it) playPreview(it, disc); }   // 드래그로 회전 시작 → 미리듣기 재생
        spin+=d; lastAng=a;
        disc.style.setProperty('--spin', spin+'deg');
      };
      const up=()=>{ if(!dragging)return; dragging=false; disc.classList.remove('spinning');
        if(_preview.audio && _preview.discEl===disc) disc.classList.add('playing'); };   // 손 떼면 음악에 맞춰 계속 회전
      disc.addEventListener('mousedown',e=>{ down(e.clientX,e.clientY);
        const mm=ev=>move(ev.clientX,ev.clientY), mu=()=>{up();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
        window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu); });
      disc.addEventListener('touchstart',e=>down(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
      disc.addEventListener('touchmove',e=>{ if(dragging){e.preventDefault();} move(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
      disc.addEventListener('touchend',up);
      disc.onclick=(e)=>{
        e.stopPropagation();
        if(moved){ moved=false; return; }   // was a spin, not a tap
        const willPull = !el.classList.contains('pulled');
        el.classList.toggle('pulled');       // tap to raise / slide back
        if(!willPull) stopPreview();         // 판을 내리면 미리듣기 정지
      };
    }
    const editBtn=el.querySelector('.disc-edit');
    if(editBtn) editBtn.onclick=(e)=>{ e.stopPropagation(); openDetail(el.dataset.id,'vinyl'); };
  });
  // lazy-load covers as cards scroll into view (prevents request flooding that left lower cards blank)
  if(window._artObs) window._artObs.disconnect();
  const byId={}; list.forEach(it=>byId[it.id]=it);
  window._artObs=new IntersectionObserver((ents,obs)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ const id=e.target.dataset.id; if(byId[id])loadArt(byId[id]); obs.unobserve(e.target);} });
  },{rootMargin:'300px'});
  document.querySelectorAll('.lp[data-id]').forEach(el=>window._artObs.observe(el));
}

/* ---------- 30초 미리듣기 (iTunes previewUrl) ---------- */
const _preview = { audio:null, id:null, discEl:null, cache:{} };
async function _fetchPreviewUrl(it){
  if(_preview.cache[it.id]!==undefined) return _preview.cache[it.id];
  const term = ((it.artist||'')+' '+(it.album||'')).trim();
  let url = null;
  if(term){
    try{
      const r = await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=1&term='+encodeURIComponent(term));
      const j = await r.json();
      if(j.results && j.results[0] && j.results[0].previewUrl) url = j.results[0].previewUrl;
    }catch(e){}
  }
  _preview.cache[it.id] = url;
  return url;
}
function stopPreview(){
  if(_preview.audio){ try{_preview.audio.pause();}catch(e){} _preview.audio=null; }
  if(_preview.discEl){ _preview.discEl.classList.remove('playing'); _preview.discEl=null; }
  _preview.id=null;
}
async function playPreview(it, disc){
  if(!it) return;
  if(_preview.id===it.id) return;        // 이미 이 판이 재생 중이면 그대로 둠
  stopPreview();
  _preview.id = it.id;
  let url = _preview.cache[it.id];
  if(url===undefined) url = await _fetchPreviewUrl(it);
  if(_preview.id!==it.id) return;        // 기다리는 사이 다른 판을 돌렸으면 취소
  if(!url){ previewToast('🔇 미리듣기를 찾지 못했어요'); _preview.id=null; return; }
  const a = new Audio(url); a.preload='auto';
  _preview.audio=a; _preview.discEl=disc;
  a.onended=()=>stopPreview();
  a.onerror=()=>{ previewToast('재생할 수 없어요'); stopPreview(); };
  // 손가락으로 돌리는 중(spinning)이 아니면 음악에 맞춰 자동 회전 시작
  a.play().then(()=>{ if(_preview.discEl===disc && !disc.classList.contains('spinning')) disc.classList.add('playing'); })
          .catch(()=>{});
}
function previewToast(msg){
  let t=document.getElementById('preview-toast');
  if(!t){ t=document.createElement('div'); t.id='preview-toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(previewToast._t); previewToast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

async function loadArt(it){
  const img=document.querySelector(`img[data-art="${it.id}"]`);
  if(!img||img.dataset.done) return;
  img.dataset.done='1';
  const key=artKey(it.artist,it.album);
  const url = it._art || pickedArt[key] || await fetchArt(it.artist,it.album);
  // auto-fill genre if we learned it during the search
  if(!it.genre && genreCache[key]){ it.genre=genreCache[key]; saveGenre(it); refreshGenreChips(); }
  if(!url){ img.dataset.done=''; return; }   // no art found; keep placeholder, allow later retry
  it._art=url;
  const ph=img.parentElement.querySelector('.ph');
  const reveal=()=>{ img.classList.add('ld'); if(ph) ph.style.display='none'; img.dataset.shown='1'; };
  img.onload=reveal;
  // if it fails, just keep showing the placeholder — never wipe an image that already displayed
  img.onerror=()=>{ if(!img.dataset.shown){ img.dataset.done=''; } };
  img.src=url;
  if(img.complete && img.naturalWidth>0) reveal();     // already cached
}

  let vimg=null, vx=0, vy=0, vscale=1, baseW=0, baseH=0;
  function renderImg(){
    if(!vimg) return;
    imgwrap.innerHTML='';
    const im=document.createElement('img');
    im.src=vimg; im.className='vd-img';
    im.style.transform=`translate(-50%,-50%) translate(${vx}px,${vy}px) scale(${vscale})`;
    imgwrap.appendChild(im);
    imgwrap._im=im;
  }
  function place(){
    const im=imgwrap._im; if(!im)return;
    im.style.transform=`translate(-50%,-50%) translate(${vx}px,${vy}px) scale(${vscale})`;
  }
  $('#vd-file').onchange=async e=>{

      $('#vd-zoomlab').textContent='100%';
      $('#vd-guide-label').style.display='none';
      $('#vd-photo-save').disabled=false;
      renderImg();
    }catch(err){ alert('이미지를 불러오지 못했어요'); }
  };
  zoom.oninput=()=>{ vscale=zoom.value/100; $('#vd-zoomlab').textContent=zoom.value+'%'; place(); };
  // drag (1 finger) + pinch-zoom (2 fingers)
  let drag=false,sx=0,sy=0,ox=0,oy=0;
  let pinch=false,pinchD0=0,pinchScale0=1;
  const dStart=(x,y)=>{ if(!vimg)return; drag=true;sx=x;sy=y;ox=vx;oy=vy; };
  const dMove=(x,y)=>{ if(!drag)return; vx=ox+(x-sx); vy=oy+(y-sy); place(); };
  const dEnd=()=>{ drag=false; };
  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  stage.addEventListener('touchstart',e=>{
    if(!vimg) return;
    if(e.touches.length>=2){ pinch=true; drag=false; pinchD0=dist(e.touches); pinchScale0=vscale; }
    else dStart(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(!vimg) return;
    if(pinch && e.touches.length>=2){
      e.preventDefault();
      const ratio=dist(e.touches)/(pinchD0||1);
      vscale=Math.min(2.5, Math.max(0.5, pinchScale0*ratio));
      zoom.value=Math.round(vscale*100); $('#vd-zoomlab').textContent=Math.round(vscale*100)+'%';
      place();
    } else if(drag){ e.preventDefault(); dMove(e.touches[0].clientX,e.touches[0].clientY); }
  },{passive:false});
  stage.addEventListener('touchend',e=>{ if(e.touches.length<2){ pinch=false; } if(e.touches.length===0){ dEnd(); } });
  stage.addEventListener('mousedown',e=>{ dStart(e.clientX,e.clientY);
    const mm=ev=>dMove(ev.clientX,ev.clientY), mu=()=>{dEnd();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu); });
  // wheel zoom on desktop
  stage.addEventListener('wheel',e=>{ if(!vimg)return; e.preventDefault();
    vscale=Math.min(2.5,Math.max(0.5, vscale*(e.deltaY<0?1.06:0.94)));
    zoom.value=Math.round(vscale*100); $('#vd-zoomlab').textContent=Math.round(vscale*100)+'%'; place();
  },{passive:false});
  // if already has a photo, preload it
  if(it.discPhoto){ vimg=it.discPhoto; zoom.disabled=false; $('#vd-photo-save').disabled=false; $('#vd-guide-label').style.display='none'; renderImg(); }

  $('#vd-photo-save').onclick=async ()=>{

    it.discPhoto=url;

    persistFull(it);
    hide('detail');
    renderGrid();buildCoverFlow();
  };
  $('#vd-photo-reset').onclick=()=>{
    it.discPhoto=null; persistFull(it);
    hide('detail'); renderGrid();buildCoverFlow();
  };
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
// normalize a CSS color (hex or rgb) to #rrggbb for <input type=color>
function toHex(c){
  if(!c) return '#1a1a1a';
  if(c[0]==='#'){ return c.length===4 ? '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3] : c.slice(0,7); }
  const m=c.match(/\d+/g); if(!m) return '#1a1a1a';
  return '#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');
}
// crop the visible square stage region to a circular vinyl image
function cropToVinyl(imgEl, stageEl){
  return new Promise((res)=>{
    const rect=stageEl.getBoundingClientRect();
    const S=300;                         // output size (smaller = less storage)
    const scale=S/rect.width;            // stage px -> canvas px
    const c=document.createElement('canvas'); c.width=S; c.height=S;
    const ctx=c.getContext('2d');
    // circular clip
    ctx.save();
    ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.clip();
    // draw the image as currently positioned within the stage
    const ir=imgEl.getBoundingClientRect();
    const dx=(ir.left-rect.left)*scale, dy=(ir.top-rect.top)*scale;
    const dw=ir.width*scale, dh=ir.height*scale;
    ctx.drawImage(imgEl, dx, dy, dw, dh);
    ctx.restore();
    // subtle vinyl sheen + center label on top so it still reads as a record
    const g=ctx.createRadialGradient(S*0.4,S*0.35,0,S/2,S/2,S/2);
    g.addColorStop(0,'rgba(255,255,255,.12)'); g.addColorStop(.4,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,.25)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(S/2,S/2,S/2,0,Math.PI*2); ctx.fill();
    // center label hole
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(S/2,S/2,S*0.12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#d8d3cb'; ctx.beginPath(); ctx.arc(S/2,S/2,S*0.025,0,Math.PI*2); ctx.fill();
    res(c.toDataURL('image/jpeg',0.85));
  });
}

// downscale an uploaded image to keep localStorage small, return dataURL
function fileToDataURL(file, max=600){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let{width:w,height:h}=im;
        const sc=Math.min(1,max/Math.max(w,h));
        const c=document.createElement('canvas');
        c.width=Math.round(w*sc);c.height=Math.round(h*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.85));
      };
      im.onerror=rej; im.src=r.result;
    };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

// swipe-down to dismiss (drag from the grab handle / top area)
function enableSwipeClose(name){
  const sheet=$('#sheet-'+name);
  const handle=$('#grab-'+name);
  let y0=null,dy=0,drag=false;
  const startY=y=>{ if(sheet.scrollTop>2)return; drag=true;y0=y;dy=0;sheet.style.transition='none'; };
  const moveY=y=>{ if(!drag)return; dy=y-y0; if(dy<0)dy=0;
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`; };
  const endY=()=>{ if(!drag)return; drag=false; sheet.style.transition='';
    if(dy>110){ sheet.style.transform=`translateX(-50%) translateY(100%)`; setTimeout(()=>hide(name),200); }
    else sheet.style.transform=''; };
  // dragging anywhere on the handle, or on the sheet when scrolled to top
  [handle,sheet].forEach(el=>{
    el.addEventListener('touchstart',e=>startY(e.touches[0].clientY),{passive:true});
    el.addEventListener('touchmove',e=>{ if(drag&&dy>0)e.preventDefault(); moveY(e.touches[0].clientY); },{passive:false});
    el.addEventListener('touchend',endY);
  });
  // mouse (desktop) on handle only
  handle.addEventListener('mousedown',e=>{startY(e.clientY);
    const mm=ev=>moveY(ev.clientY), mu=()=>{endY();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
    window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);});
}

function loadLocal(){
  try{
    const picks=JSON.parse(localStorage.getItem('lp_picks')||'{}');
    Object.assign(pickedArt,picks);
    Object.keys(picks).forEach(k=>artCache[k]=picks[k]);
    Object.assign(ratings, JSON.parse(localStorage.getItem('lp_ratings')||'{}'));
    Object.assign(genres, JSON.parse(localStorage.getItem('lp_genres')||'{}'));
    Object.assign(likes, JSON.parse(localStorage.getItem('lp_likes')||'{}'));
    Object.assign(seedEdits, JSON.parse(localStorage.getItem('lp_seededits')||'{}'));
    const ext=JSON.parse(localStorage.getItem('lp_added')||'[]');
    if(ext.length){DATA=[...ext,...DATA];ext.forEach(it=>{if(it._art)artCache[artKey(it.artist,it.album)]=it._art;});}
    // apply chosen covers + saved ratings + genres + seed edits to seed items
    DATA.forEach(it=>{
      const k=artKey(it.artist,it.album);if(pickedArt[k])it._art=pickedArt[k];
      if(it.rating==null){ const rk=ratingKey(it); if(ratings[rk]!=null) it.rating=ratings[rk]; }
      if(!it.genre){ const rk=ratingKey(it); if(genres[rk]) it.genre=genres[rk]; }
      { const rk=ratingKey(it); if(it.liked==null && likes[rk]!=null) it.liked=likes[rk]; }
      if(seedEdits[it.id]) Object.assign(it, seedEdits[it.id]);
    });
  }catch(e){}
}

/* ---------- calendar ---------- */
let calYear, calMonth;   // current view (month is 0-based)
function artFor(it){ return it._art || pickedArt[artKey(it.artist,it.album)] || artCache[artKey(it.artist,it.album)] || null; }
// collect date-events: {date:'YYYY-MM-DD', kind:'arrive'|'buy'|'sold'|'open', it}
function calEvents(){
  const ev=[];
  DATA.forEach(it=>{
    if(statusGroup(it.status)==='위시') return;
    const g=statusGroup(it.status);
    // 판매일 → 흑백
    if(it.status==='판매' && it.sellDate) ev.push({date:it.sellDate, kind:'sold', it});
    // 도착일 → 원본 (도착했으면 구매일은 생략, 도착이 대표)
    if(it.arrive) ev.push({date:it.arrive, kind:'arrive', it});
    // 구매일: 도착 전(배송중)이면 투명 60%, 도착일이 없을 때만 구매일로 표기
    if(it.buy && !it.arrive){
      ev.push({date:it.buy, kind: g==='배송전' ? 'buy' : 'arrive', it});
    }
    // 개봉 → CD판 (개봉 상태인 항목을, 도착일 기준으로 'open' 마킹)
    if(it.status==='개봉'){
      const od=it.arrive||it.buy;
      if(od) ev.push({date:od, kind:'open', it});
    }
  });
  return ev;
}
function renderCal(){
  const now=new Date();
  if(calYear==null){ calYear=now.getFullYear(); calMonth=now.getMonth(); }
  const first=new Date(calYear, calMonth, 1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear, calMonth+1, 0).getDate();
  $('#cal-title').textContent=`${calYear}년 ${calMonth+1}월`;
  // index events for this month by day
  const ev=calEvents().filter(e=>{ const d=new Date(e.date); return d.getFullYear()===calYear && d.getMonth()===calMonth; });
  const byDay={};
  ev.forEach(e=>{ const day=new Date(e.date).getDate(); (byDay[day]=byDay[day]||[]).push(e); });
  const dows=['일','월','화','수','목','금','토'];
  $('#cal-dows').innerHTML=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let html='';
  const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const items=byDay[d]||[];
    const isToday = dateStr===todayStr;
    let inner='';
    if(items.length){
      // priority for the visible tile: open(CD) > sold > arrive > buy
      const order={open:0,sold:1,arrive:2,buy:3};
      const top=[...items].sort((a,b)=>order[a.kind]-order[b.kind])[0];
      const art=artFor(top.it);
      if(top.kind==='open'){
        inner=`<div class="ph-cd" style="--disc:${discColor(top.it.color)}"></div>`;
      } else if(art){
        const cls = top.kind==='buy'?'ph-buy' : top.kind==='sold'?'ph-sold' : '';
        inner=`<img class="ph-img ${cls}" src="${art}" alt="">`;
      } else {
        const cls = top.kind==='buy'?'ph-buy':top.kind==='sold'?'ph-sold':'';
        inner=`<div class="ph-img ${cls}" style="background:${discColor(top.it.color)};opacity:${top.kind==='buy'?.6:1}"></div>`;
      }
      if(items.length>1) inner+=`<span class="multi">+${items.length-1}</span>`;
    }
    html+=`<div class="cal-cell ${isToday?'today':''}" data-date="${dateStr}" ${d===1?`style="grid-column-start:${startDow+1}"`:''}>${inner}<span class="dnum">${d}</span></div>`;
  }
  $('#cal-grid').innerHTML=html;
  $('#cal-empty').textContent = ev.length ? '' : '이 달엔 기록이 없어요';
  // tap a day with events -> open the first item's detail
  $('#cal-grid').querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
    const items=byDay[+cell.dataset.date.slice(-2)]||[];
    if(items.length) cell.onclick=()=>openDetail(items[0].it.id);
  });
}

function renderStats(){

  const owned=DATA.filter(d=>statusGroup(d.status)==='보유중');

  const soldExch=DATA.filter(d=>statusGroup(d.status)==='판매·교환');
  const ship=DATA.filter(d=>statusGroup(d.status)==='배송전').length;
  const opened=DATA.filter(d=>d.status==='개봉').length;
  const sealed=DATA.filter(d=>d.status==='미개봉').length;
  const wish=DATA.filter(d=>statusGroup(d.status)==='위시').length;
  const totalBuy=real.reduce((s,d)=>s+(d.price||0),0);                 // 총 구매가(위시 제외)
  const totalSell=sold.reduce((s,d)=>s+(d.sellPrice||0),0);            // 총 판매가
  const profit=sold.reduce((s,d)=>s+(d.profit||0),0);                  // 총 판매 차익
  $('#stats2').innerHTML=`
    <div class="stat"><div class="lab">보유 중</div><div class="val">${owned.length}<span style="font-size:14px;color:var(--muted)">장</span></div><div class="deco">♪</div></div>
    <div class="stat"><div class="lab">판매·교환</div><div class="val">${soldExch.length}<span style="font-size:14px;color:var(--muted)">장</span></div><div class="deco">↻</div></div>
    <div class="stat"><div class="lab">총 구매가</div><div class="val sm">${won(totalBuy)}</div></div>
    <div class="stat"><div class="lab">총 판매가</div><div class="val sm">${won(totalSell)}</div></div>
    <div class="stat ${profit>=0?'pos':''}" style="grid-column:1/-1"><div class="lab">총 판매 차익</div><div class="val sm">${profit>=0?'+':''}${won(profit)}</div></div>`;
  $('#hsub').innerHTML=`총 <b>${real.length}</b>장<span class="sep">·</span>보유 <b>${owned.length}</b><span class="sep">·</span>개봉 <b>${opened}</b><span class="sep">·</span>미개봉 <b>${sealed}</b>`;

  // color breakdown
  const byColor={};DATA.forEach(d=>{const c=(d.color||'기타').split(' ')[0];byColor[c]=(byColor[c]||0)+1;});
  const top=Object.entries(byColor).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const byStore={};DATA.forEach(d=>{if(d.store){byStore[d.store]=(byStore[d.store]||0)+1;}});
  const tStore=Object.entries(byStore).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // rating breakdown (only albums that have a rating)
  const rated=DATA.filter(d=>d.rating>0);
  const avg = rated.length ? (rated.reduce((s,d)=>s+d.rating,0)/rated.length) : 0;
  // buckets from 5.0 down to 0.5
  const buckets=[];
  for(let v=5; v>=0.5; v-=0.5){
    const items=rated.filter(d=>d.rating===v);
    if(items.length) buckets.push([v,items]);
  }
  const ratingHTML = rated.length ? `
    <div style="font-weight:700;color:var(--txt);margin-bottom:8px">별점 통계</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">
      <span style="font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;color:var(--accent2)">${avg.toFixed(1)}</span>
      <span style="color:var(--muted);font-size:12px">평균 · 평가한 앨범 ${rated.length}장</span>
    </div>
    ${buckets.map(([v,items],bi)=>`
      <div style="margin:8px 0">
        <div onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'" style="display:flex;align-items:center;gap:8px;margin-bottom:3px;cursor:pointer">
          <span style="color:#f2b84a;font-size:12px;min-width:42px">${'★'.repeat(Math.floor(v))}${v%1?'½':''}</span>
          <span style="flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(items.length/rated.length*100)}%;background:linear-gradient(90deg,var(--accent2),var(--accent))"></span></span>

      </div>`).join('')}
    <div style="height:1px;background:var(--line);margin:14px 0"></div>` : '';

  $('#bigstats').innerHTML=ratingHTML+`
    <div style="font-weight:700;color:var(--txt);margin-bottom:8px">컬러 분포</div>

// rebuild the genre dropdown from genres present in the collection
function refreshGenreChips(){
  const sel=$('#genre'); if(!sel) return;
  const set=new Set();
  DATA.forEach(d=>{ if(d.genre) set.add(d.genre); });
  const list=[...set].sort((a,b)=>a.localeCompare(b,'ko'));
  const cur=filter.genre;
  sel.innerHTML='<option value="">전체 장르</option>'+list.map(g=>`<option value="${g}" ${g===cur?'selected':''}>${g}</option>`).join('');
  // if current filter genre no longer exists, reset
  if(cur && !set.has(cur)){ filter.genre=''; }
}

/* ---------- Cover Flow ---------- */
let cfItems=[], cfIndex=0, cfCards=[];
function buildCoverFlow(){
  cfItems=DATA.filter(d=>{const g=statusGroup(d.status);return g==='보유중'||g==='배송전';});  // 소장/예정만
  if(!cfItems.length) cfItems=DATA.slice();
  const track=$('#cf-track');
  track.innerHTML=cfItems.map((it,i)=>`
    <div class="cf-card" data-i="${i}" data-id="${it.id}">
      <div class="cf-art">
        <div class="cf-ph"><div class="v"></div><div>${it.artist||'?'}</div></div>
        <img data-cf="${it.id}" alt="">
      </div>
    </div>`).join('');
  cfCards=[...track.querySelectorAll('.cf-card')];
  // load art for each cover-flow card (reuse cache)
  cfItems.forEach(async it=>{
    const img=track.querySelector(`img[data-cf="${it.id}"]`);
    const url=it._art||pickedArt[artKey(it.artist,it.album)]||await fetchArt(it.artist,it.album);
    if(url&&img){img.src=url;img.onload=()=>{img.previousElementSibling.style.display='none';};}
  });
  cfIndex=Math.min(cfIndex,cfItems.length-1);
  layoutCoverFlow();
  // tap center card -> detail
  cfCards.forEach(c=>c.addEventListener('click',()=>{
    const i=+c.dataset.i;
    if(i===cfIndex) openDetail(c.dataset.id);
    else { cfIndex=i; layoutCoverFlow(); }
  }));
}
function layoutCoverFlow(){
  cfCards.forEach((c,i)=>{
    const off=i-cfIndex;
    const ax=Math.abs(off);
    if(ax>4){c.style.display='none';return;} c.style.display='';
    const x=off*48;                       // horizontal shelf spacing
    const z=-ax*120;                      // depth
    const rot=off===0?0:(off<0?42:-42);   // turn side covers
    const sc=off===0?1.18:0.92;
    c.style.transform=`translateX(${x}px) translateZ(${z}px) rotateY(${rot}deg) scale(${sc})`;
    c.style.zIndex=String(100-ax);
    c.querySelector('.cf-art').style.boxShadow=off===0?'0 22px 38px rgba(0,0,0,.6)':'0 14px 22px rgba(0,0,0,.45)';
    c.querySelector('.cf-art').style.filter=off===0?'none':'brightness(.7)';
  });
  const it=cfItems[cfIndex]; if(!it)return;
  $('#cf-info').innerHTML=`<h3>${it.album||'—'}</h3>${starsView(it.rating)}<p>${it.artist||'—'}</p><div class="tap">탭하면 상세 정보 · ${it.genre?it.genre+' · ':''}${it.color||''}</div>`;
}
function cfMove(d){ cfIndex=Math.max(0,Math.min(cfItems.length-1,cfIndex+d)); layoutCoverFlow(); }

// drag / swipe / wheel
(function(){
  const stage=$('#cf-stage');
  let down=false,sx=0,acc=0,moved=false;
  const start=x=>{down=true;sx=x;acc=0;moved=false;};
  const move=x=>{ if(!down)return; const dx=x-sx; if(Math.abs(dx)>6)moved=true;
    if(Math.abs(dx)>42){ cfMove(dx<0?1:-1); sx=x; } };
  const end=()=>{down=false;};
  stage.addEventListener('mousedown',e=>start(e.clientX));
  window.addEventListener('mousemove',e=>move(e.clientX));
  window.addEventListener('mouseup',end);
  stage.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});
  stage.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});
  stage.addEventListener('touchend',end);
  stage.addEventListener('click',e=>{ if(moved){e.stopPropagation();e.preventDefault();} },true);
  let wlock=0;
  stage.addEventListener('wheel',e=>{ if(Math.abs(e.deltaX)<Math.abs(e.deltaY))return;
    e.preventDefault(); const now=Date.now(); if(now-wlock<160)return; wlock=now; cfMove(e.deltaX>0?1:-1); },{passive:false});
  $('#cf-prev').addEventListener('click',e=>{e.stopPropagation();cfMove(-1);});
  $('#cf-next').addEventListener('click',e=>{e.stopPropagation();cfMove(1);});
})();

// 데이터URL → Blob (Storage 업로드용)
function dataURLToBlob(dataURL){
  const parts=dataURL.split(','); const head=parts[0]||'';
  const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(parts[1]||''); const len=bin.length; const arr=new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

  let currentUser=null;
  const saveTimers={};

  // LP 한 장을 Firestore 문서로 직렬화 (커버는 cover 필드로 저장)
  const FIELDS=['no','artist','album','color','store','orig','price','pay','buy','arrive',
    'status','sellDate','sellPrice','profit','note','genre','rating','liked',
    'discColorCustom','discOpacity','discPhoto'];
  function serialize(it){
    const o={};
    FIELDS.forEach(f=>{ o[f]=(it[f]===undefined?null:it[f]); });
    o.cover = it._art || it.cover || null;
    return o;
  }
  function deserialize(id,d){
    const it=Object.assign({},d,{id});
    if(d.cover) it._art=d.cover;
    return it;
  }
  async function loadItems(uid){
    const snap=await getDocs(collection(db,'users',uid,'lps'));
    const out=[]; snap.forEach(s=>out.push(deserialize(s.id,s.data())));
    return out;
  }
  async function migrate(uid,items){
    for(let i=0;i<items.length;i+=400){
      const b=writeBatch(db);
      items.slice(i,i+400).forEach(it=>b.set(doc(db,'users',uid,'lps',String(it.id)),serialize(it)));
      await b.commit();
    }
  }

  // ===== 앱(classic) → 클라우드 다리 =====
  window.LPCloud={
    saveItem(it){
      if(!currentUser||!it||it.id==null) return;
      clearTimeout(saveTimers[it.id]);
      saveTimers[it.id]=setTimeout(async()=>{
        try{ await setDoc(doc(db,'users',currentUser.uid,'lps',String(it.id)),serialize(it)); }
        catch(e){ console.error('저장 실패',e); }
      },400);
    },
    async deleteItem(id){
      if(!currentUser) return;
      try{ await deleteDoc(doc(db,'users',currentUser.uid,'lps',String(id))); }catch(e){}
    },
    async uploadImage(blob,ext){
      if(!currentUser) throw new Error('not-signed-in');
      const name=Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+(ext||'jpg');
      const r=ref(storage,'users/'+currentUser.uid+'/'+name);
      await uploadBytes(r,blob);
      return await getDownloadURL(r);
    },
    logout(){ return signOut(auth); }
  };

  // ===== 로그인 상태 감지 =====
  onAuthStateChanged(auth, async user=>{
    currentUser=user;
    if(!user){ setState('auth'); showErr(''); resetInputs(); return; }
    setState('boot');
    try{
      let items=await loadItems(user.uid);
      if(items.length===0){
        const seed=window.buildInitialData?window.buildInitialData():[];
        await migrate(user.uid, seed);
        items=seed;
      }
      if(window.setAccount) window.setAccount(user.email||user.displayName||'계정');
      if(window.bootApp) window.bootApp(items);
      setState('app');
    }catch(e){
      console.error(e);
      setState('auth');
      showErr('데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
    }
  });

  // ===== 인증 UI =====
  let mode='login';
  function resetInputs(){ ['#auth-email','#auth-pw','#auth-pw2'].forEach(s=>{const el=$(s);if(el)el.value='';}); }
  function setMode(m){
    mode=m;
    document.querySelectorAll('.auth-tab').forEach(t=>t.classList.toggle('on',t.dataset.mode===m));
    $('#auth-pw2').style.display = m==='signup'?'':'none';
    $('#auth-submit').textContent = m==='signup'?'회원가입':'로그인';
    showErr('');
  }
  document.querySelectorAll('.auth-tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));

  function mapErr(code){
    const m={
      'auth/invalid-email':'이메일 형식이 올바르지 않아요.',
      'auth/missing-password':'비밀번호를 입력해 주세요.',
      'auth/weak-password':'비밀번호는 6자 이상이어야 해요.',
      'auth/email-already-in-use':'이미 가입된 이메일이에요. 로그인해 주세요.',
      'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않아요.',
      'auth/user-not-found':'가입되지 않은 이메일이에요.',
      'auth/wrong-password':'비밀번호가 올바르지 않아요.',
      'auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 시도해 주세요.',
      'auth/network-request-failed':'네트워크 연결을 확인해 주세요.',
      'auth/operation-not-allowed':'이 로그인 방식이 콘솔에서 켜져 있지 않아요. (Authentication → Sign-in method)',
      'auth/unauthorized-domain':'이 도메인이 인증에 등록되지 않았어요. (콘솔 → Authentication → 설정 → 승인된 도메인)'
    };
    return m[code]||('오류가 발생했어요. ('+code+')');
  }
  async function submit(){
    const email=$('#auth-email').value.trim();
    const pw=$('#auth-pw').value;
    showErr(''); const btn=$('#auth-submit'); btn.disabled=true;
    try{
      if(mode==='signup'){
        if(pw!==$('#auth-pw2').value){ showErr('비밀번호가 서로 달라요.'); btn.disabled=false; return; }
        await createUserWithEmailAndPassword(auth,email,pw);
      }else{
        await signInWithEmailAndPassword(auth,email,pw);
      }
    }catch(e){ showErr(mapErr(e.code)); }
    btn.disabled=false;
  }
  $('#auth-submit').onclick=submit;
  $('#auth-pw').addEventListener('keydown',e=>{ if(e.key==='Enter'&&mode==='login')submit(); });
  $('#auth-pw2').addEventListener('keydown',e=>{ if(e.key==='Enter')submit(); });
  // 리다이렉트 로그인으로 돌아왔을 때 결과/에러 처리 (구글 에러 메시지를 그대로 표면화)
  getRedirectResult(auth).catch(e=>{ if(e&&e.code) showErr(mapErr(e.code)); });
  const _isMobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const _isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  async function googleNative(){
    // 앱(WebView)에서는 네이티브 구글 로그인 플러그인으로 인증 → Firebase 자격증명으로 로그인
    const GA = window.Capacitor.Plugins.GoogleAuth;
    const res = await GA.signIn();
    const idToken = res && res.authentication && res.authentication.idToken;
    if(!idToken) throw {code:'auth/no-id-token'};
    await signInWithCredential(auth, GoogleAuthProvider.credential(idToken));
  }
  $('#auth-google').onclick=async()=>{
    showErr('');
    const provider=new GoogleAuthProvider();
    try{
      if(_isNative){ await googleNative(); return; }
      // 모바일/웹뷰는 팝업이 자주 막혀서 리다이렉트, 데스크톱은 팝업
      if(_isMobileUA){ await signInWithRedirect(auth,provider); }
      else{ await signInWithPopup(auth,provider); }
    }catch(e){
      // 팝업이 차단되면 리다이렉트로 폴백
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){
        try{ await signInWithRedirect(auth,provider); return; }catch(e2){ showErr(mapErr(e2.code)); return; }
      }
      if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'&&String(e&&e.code||'').indexOf('popup_closed')<0) showErr(mapErr(e&&e.code));
    }
  };

  // ===== 계정 메뉴 =====
  const acctBtn=$('#acct-btn'), acctMenu=$('#acct-menu');
  if(acctBtn) acctBtn.onclick=e=>{ e.stopPropagation(); acctMenu.classList.toggle('show'); };
  document.addEventListener('click',()=>{ if(acctMenu) acctMenu.classList.remove('show'); });
  const lo=$('#acct-logout'); if(lo) lo.onclick=()=>{ acctMenu.classList.remove('show'); signOut(auth); };
}
</script>
</body>
</html>
