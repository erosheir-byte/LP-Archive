name: Build Android APK

# 이 워크플로는 GitHub 러너(안드로이드 SDK·네트워크 제약 없음)에서
# Capacitor 로 디버그 APK 를 빌드해 아티팩트로 올립니다.
# 실행: Actions 탭 → "Build Android APK" → Run workflow (수동), 또는 브랜치 push 시 자동.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LPArchive-preview.html"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web bundle (www/ 로컬 번들)
        run: node scripts/prepare-www.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Inject Google server_client_id (네이티브 구글 로그인용)
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          CID="1032038131088-pgv6aiv1b66njk867s2q4l8kq34aucee.apps.googleusercontent.com"
          if ! grep -q "server_client_id" "$STRINGS"; then
            sed -i "s#</resources>#    <string name=\"server_client_id\">$CID</string>\n</resources>#" "$STRINGS"
          fi
          # 런처에 표시될 앱 이름을 "My Vinyl" 로 강제
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">My Vinyl</string>#' "$STRINGS"
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">My Vinyl</string>#' "$STRINGS"
          echo "----- strings.xml -----"
          cat "$STRINGS"

      - name: Add camera permission (바코드 스캔용)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$MANIFEST"
          fi
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"

      - name: Inject native media session plugin (잠금화면/상태바 컨트롤)
        run: |
          python3 - <<'PY'
          import os, re, shutil
          pkgdir = 'android/app/src/main/java/app/lparchive/vinyl'
          os.makedirs(pkgdir, exist_ok=True)

          # 1) 플러그인 소스 복사
          shutil.copy('native/LPMediaPlugin.java', os.path.join(pkgdir, 'LPMediaPlugin.java'))
          print('copied LPMediaPlugin.java')

          # 2) MainActivity.java 에 registerPlugin 주입
          ma = os.path.join(pkgdir, 'MainActivity.java')
          src = open(ma).read()
          if 'registerPlugin(LPMediaPlugin.class)' not in src:
              src = ('package app.lparchive.vinyl;\n\n'
                     'import android.os.Bundle;\n'
                     'import com.getcapacitor.BridgeActivity;\n\n'
                     'public class MainActivity extends BridgeActivity {\n'
                     '  @Override\n'
                     '  public void onCreate(Bundle savedInstanceState) {\n'
                     '    registerPlugin(LPMediaPlugin.class);\n'
                     '    super.onCreate(savedInstanceState);\n'
                     '    // 30초 뒤 자동 다음곡 등 제스처 밖 재생을 허용(웹뷰 기본은 차단)\n'
                     '    try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}\n'
                     '  }\n'
                     '}\n')
              open(ma, 'w').write(src)
              print('patched MainActivity.java')
          print('----- MainActivity.java -----'); print(open(ma).read())

          # 3) AndroidManifest: POST_NOTIFICATIONS 권한 + 미디어 버튼 리시버
          mf = 'android/app/src/main/AndroidManifest.xml'
          m = open(mf).read()
          if 'POST_NOTIFICATIONS' not in m:
              m = m.replace('<application',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
          if 'LPMediaPlugin$LPMediaReceiver' not in m:
              recv = ('        <receiver android:name="app.lparchive.vinyl.LPMediaPlugin$LPMediaReceiver" '
                      'android:exported="false" />\n')
              m = re.sub(r'(</application>)', lambda mm: recv + mm.group(1), m, count=1)
          open(mf, 'w').write(m)
          print('----- AndroidManifest.xml -----'); print(open(mf).read())

          # 4) app/build.gradle: androidx.media 의존성 추가
          bg = 'android/app/build.gradle'
          g = open(bg).read()
          if 'androidx.media:media' not in g:
              g = re.sub(r'(dependencies\s*\{)', lambda mm: mm.group(1) + '\n    implementation "androidx.media:media:1.7.0"', g, count=1)
              open(bg, 'w').write(g)
              print('added androidx.media dependency')
          PY

      - name: Capacitor sync
        run: npx cap sync android

      - name: Generate launcher icon (분위기 있는 LP 이미지)
        run: |
          # icons/icon-512.png (블랙 바이닐 + 오렌지 라벨, 분위기 있는 LP)를 소스로
          # 안드로이드 런처 아이콘(레거시 + 적응형)을 생성한다.
          npm install --no-save @capacitor/assets
          mkdir -p assets
          cat > gen-icons.cjs <<'JS'
          const sharp = require('sharp');
          const src = 'icons/icon-512.png';
          (async () => {
            // 레거시 아이콘: LP 풀블리드
            await sharp(src).resize(1024, 1024, { fit: 'cover' }).png().toFile('assets/icon-only.png');
            // 적응형 배경: 앱 테마색(어두운 톤)
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 14, g: 13, b: 17, alpha: 1 } } })
              .png().toFile('assets/icon-background.png');
            // 적응형 전경: LP를 세이프존 안에 들어오도록 중앙 배치(투명 여백)
            const fg = await sharp(src).resize(760, 760, { fit: 'cover' }).png().toBuffer();
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .composite([{ input: fg, gravity: 'center' }]).png().toFile('assets/icon-foreground.png');
            console.log('launcher icon assets ready');
          })();
          JS
          node gen-icons.cjs
          npx @capacitor/assets generate --android --assetPath assets

      - name: Force fixed debug keystore (명시적 signingConfig 주입 — 항상 동일 SHA-1)
        run: |
          # AGP 기본 디버그 키가 매번 달라 등록한 SHA-1과 불일치 → code 10.
          # app/build.gradle 의 android{} 에 debug signingConfig 를 명시 주입해
          # 반드시 커밋된 고정 키스토어로 서명되게 한다.
          cp android-debug.keystore android/app/debug.keystore
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          if 'signingConfigs' not in s:
              block=("\n    signingConfigs {\n"
                     "        debug {\n"
                     "            storeFile file('debug.keystore')\n"
                     "            storePassword 'android'\n"
                     "            keyAlias 'androiddebugkey'\n"
                     "            keyPassword 'android'\n"
                     "        }\n"
                     "    }\n")
              s=re.sub(r'(android\s*\{)', r'\1'+block, s, count=1)
              open(p,'w').write(s)
              print('injected signingConfigs.debug')
          else:
              print('signingConfigs already present')
          PY
          echo '----- android/app/build.gradle (head) -----'
          sed -n '1,45p' android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LP-Archive.apk
          ls -la dist/

      - name: Verify APK signature (설치될 APK의 실제 서명 SHA-1)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "===== 설치될 LP-Archive.apk 의 실제 서명 인증서 (이게 Firebase 등록값과 같아야 함) ====="
          "$APKSIGNER" verify --print-certs dist/LP-Archive.apk | grep -iE "SHA-1|SHA-256" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lp-archive-debug-apk
          path: dist/LP-Archive.apk
          if-no-files-found: error

      - name: Publish APK to Release (고정 다운로드 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: LP 보관함 APK (최신 디버그 빌드)
          body: |
            LP 보관함 안드로이드 디버그 APK (테스트용) 입니다. 매 빌드마다 이 릴리스가 갱신됩니다.

            **설치:** 폰에서 아래 `LP-Archive.apk` 를 받아 설치 (설정 → "출처를 알 수 없는 앱/이 출처 허용" 필요).
            웹 앱 셸을 기기에 내장(번들)해 실행하며, 데이터는 Firebase 로 동기화됩니다.

            > ⚠️ 이 APK 는 디버그 서명본으로 **스토어 업로드용이 아닙니다.**
            > 구글 플레이 업로드용 서명 AAB 는 "Release Android (signed AAB)" 워크플로를 사용하세요.
          files: dist/LP-Archive.apk
          make_latest: "true"
