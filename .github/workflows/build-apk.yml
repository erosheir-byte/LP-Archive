name: Build Android APK

# 이 워크플로는 GitHub 러너(안드로이드 SDK·네트워크 제약 없음)에서
# Capacitor 로 디버그 APK 를 빌드해 아티팩트로 올립니다.
# 실행: Actions 탭 → "Build Android APK" → Run workflow (수동), 또는 브랜치 push 시 자동.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/busy-meitner-JQZ1E
    paths-ignore:
      - "**.md"
      - "LPArchive-preview.html"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web dir (webDir=., 자기복사 방지용 전용 폴더)
        run: |
          # capacitor webDir 가 저장소 루트(".")라 android/ 까지 자기 자신으로 복사하려다
          # 실패하므로, 웹 자산만 담은 www/ 를 만들어 빌드 시 webDir 로 사용한다.
          # (APK 는 server.url=lp-archive.web.app 원격 로드 → www 는 오프라인 폴백 셸)
          mkdir -p www/icons
          cp index.html www/ 2>/dev/null || true
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r icons/. www/icons/ 2>/dev/null || true
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.webDir='www';require('fs').writeFileSync(f,JSON.stringify(c,null,2));console.log('webDir ->',c.webDir);"

      - name: Add Android platform
        run: npx cap add android

      - name: Inject Google server_client_id (네이티브 구글 로그인용)
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          CID="1032038131088-pgv6aiv1b66njk867s2q4l8kq34aucee.apps.googleusercontent.com"
          if ! grep -q "server_client_id" "$STRINGS"; then
            sed -i "s#</resources>#    <string name=\"server_client_id\">$CID</string>\n</resources>#" "$STRINGS"
          fi
          echo "----- strings.xml -----"
          cat "$STRINGS"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/LP-Archive.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lp-archive-debug-apk
          path: dist/LP-Archive.apk
          if-no-files-found: error

      - name: Publish APK to Release (고정 다운로드 링크)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: LP 보관함 APK (최신 디버그 빌드)
          body: |
            LP 보관함 안드로이드 디버그 APK 입니다. 매 빌드마다 이 릴리스가 갱신됩니다.

            **설치:** 폰에서 아래 `LP-Archive.apk` 를 받아 설치 (설정 → "출처를 알 수 없는 앱/이 출처 허용" 필요).
            앱은 https://lp-archive.web.app 를 로드합니다.
          files: dist/LP-Archive.apk
          make_latest: "true"
