name: Build Android APK

# 이 워크플로는 GitHub 러너(안드로이드 SDK·네트워크 제약 없음)에서
# Capacitor 로 디버그 APK 를 빌드해 아티팩트로 올립니다.
# 실행: Actions 탭 → "Build Android APK" → Run workflow (수동), 또는 브랜치 push 시 자동.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/busy-meitner-JQZ1E
    paths-ignore:
      - "**.md"
      - "LPArchive-preview.html"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Inject Google server_client_id (네이티브 구글 로그인용)
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          CID="1032038131088-pgv6aiv1b66njk867s2q4l8kq34aucee.apps.googleusercontent.com"
          if ! grep -q "server_client_id" "$STRINGS"; then
            sed -i "s#</resources>#    <string name=\"server_client_id\">$CID</string>\n</resources>#" "$STRINGS"
          fi
          echo "----- strings.xml -----"
          cat "$STRINGS"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lp-archive-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
