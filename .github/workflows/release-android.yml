name: Release Android (signed AAB)

# 구글 플레이 콘솔 업로드용 *서명된 AAB* 를 빌드합니다.
# 디버그 APK 워크플로(build-apk.yml)와 달리, 실제 출시용 릴리스 키로 서명합니다.
#
# 사전 준비 — 저장소 Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   : 릴리스 keystore(.jks) 를 base64 로 인코딩한 문자열
#                               (생성: keytool ...  →  base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD : keystore 비밀번호
#   ANDROID_KEY_ALIAS         : 키 별칭(alias)
#   ANDROID_KEY_PASSWORD      : 키 비밀번호
#
# 실행: Actions 탭 → "Release Android (signed AAB)" → Run workflow
#       versionName / versionCode 를 입력합니다. (versionCode 는 매 업로드마다 1 이상 증가해야 함)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"
      versionCode:
        description: "버전 코드 (정수, 매 업로드마다 증가)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web bundle (www/ 로컬 번들)
        run: node scripts/prepare-www.mjs

      - name: Add Android platform
        run: npx cap add android

      - name: Inject Google server_client_id + 앱 이름
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml
          CID="1032038131088-pgv6aiv1b66njk867s2q4l8kq34aucee.apps.googleusercontent.com"
          if ! grep -q "server_client_id" "$STRINGS"; then
            sed -i "s#</resources>#    <string name=\"server_client_id\">$CID</string>\n</resources>#" "$STRINGS"
          fi
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Turnit</string>#' "$STRINGS"
          sed -i 's#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">Turnit</string>#' "$STRINGS"

      - name: Add camera permission (바코드 스캔용)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$MANIFEST"
          fi

      - name: Inject AdMob App ID + AD_ID permission
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          # Turnit 애드몹 App ID
          APPID="ca-app-pub-5071878284765662~2385423471"
          grep -q "com.google.android.gms.permission.AD_ID" "$MF" || \
            sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n    <application#' "$MF"
          grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MF" || \
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APPID\" />\n</application>#" "$MF"

      - name: Inject native media session plugin (잠금화면/상태바 컨트롤)
        run: |
          python3 - <<'PY'
          import os, re, shutil
          pkgdir = 'android/app/src/main/java/app/lparchive/vinyl'
          os.makedirs(pkgdir, exist_ok=True)

          # 1) 플러그인 소스 복사
          shutil.copy('native/LPMediaPlugin.java', os.path.join(pkgdir, 'LPMediaPlugin.java'))
          print('copied LPMediaPlugin.java')

          # 2) MainActivity.java 에 registerPlugin 주입
          ma = os.path.join(pkgdir, 'MainActivity.java')
          src = open(ma).read()
          if 'registerPlugin(LPMediaPlugin.class)' not in src:
              src = ('package app.lparchive.vinyl;\n\n'
                     'import android.os.Bundle;\n'
                     'import com.getcapacitor.BridgeActivity;\n\n'
                     'public class MainActivity extends BridgeActivity {\n'
                     '  @Override\n'
                     '  public void onCreate(Bundle savedInstanceState) {\n'
                     '    registerPlugin(LPMediaPlugin.class);\n'
                     '    super.onCreate(savedInstanceState);\n'
                     '    // 30초 뒤 자동 다음곡 등 제스처 밖 재생을 허용(웹뷰 기본은 차단)\n'
                     '    try { getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false); } catch (Exception e) {}\n'
                     '  }\n'
                     '}\n')
              open(ma, 'w').write(src)
              print('patched MainActivity.java')

          # 3) AndroidManifest: POST_NOTIFICATIONS 권한 + 미디어 버튼 리시버
          mf = 'android/app/src/main/AndroidManifest.xml'
          m = open(mf).read()
          if 'POST_NOTIFICATIONS' not in m:
              m = m.replace('<application',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
          if 'LPMediaPlugin$LPMediaReceiver' not in m:
              recv = ('        <receiver android:name="app.lparchive.vinyl.LPMediaPlugin$LPMediaReceiver" '
                      'android:exported="false" />\n')
              m = re.sub(r'(</application>)', lambda mm: recv + mm.group(1), m, count=1)
          open(mf, 'w').write(m)

          # 4) app/build.gradle: androidx.media 의존성 추가
          bg = 'android/app/build.gradle'
          g = open(bg).read()
          if 'androidx.media:media' not in g:
              g = re.sub(r'(dependencies\s*\{)', lambda mm: mm.group(1) + '\n    implementation "androidx.media:media:1.7.0"', g, count=1)
              open(bg, 'w').write(g)
              print('added androidx.media dependency')
          PY

      - name: Target/compile SDK 35 (Google Play 최소 API 레벨 충족)
        run: |
          VARS=android/variables.gradle
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 35/' "$VARS"
          sed -i -E 's/targetSdkVersion = [0-9]+/targetSdkVersion = 35/' "$VARS"
          # compileSdk 35 를 지원하는 AGP / Gradle 로 상향
          sed -i -E 's#com\.android\.tools\.build:gradle:[0-9.]+#com.android.tools.build:gradle:8.7.2#' android/build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          echo "----- variables.gradle -----"; cat "$VARS"
          grep -E "gradle:" android/build.gradle
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Set version (versionName / versionCode)
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ github.event.inputs.versionName }}\"/" "$GRADLE"
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.event.inputs.versionCode }}/" "$GRADLE"
          grep -E "versionName|versionCode" "$GRADLE"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Generate launcher icon
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets
          cat > gen-icons.cjs <<'JS'
          const sharp = require('sharp');
          const src = 'icons/icon-512.png';
          (async () => {
            await sharp(src).resize(1024, 1024, { fit: 'cover' }).png().toFile('assets/icon-only.png');
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 232, g: 100, b: 60, alpha: 1 } } })
              .png().toFile('assets/icon-background.png');
            const fg = await sharp(src).resize(760, 760, { fit: 'cover' }).png().toBuffer();
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
              .composite([{ input: fg, gravity: 'center' }]).png().toFile('assets/icon-foreground.png');
          })();
          JS
          node gen-icons.cjs
          npx @capacitor/assets generate --android --assetPath assets

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없습니다. 릴리스 키스토어를 먼저 등록하세요 (RELEASE.md 참고)."
            exit 1
          fi
          # 윈도우에서 복사한 값에 CRLF/공백이 섞여도 동작하도록 전부 제거 후 디코드
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/release.jks || {
            echo "::error::ANDROID_KEYSTORE_BASE64 값이 올바른 base64 가 아닙니다. release.jks 를 다시 변환해 시크릿을 갱신하세요."
            exit 1
          }
          echo "keystore decoded ($(stat -c%s android/app/release.jks) bytes)"

      - name: Inject release signingConfig
        run: |
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          block=("\n    signingConfigs {\n"
                 "        release {\n"
                 "            storeFile file('release.jks')\n"
                 "            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
                 "            keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
                 "            keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
                 "        }\n"
                 "    }\n")
          if 'signingConfigs' not in s:
              s=re.sub(r'(android\s*\{)', r'\1'+block, s, count=1)
          # release buildType 에 signingConfig 연결
          s=re.sub(r'(buildTypes\s*\{\s*release\s*\{)',
                   r'\1\n            signingConfig signingConfigs.release', s, count=1)
          open(p,'w').write(s)
          print('release signingConfig injected')
          PY
          sed -n '1,60p' android/app/build.gradle

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Collect AAB
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist/My-Vinyl-${{ github.event.inputs.versionName }}-${{ github.event.inputs.versionCode }}.aab"
          ls -la dist/

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-vinyl-release-aab
          path: dist/*.aab
          if-no-files-found: error
