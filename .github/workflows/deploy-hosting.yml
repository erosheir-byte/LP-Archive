name: Deploy to Firebase Hosting

# lp-archive.web.app 에 웹(index.html, sw.js, manifest, icons)을 배포합니다.
# APK 는 이 주소를 원격 로드하므로, 배포하면 앱도 즉시 최신 화면으로 갱신됩니다.
#
# 사전 준비(1회): 본인 PC에서  firebase login:ci  실행 → 출력된 토큰을
#   GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret
#   이름: FIREBASE_TOKEN  값: <발급된 토큰>  으로 추가.
#
# 실행: Actions 탭 → "Deploy to Firebase Hosting" → Run workflow (원하는 브랜치 선택),
#       또는 main 브랜치 push 시 자동.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "firebase.json"
      - ".firebaserc"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy (hosting only)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::FIREBASE_TOKEN 시크릿이 없습니다. README/워크플로 주석의 안내대로 추가하세요."
            exit 1
          fi
          firebase deploy --only hosting --project lp-archive --non-interactive --token "$FIREBASE_TOKEN"
