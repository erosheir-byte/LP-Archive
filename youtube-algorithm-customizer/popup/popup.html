<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>FocusTube 설정</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎯 FocusTube</h1>
    <label class="switch" title="홈 피드 교체 켜기/끄기">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </header>
  <p class="tagline">유튜브 홈 피드를 내가 정한 주제로 교체합니다.</p>

  <section>
    <h2>피드 주제</h2>
    <div id="preset-list" class="preset-list"></div>
    <textarea
      id="custom-keywords"
      class="hidden"
      rows="4"
      placeholder="검색 키워드를 한 줄에 하나씩 입력하세요&#10;예) 공부 자극 영상&#10;예) study with me"
    ></textarea>
  </section>

  <section>
    <h2>집중 옵션</h2>
    <label class="check"><input type="checkbox" id="hideShorts" /> Shorts 숨기기</label>
    <label class="check"><input type="checkbox" id="hideRelated" /> 시청 중 사이드바 추천 숨기기</label>
    <label class="check"><input type="checkbox" id="hideComments" /> 댓글 숨기기</label>
  </section>

  <section>
    <h2>알고리즘 초기화</h2>
    <p class="hint">
      기존 추천을 지우려면 시청·검색 기록을 삭제한 뒤,
      교체된 피드의 영상을 시청해 알고리즘을 새로 학습시키세요.
    </p>
    <a class="link-btn" href="https://myactivity.google.com/product/youtube" target="_blank" rel="noopener">
      ① 시청·검색 기록 삭제 (구글 내 활동)
    </a>
    <a class="link-btn" href="https://www.youtube.com/feed/history" target="_blank" rel="noopener">
      ② 유튜브 시청 기록 관리
    </a>
    <p class="hint small">
      ③ 그 다음, 새 홈 피드에서 영상을 시청하면 알고리즘이 그 주제로 재학습됩니다.
    </p>
  </section>

  <script src="../common/presets.js"></script>
  <script src="popup.js"></script>
</body>
</html>
